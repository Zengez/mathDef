name: Screen independent rational-Cauchy sequence and equivalence definitions

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-cauchy-batch51.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest independent Wave 2 research state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the portable independent research workflow
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen two independently sourced Cauchy foundation definitions
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cauchy_meanings_batch51 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh source review counts without modifying original decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Certify source evidence, historical formulation reviews, and unsealed independent graph
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert freeze["state"]=="FROZEN"
          assert digest(old.publication())==freeze["published_catalog_digest"]
          counts={"sources":14,"terms":395,"observations":818,"meanings":494,"relations":664}
          assert {stage:len(w.records(stage)) for stage in counts}==counts
          assert not any(w.state(stage).get("sealed") for stage in counts)
          for stage in ("sources","terms","observations","relations"):
            assert all(w.records(stage).get(k)==v for k,v in old.records(stage).items())
          meanings=w.records("meanings")
          for key in ("meaning.wave2.real51.rational-cauchy","meaning.wave2.real51.rational-cauchy-equivalence"):
            assert meanings[key]["formulations"][0]["review_state"]=="screened"
          old_reviews=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_504_before_real51.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(old_reviews)==504 and len(current)==506
          idx={r["formulation_id"]:r for r in current}
          assert len(idx)==506
          for previous in old_reviews:
            revised=idx[previous["formulation_id"]]
            assert all(revised.get(key)==val for key,val in previous.items() if key!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(meanings.values())) for r in current)
          assert {id for r in current for id in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(meanings,w.records("relations"))
          report=json.loads((w.root/"state/wave2_cauchy_meaning_screen_batch51.json").read_text())
          assert report["old_504_review_dispositions_preserved"]
          assert report["old_664_links_preserved"]
          assert report["equivalence_uses_only_rational_arithmetic_not_circular_real_limits"]
          assert report["remaining_Cauchy_quotient_and_positivity_candidates_unpromoted"]==2
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          coverage=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==395 and coverage["mathematical_candidate_meanings_screened"]==75
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent research and historical review provenance
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen rational Cauchy and equivalence definitions preserving 504 older decisions"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
