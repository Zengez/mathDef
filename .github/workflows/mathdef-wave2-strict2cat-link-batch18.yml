name: Resolve strict-source equivalence relationship while preserving weak-case ambiguity

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-strict2cat-link-batch18.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start from latest independent source-screened state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all research code and run tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Review exact Stacks strict 2-category relationship and historical held disposition
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_18.jsonl
      - name: Verify mathematical source scope, frozen Wave 1, and zero remaining original gap holds
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          assert len(old.records("relations"))==445
          assert len(w.records("terms"))==363
          assert len(w.records("observations"))==786
          assert len(w.records("meanings"))==462
          assert len(w.records("relations"))==622
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          forms={f["id"]:m["id"] for m in w.records("meanings").values() for f in m["formulations"]}
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==len(forms)==474
          assert {id for r in reviews for id in r["relation_ids"]}==set(w.records("relations"))
          target_id="form.ec5e3a0d13f85f3a.equivalence-objects-two-category"
          outcome=next(r for r in reviews if r["formulation_id"]==target_id)
          assert outcome["decision"]=="linked"
          assert outcome["original_wave1_disposition"]=="held_ambiguity"
          assert len(outcome["relation_ids"])==1
          source=w.records("meanings")["meaning.ec5e3a0d13f85f3a.equivalence-objects-two-category"]
          assert "strict 2-category" in source["formulations"][0]["text"]
          assert sum(x["decision"]=="held_ambiguity" for x in reviews)==0
          assert sum(x["decision"]=="needs_review" for x in reviews)==0
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_link_review_batch_18.json").read_text())
          assert report["added_source_grounded_links"]==1
          assert report["total_screened_links"]==622
          assert report["dependency_graph_has_cycles"] is False
          assert report["original_wave1_dispositions_preserved_in_review_fields"]
          assert report["human_peer_verified"] is False
          assert report["wave2_link_stage_sealed"] is False
          future=json.loads((w.root/"state/wave2_strict2cat_equivalence_context_correction.json").read_text())
          assert future["weak_bicategory_variant_remains_future_research"] is True
          print(json.dumps(report,indent=2))
          PY
      - name: Commit independent new strict 2-category link and historical disposition override
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resolve final original held strict-category source gap while preserving weak-context research"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
