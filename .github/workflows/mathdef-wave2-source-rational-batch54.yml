name: Independently intake rational sequence and arithmetic source evidence — Wave 2 Batch 54

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-source-rational-batch54.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  ingest-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch current independent research state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run portable source and mathematics regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Ingest only source-reviewed rational foundational terms and observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_rational_foundations_source_batch54 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile append-only term coverage and preserve prior 395 decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check frozen wave, identities, old decisions and no accidental meaning additions
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":399,"observations":822,"meanings":496,"relations":670}
          assert {s:len(w.records(s)) for s in expected}==expected
          assert not any(w.state(s).get("sealed") for s in expected)
          for stage in ("sources","terms","observations","relations"):
            assert all(w.records(stage).get(k)==v for k,v in old.records(stage).items())
          prior=jsonl(w.root/"state/wave2_term_coverage_snapshot_395.jsonl")
          current=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          indexed={r["term_id"]:r for r in current}
          assert len(prior)==395 and len(current)==399 and len(indexed)==399
          assert all(indexed[p["term_id"]]==p for p in prior)
          assert len(jsonl(w.root/"state/wave2_formulation_reviews.jsonl"))==508
          summary=json.loads((w.root/"state/wave2_rational_source_intake_batch54.json").read_text())
          assert summary["strict_positive_not_conflated_with_nonnegative"]
          assert summary["new_meanings_screened"]==0
          assert not summary["original_production_mathdef_consulted"]
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit independent Wave 2 evidence and history only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Source rational sequence, number, absolute value and strict positivity independently"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
