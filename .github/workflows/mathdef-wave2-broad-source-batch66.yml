name: Source independently reviewed σ-algebra and compactness variants — Batch 66

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-broad-source-batch66.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read authoritative independent workspace
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify math research pipeline regression
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Add two independent source terms and four sourced variant observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_broad_variants_source_batch66 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Update comprehensive source coverage with historical 406-term preservation
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Fail closed on source identity and previous review mutations
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":408,"observations":834,"meanings":508,"relations":691}
          assert {s:len(w.records(s)) for s in expect}==expect
          assert not any(w.state(s).get("sealed") for s in expect)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in old.records(s).items())
          previous=jsonl(w.root/"state/wave2_term_coverage_snapshot_406.jsonl")
          latest=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          index={x["term_id"]:x for x in latest}
          assert len(previous)==406 and len(latest)==len(index)==408
          assert all(index[x["term_id"]]==x for x in previous)
          assert len(jsonl(w.root/"state/wave2_formulation_reviews.jsonl"))==521
          for key in ("sigma-algebra","compact-space"):
            term="term.wave2.broad66."+key
            observed=[o for o in w.records("observations").values() if o["term_id"]==term]
            assert len(observed)==2 and len(set(o["id"] for o in observed))==2
          info=json.loads((w.root/"state/wave2_broad_source_batch66.json").read_text())
          assert info["sigma_algebra_existing_meaning_detected"]
          assert info["quasi_compact_existing_context_detected"]
          assert info["screened_meanings_added"]==0
          assert not info["original_production_mathdef_used"]
          print(json.dumps(info,indent=2))
          PY
      - name: Commit reviewed independent source evidence only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Source dual independent σ-algebra and compactness formulations"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
