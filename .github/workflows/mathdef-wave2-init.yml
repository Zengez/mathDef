name: Initialize independent Wave 2 from verified frozen Wave 1

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-init.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  fork-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh GitHub main before any mutation
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete regression tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Verify frozen Wave 1 remains intact, fork Wave 2, and generate work queue
        run: |
          python - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          from research_pipeline.engine.core import Workspace,PipelineError,atomic_json,digest,jsonl
          w1=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w2=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert not w2.root.exists(), "Wave 2 workspace already exists: do not overwrite it"
          frozen=json.loads((w1.root/"state/wave1_freeze.json").read_text(encoding="utf-8"))
          assert frozen["state"]=="FROZEN" and frozen["eligible_for_wave2_planning_after_user_review"]
          assert not frozen["wave2_started"] and not frozen["original_production_corpus_compared"]
          assert frozen["published_catalog_digest"]==digest(w1.publication())
          assert frozen["stage5_sealed_relation_digest"]==w1.state("relations")["record_digest"]
          for n,sha in frozen["preview_sha256"].items():
              assert hashlib.sha256((w1.root/"preview"/n).read_bytes()).hexdigest()==sha
          immutable_files={str(x):hashlib.sha256(x.read_bytes()).hexdigest()
              for x in (w1.root/"state/wave1_freeze.json",w1.root/"state/checkpoint.json",
                  w1.root/"state/stage5_review.json",w1.root/"state/relations.json",
                  w1.root/"state/publication.json",w1.root/"published/catalog.json",
                  *[w1.root/"records"/(s+".jsonl")
                    for s in ("sources","terms","observations","meanings","relations")])}
          lineage=w1.fork_second_wave(w2.root)
          assert lineage["mode"]=="second_wave"
          assert lineage["first_wave_digest"]==frozen["published_catalog_digest"]
          for s,n in (("sources",9),("terms",318),("observations",749),
                      ("meanings",419),("relations",445)):
              assert len(w2.records(s))==n,(s,len(w2.records(s)))
              assert not w2.state(s).get("sealed"),"Inherited research records must be reopenable"
              assert digest(list(w1.records(s).values()))==digest(list(w2.records(s).values()))
          configuration=w2.config()
          configuration["project"]="mathDef independent reconstruction — Wave 2"
          configuration["independent_second_wave"]=True
          configuration["frozen_first_wave_catalog_sha256"]=frozen["published_catalog_digest"]
          atomic_json(w2.root/"project.json",configuration)
          queue=w2.wave2_plan()
          assert queue["tasks"]==318*(1+9)+419,queue
          task_rows=jsonl(w2.root/"wave2/tasks.jsonl")
          assert len(task_rows)==len({x["id"] for x in task_rows})
          expected_kinds={"discover_sources_from_term","search_variants_in_source","audit_relationships"}
          assert {x["kind"] for x in task_rows}==expected_kinds
          for fn,expected_sha in immutable_files.items():
              assert hashlib.sha256(Path(fn).read_bytes()).hexdigest()==expected_sha,(
                  "Frozen Wave 1 was modified",fn)
          report={
             "phase":"wave2_initialized_and_queued",
             "status":"passed",
             "wave1_frozen_catalog_digest":frozen["published_catalog_digest"],
             "wave1_sealed_relation_digest":frozen["stage5_sealed_relation_digest"],
             "wave1_mutations":0,
             "wave2_workspace":"research_pipeline/experiments/reconstruction-v2-independent",
             "inherited_counts":{x:len(w2.records(x)) for x in
                ("sources","terms","observations","meanings","relations")},
             "all_inherited_stages_reopenable":True,
             "generic_planning_tasks":len(task_rows),
             "next":"Prioritize missing foundations, source-blocked terms, repeated meanings and four held links; research source candidates in new Wave 2 only",
             "original_production_corpus_compared":False,
             "run_id":os.environ.get("GITHUB_RUN_ID",""),
             "origin_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          }
          atomic_json(w2.root/"state/wave2_init_evidence.json",report)
          print(json.dumps(report,indent=2))
          PY
      - name: Persist entire independent Wave 2 fork without touching Wave 1
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          git diff --cached --name-only | grep '^research_pipeline/experiments/reconstruction-v2-independent/'
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then
            echo "Unsafe staged changes outside Wave 2!" >&2
            exit 1
          fi
          git commit -m "Fork frozen independent Wave 1 into editable Wave 2 and queue 3599 research tasks"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Unable to persist Wave 2 initial data" >&2
          exit 1
