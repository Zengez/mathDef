name: Admit independent metric and functional-analysis source variants — Batch 97

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-functional-analysis-source-batch97.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load authoritative independent math research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated portable research pipeline tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four source terms and seven vetted contextual formulation observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_functional_analysis_source_batch97 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile all previous source term review dispositions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Preserve frozen Wave 1 and 428 historic term review records
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":432,"observations":872,"meanings":530,"relations":735}
          assert {s:len(w.records(s)) for s in expect}==expect
          assert not any(w.state(s).get("sealed") for s in expect)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(i)==v for i,v in frozen.records(s).items())
          old=jsonl(w.root/"state/wave2_term_coverage_snapshot_428.jsonl")
          updated=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          idx={r["term_id"]:r for r in updated}
          assert len(old)==428 and len(updated)==len(idx)==432
          assert all(idx[r["term_id"]]==r for r in old)
          assert len(jsonl(w.root/"state/wave2_formulation_reviews.jsonl"))==554
          for key,n in (("metric-space",2),("norm-on-vector-space",2),("normed-vector-space",1),("inner-product-space",2)):
            tid="term.wave2.analysis97."+key
            assert len([r for r in w.records("observations").values() if r["term_id"]==tid])==n
          report=json.loads((w.root/"state/wave2_analysis97_source_intake.json").read_text())
          assert report["metric_nonempty_source_scope_preserved"]
          assert report["real_complex_inner_product_contexts_distinguished"]
          assert report["previous_428_term_decisions_preserved"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only vetted independent source evidence and coverage history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Intake metric, norm and inner-product source variants preserving 428 prior source reviews"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
