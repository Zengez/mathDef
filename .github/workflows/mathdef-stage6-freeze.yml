name: Freeze isolated corrected Wave 1 after Stage 6 review

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage6-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage6-freeze
  cancel-in-progress: false

jobs:
  freeze-first-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh immutable source snapshot and test code
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete independent Python and JavaScript regression suite
        run: |
          python -m unittest discover -s research_pipeline/tests -v
          node --check research_pipeline/adapters/mathdef/preview.js
          node --check research_pipeline/experiments/reconstruction-v1-recovery/preview/preview.js
      - name: Require sealed Stage 5, exact Stage 6 publication, matching Chromium proof and no production dependency
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from collections import Counter
          from pathlib import Path
          from research_pipeline.engine.core import Workspace, atomic_json, digest
          root=Path("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace(root)
          for st,num in (("terms",318),("observations",749),("meanings",419),("relations",445)):
              assert w.state(st)["sealed"] and len(w.records(st))==num,(st,w.state(st))
              assert w.state(st)["record_digest"]==digest(list(w.records(st).values())),st
          assert w.state("sources")["sealed"]
          review=json.loads((root/"state/stage5_review.json").read_text())
          assert review["complete"] and review["sealed"]
          assert review["formulations"]==review["reviewed"]==431
          assert review["needs_review"]==0
          assert review["decisions"]=={"linked":338,"no_supported_target":89,"held_ambiguity":4}
          sealed=json.loads((root/"state/stage5_seal_evidence.json").read_text())
          assert sealed["sealed_relation_digest"]==w.state("relations")["record_digest"]
          pub=json.loads((root/"published/catalog.json").read_text())
          assert len(pub["meanings"])==419 and len(pub["relations"])==445
          publication=json.loads((root/"state/publication.json").read_text())
          assert publication["sha256"]==digest(pub)
          preview=json.loads((root/"preview/catalog.json").read_text())
          assert len(preview["groups"])==415 and len(preview["relations"])==445
          assert sum(len(g["meanings"]) for g in preview["groups"])==419
          assert sum(len(m["formulations"]) for g in preview["groups"] for m in g["meanings"])==431
          stage6=json.loads((root/"state/stage6_review.json").read_text())
          assert stage6["publication_sha256"]==publication["sha256"]
          assert stage6["preview_term_search_groups"]==415
          assert stage6["precise_source_tag_links_checked"]==431
          smoke=json.loads((root/"state/stage6_browser_smoke.json").read_text())
          assert smoke["status"]=="passed" and smoke["checked_precise_citation_links"]
          assert smoke["checked_cross_source_variant_grouping"]
          assert smoke["checked_pagination"] and smoke["checked_mobile_viewport_width"]==375
          assets={}
          for filename,label in (("index.html","preview_index"),("preview.js","preview_script"),("preview.css","preview_styles")):
              blob=(root/"preview"/filename).read_bytes()
              sha=hashlib.sha256(blob).hexdigest()
              assert smoke[label+"_sha256"]==sha,("Stale browser smoke",filename,sha,smoke.get(label+"_sha256"))
              assets[filename]=sha
          for group in preview["groups"]:
              assert len({m["display_term"].casefold().strip() for m in group["meanings"]})==1
              for meaning in group["meanings"]:
                  for formulation in meaning["formulations"]:
                      assert formulation["sources"]
                      for source in formulation["sources"]:
                          assert source["locator"].startswith("https://stacks.math.columbia.edu/tag/")
          assert (Path("research_pipeline/STAGE6_EDITORIAL_REVIEW_2026-10-19.md")).exists()
          assert not (root/"state/wave1_freeze.json").exists(), "Wave 1 already frozen; do not overwrite"
          report={
            "state":"FROZEN",
            "scope":"Independent corrected mathDef first-wave research reconstruction",
            "workspace":"research_pipeline/experiments/reconstruction-v1-recovery",
            "sources_sealed":True,
            "terms":318,
            "source_observations":749,
            "contextual_meanings":419,
            "formulations":431,
            "mathematical_relationships":445,
            "term_search_groups":415,
            "no_supported_target":89,
            "held_relation_ambiguities":4,
            "stage5_sealed_relation_digest":sealed["sealed_relation_digest"],
            "published_catalog_digest":publication["sha256"],
            "preview_sha256":assets,
            "stage6_python_and_browser_qa":"passed",
            "stage6_chromium_run_id":smoke["workflow_run_id"],
            "stage6_browser_qa_matches_exact_preview_bytes":True,
            "stage6_mathematical_editorial_spotchecks_documented":True,
            "stage6_external_human_visual_approval":False,
            "mathematically_peer_reviewed":False,
            "wave2_started":False,
            "eligible_for_wave2_planning_after_user_review":True,
            "original_production_corpus_compared":False,
            "note":"Freeze means immutable-by-digest Wave 1 input for later Wave 2; it is not a claim of complete mathematical coverage or certified content.",
            "origin_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "github_actions_run_id":os.environ.get("GITHUB_RUN_ID","")
          }
          atomic_json(root/"state/wave1_freeze.json",report)
          print(json.dumps(report,indent=2))
          PY
      - name: Persist independent Wave 1 technical freeze without modifying production definitions
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v1-recovery/state/wave1_freeze.json
          if git diff --cached --quiet; then
            echo "No new freeze record was created" >&2
            exit 1
          fi
          git commit -m "Freeze technically reviewed independent Wave 1 Stage 6 corpus and browser-tested prototype"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Unable to commit Wave 1 freeze safely" >&2
          exit 1
