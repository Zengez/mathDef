name: Screen formal polynomial degree Riemann integral and moment meanings

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-polynomial-integral24.yml'
      - 'research_pipeline/engine/wave2_screen_polynomial_integral_moment24.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh independent source and mathematical history
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all mathDef pipeline modules and execute isolated regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually screen three exact-source mathematical formulations
        run: |
          python -m research_pipeline.engine.wave2_screen_polynomial_integral_moment24 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Update source coverage with no automatic meaning/source-status promotion
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify precisely scoped candidate variants and frozen historical audit
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          wave1=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((wave1.root/"state/wave1_freeze.json").read_text())
          assert digest(wave1.publication())==frozen["published_catalog_digest"]
          expect={"sources":9,"terms":371,"observations":794,"meanings":474,"relations":626}
          for s,n in expect.items():
              assert len(w.records(s))==n,s
              assert not w.state(s).get("sealed"),s
          assert all(w.records("terms").get(k)==v for k,v in wave1.records("terms").items())
          assert all(w.records("observations").get(k)==v for k,v in wave1.records("observations").items())
          past=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_483_before_foundations24.jsonl")
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(past)==483 and len(reviews)==486
          index={r["formulation_id"]:r for r in reviews}
          assert len(index)==486
          for prior in past:
              now=index[prior["formulation_id"]]
              assert {k:v for k,v in now.items() if k!="meaning_catalog_digest"}=={
                      k:v for k,v in prior.items() if k!="meaning_catalog_digest"}
          assert sum(r["decision"]=="needs_review" for r in reviews)==3
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(w.records("relations"))
          assert len(w.records("relations"))==626
          mm=w.records("meanings")
          for k in ("nonzero-polynomial-degree","tagged-riemann-integral","orthogonality-measure-moment"):
              assert mm["meaning.wave2.foundation."+k]["formulations"][0]["review_state"]=="screened"
          check_cycles(mm,w.records("relations"))
          report=json.loads((w.root/"state/wave2_foundations_batch_24_screened.json").read_text())
          assert report["screened_contextual_meanings"]==474
          assert report["formulations"]==486
          assert report["historical_483_reviews_preserved"]
          assert report["previous_screened_links_preserved"]==626
          assert report["moment_finiteness_hypotheses_retained"]
          assert report["zero_polynomial_degree_context_separated"]
          assert report["human_peer_verified"] is False
          coverage=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==371
          assert coverage["mathematical_candidate_meanings_screened"]==55
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent Wave 2 meaning screens with complete source lineage
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen three mathematical polynomial Riemann integral and raw moment contexts preserving 483 reviews"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
