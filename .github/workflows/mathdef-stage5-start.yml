name: Prepare independent Stage 5 and ingest screened link batch 01

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage5-start.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage5-reconstruction-writes
  cancel-in-progress: false

jobs:
  start-stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out freshest committed Stage 5 state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated research pipeline including Stage 5 gates
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Initialize ledger only once (safe to replay)
        run: |
          set -euo pipefail
          if [ ! -f research_pipeline/experiments/reconstruction-v1-recovery/state/stage5_formulation_reviews.jsonl ]; then
            python -m research_pipeline.engine.stage5_review_gate \
              --workspace research_pipeline/experiments/reconstruction-v1-recovery \
              --prepare
          fi
      - name: Ingest source-screened Stage 5 batch without sealing prematurely
        run: |
          python -m research_pipeline.engine.stage5_review_gate \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery \
            --apply-batch research_pipeline/experiments/reconstruction-v1-recovery/intake/stage5-curated-batch-01.jsonl
      - name: Confirm remaining formulations are still explicitly pending
        run: |
          python -m research_pipeline.engine.stage5_review_gate \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery --audit
      - name: Commit and retry safely on concurrent changes
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/records/relations.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/state/relations.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage5_formulation_reviews.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/tasks/relations.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/tasks/relations.summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Start audited Stage 5 with all formulations queued and 16 screened dependencies"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Could not persist Stage 5 checkpoint safely" >&2
            exit 1
          fi
