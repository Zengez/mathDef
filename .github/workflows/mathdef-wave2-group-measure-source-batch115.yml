name: Admit group orbit stabilizer pushforward and partition source evidence — Batch 115
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-group-measure-source-batch115.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress reusable engine and mathematical adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four directly read source topics and six individual observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_group_measure_source_batch115 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independent source term coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate frozen Wave1, source-only counts and historic reviews
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":457,"observations":912,"meanings":564,"relations":794}
          assert {k:len(w.records(k)) for k in expected}==expected
          assert not any(w.state(k).get("sealed") for k in expected)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==v for i,v in first.records(k).items())
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==594
          assert dict(Counter(r["decision"] for r in reviews))=={"linked":588,"no_supported_target":6}
          assert {i for r in reviews for i in r["relation_ids"]}==set(w.records("relations"))
          held=jsonl(w.root/"wave2/directional112_quarantined_source_claims.jsonl")
          assert len(held)==1 and held[0]["observation_id"] not in {e for m in w.records("meanings").values() for f in m["formulations"] for e in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_group115_source_intake.json").read_text())
          assert report["new_mathematical_meanings"]==report["new_prerequisite_links"]==0
          assert report["orbit_equivalent_source_forms"] and report["set_partition_equivalent_source_forms"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent source records and provenance
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit sourced orbit stabilizer pushforward and partition observations"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
