name: Screen three Wave 2 foundations and preserve all inherited link decisions

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-expand-screen-meanings.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh authoritative Wave 2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full isolated regression suite
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Individually screen each meaning and atomically rebase all 440 prior reviews
        run: |
          python -m research_pipeline.engine.wave2_expand_screen_meanings \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh source coverage summary while retaining 339 individual source decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify exact historical review preservation and absence of accidental seals
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          new=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==frozen["published_catalog_digest"]
          for s,n in (("sources",9),("terms",339),("observations",762),("meanings",431),("relations",529)):
              before,after=old.records(s),new.records(s)
              assert len(after)==n,s
              assert all(after.get(k)==v for k,v in before.items()),s
              assert not new.state(s).get("sealed"),s
          meanings=new.records("meanings")
          extra=[m for m in meanings.values() if m["id"].startswith("meaning.wave2.foundation.")]
          assert len(extra)==12
          assert all(f["review_state"]=="screened" for m in extra for f in m["formulations"])
          reviews=jsonl(new.root/"state/wave2_formulation_reviews.jsonl")
          snapshot=jsonl(new.root/"state/wave2_formulation_reviews_snapshot_440.jsonl")
          assert len(reviews)==443 and len(snapshot)==440
          newmap={r["formulation_id"]:r for r in reviews}
          assert len(newmap)==443
          for prior in snapshot:
              assert {k:v for k,v in newmap[prior["formulation_id"]].items() if k!="meaning_catalog_digest"}=={k:v for k,v in prior.items() if k!="meaning_catalog_digest"}
          assert sum(r["decision"]=="needs_review" for r in reviews)==3
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(new.records("relations"))
          report=json.loads((new.root/"state/wave2_foundations_meaning_review_batch_02.json").read_text())
          assert report["new_formulations_requiring_link_review"]==3
          assert report["screened_relations_preserved"]==529
          assert report["historical_440_review_snapshot_exists"]
          assert report["human_peer_verified"] is False
          coverage=json.loads((new.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==339 and coverage["mathematical_candidate_meanings_screened"]==12
          PY
      - name: Commit only Wave 2 individually audited new meanings and rebased review ledger
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen three mathematical foundation meanings and preserve 440 historical formulation reviews"
          for retry in 1 2 3 4; do
             git fetch origin main
             git rebase origin/main
             if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
