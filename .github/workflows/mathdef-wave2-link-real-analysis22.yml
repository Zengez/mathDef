name: Screen three exact-source real analysis foundation dependencies

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-link-real-analysis22.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reload latest independent source and mathematical reviews
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the research engine and run all isolated tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Screen exact OpenStax antiderivative derivative limit and absolute prerequisites
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_22.jsonl
      - name: Verify 626 screened links all 483 reviews and historical Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((first.root/"state/wave1_freeze.json").read_text())
          assert digest(first.publication())==frozen["published_catalog_digest"]
          expected={"sources":9,"terms":368,"observations":791,"meanings":471,"relations":626}
          for stage,n in expected.items():
              assert len(w.records(stage))==n,stage
              assert not w.state(stage).get("sealed"),stage
          for stage in ("sources","terms","observations","relations"):
              assert all(w.records(stage).get(k)==v for k,v in first.records(stage).items())
          new=jsonl(w.root/"intake/wave2_curated_relations_batch_22.jsonl")
          assert len(new)==3 and len(set(x["id"] for x in new))==3
          assert all(w.records("relations")[x["id"]]==x for x in new)
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==483 and len(set(x["formulation_id"] for x in reviews))==483
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(w.records("relations"))
          assert sum(r["decision"]=="needs_review" for r in reviews)==1
          assert sum(r["decision"]=="linked" for r in reviews)==474
          assert sum(r["decision"]=="no_supported_target" for r in reviews)==8
          assert not any(r["decision"]=="held_ambiguity" for r in reviews)
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_481_before_analysis22.jsonl")
          index={r["formulation_id"]:r for r in reviews}
          assert all(index[r["formulation_id"]]["original_wave1_disposition"]==r["original_wave1_disposition"] for r in old)
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_link_review_batch_22.json").read_text())
          assert report["added_source_grounded_links"]==3 and report["total_screened_links"]==626
          assert report["dependency_graph_has_cycles"] is False
          assert report["wave2_link_stage_sealed"] is False
          assert report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only source-screened Wave 2 mathematical prerequisite records
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen derivative real limit and absolute-value mathematical dependencies preserving frozen history"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
