name: Review group orbit stabilizer measure pushforward and partition dependencies — Batch 117
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-group-measure-links-batch117.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  prerequisite-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync current independent mathDef main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress generic engine and topic-specific mathDef adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually screen nine source-and-target mathematical prerequisites
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_group_measure_links_batch117 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Check 794 prior links, historical individual reviews and independent freeze
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":457,"observations":912,"meanings":568,"relations":803}
          assert {k:len(w.records(k)) for k in counts}==counts
          assert not any(w.state(k).get("sealed") for k in counts)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          historic=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_600_before_group117.jsonl")
          latest=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in latest}
          assert len(historic)==len(latest)==len(idx)==600
          for previous in historic:
            if not previous["formulation_id"].startswith("form.wave2.group116."):
              assert idx[previous["formulation_id"]]==previous
          assert len([id for id in w.records("relations") if id.startswith("rel.wave2.group117.")])==9
          assert dict(Counter(r["decision"] for r in latest))=={"linked":594,"no_supported_target":6}
          assert {id for r in latest for id in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in latest)
          held=jsonl(w.root/"wave2/directional112_quarantined_source_claims.jsonl")
          assert len(held)==1 and held[0]["observation_id"] not in {id for m in w.records("meanings").values() for f in m["formulations"] for id in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          result=json.loads((w.root/"state/wave2_group117_link_review.json").read_text())
          assert result["all_794_prior_mathematical_links_preserved"]
          assert result["all_594_unrelated_individual_reviews_preserved"]
          assert result["set_partition_empty_base_convention_retained"] and result["pushforward_requires_measurability"]
          assert not result["human_peer_verified"] and not result["production_corpus_used"]
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only vetted independent links and historic review snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen nine group action measure and partition direct prerequisites preserving prior 794 links"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
