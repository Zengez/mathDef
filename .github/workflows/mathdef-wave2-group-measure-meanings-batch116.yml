name: Screen mathematical orbit stabilizer pushforward partition variants — Batch 116
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-group-measure-meanings-batch116.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  mathematical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout current independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress generic research engine and mathDef adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen four mathematical contexts with six independent formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_group_measure_meanings_batch116 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independent source-term provenance
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate individual historic decisions, grouping and frozen lineage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":457,"observations":912,"meanings":568,"relations":794}
          assert {k:len(w.records(k)) for k in expected}==expected
          assert not any(w.state(k).get("sealed") for k in expected)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==v for i,v in first.records(k).items())
          ms=w.records("meanings")
          new=[m for m in ms.values() if m["id"].startswith("meaning.wave2.group116.")]
          assert len(new)==4 and sum(len(m["formulations"]) for m in new)==6
          assert len(ms["meaning.wave2.group116.group-orbit"]["formulations"])==2
          assert len(ms["meaning.wave2.group116.set-partition"]["formulations"])==2
          previous=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_594_before_group116.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in now}
          assert len(previous)==594 and len(now)==len(idx)==600
          for r in previous:
            n=idx[r["formulation_id"]]
            assert all(n.get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in now)
          assert {i for r in now for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in now))=={"linked":588,"no_supported_target":6,"needs_review":6}
          held=jsonl(w.root/"wave2/directional112_quarantined_source_claims.jsonl")
          assert len(held)==1 and held[0]["observation_id"] not in {e for m in ms.values() for f in m["formulations"] for e in f["evidence_ids"]}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_group116_meaning_screen.json").read_text())
          assert report["prior_594_formulation_decisions_preserved"]
          assert report["prior_794_relations_preserved"] and report["held_directional_source_claim_unpromoted"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent mathematics screens and immutable review snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen independent group action, pushforward and partition mathematical meanings"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
