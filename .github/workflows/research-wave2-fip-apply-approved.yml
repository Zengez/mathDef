name: Apply approved Wave2 FIP re-anchor on isolated branch

on:
  push:
    branches: ['codex/wave2-fip-nonempty-family']
    paths:
      - '.github/workflows/research-wave2-fip-apply-approved.yml'

permissions:
  contents: write

concurrency:
  group: mathdef-wave2-fip-isolated-branch-write
  cancel-in-progress: false

jobs:
  reanchor:
    if: github.ref == 'refs/heads/codex/wave2-fip-nonempty-family'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed math and checkpoint migration invariants
        run: |
          python -m unittest research_pipeline.tests.test_dependency_graph research_pipeline.tests.test_resume_meaning_catalog_bridge -q
          python -m research_pipeline.engine.resume_checkpoint --config research_pipeline/adapters/mathdef/resume.json --check > /tmp/resume-pre-integration.json

      - name: Apply exactly one reviewed new-version scan, retaining prior-version base
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research_pipeline.engine.dependency_graph import inventory_sync, apply_inbox

          w = Path("research_pipeline/experiments/reconstruction-v2-independent")
          g = w / "dependency_graph"
          fid = "form.wave2.broad67.compact-closed-fip"
          proposal = json.loads(Path("research_pipeline/WAVE2_FIP_NONEMPTY_FAMILY_OFFLINE_RESCAN_PROPOSAL.json").read_text())
          assert proposal["proposal_only"] is True and proposal["mode"] == "ingest"
          assert len(proposal["items"]) == 1
          item = proposal["items"][0]
          assert item["formulation_id"] == fid and item["complete"] is True
          assert len(item["references"]) == 5
          original = json.loads((g / "INVENTORY.json").read_text())
          previous_state = json.loads((g / "STATE.json").read_text())["summary"]
          assert previous_state["scan_complete"] == 659
          assert previous_state["consolidation_gate_valid"] is False
          old_version = original["formulations"][fid]["version_sha256"]
          new_version = item["version_sha256"]
          if old_version == new_version:
              raise RuntimeError("Source version is already migrated: do not replay the one-time integration")
          if old_version != "e6a0aa44634543ff92c50272643e6d7a42152bc50827bbbd925d745849f036bb":
              raise RuntimeError("Unexpected historical scan version, do not replace")
          if new_version != "844fa46b00ce7ef7960240f19be908bf46ae0985f5f45de1195b8137d61ed213":
              raise RuntimeError("Unexpected revised version, do not replace")
          original_node = (g / "nodes" / (fid + ".json")).read_bytes()
          history = g / "history" / (fid + "." + old_version + ".json")
          if history.exists():
              assert history.read_bytes() == original_node
          else:
              history.parent.mkdir(parents=True, exist_ok=True)
              history.write_bytes(original_node)
          historical_ledger = {
              name: (g / name).read_bytes()
              for name in ("amendments.jsonl", "candidate_aliases.jsonl",
                           "resolutions.jsonl", "seed_overrides.jsonl")
          }
          sync = inventory_sync(w)
          assert sync["changed_or_added_formulations"] == 1 and sync["removed_formulations"] == 0
          mid = json.loads((g / "STATE.json").read_text())["summary"]
          assert mid["scan_complete"] == 658
          packet_id = "approved-fip-nonempty-family-rescan-20261024"
          packet_file = g / "inbox" / (packet_id + ".json")
          if packet_file.exists():
              raise RuntimeError("Reviewed FIP migration packet already staged")
          approved_packet = {
              "schema_version": 1,
              "id": packet_id,
              "mode": "ingest",
              "items": proposal["items"],
          }
          packet_file.write_text(json.dumps(approved_packet, sort_keys=True, ensure_ascii=False, indent=2)+"\n")
          result = apply_inbox(w, limit=20)
          assert packet_id in result["applied"], result
          after = json.loads((g / "STATE.json").read_text())["summary"]
          assert after["scan_complete"] == 659 and after["total_formulations"] == 659
          for field in ("missing_candidates", "unresolved_missing_candidates",
                        "alias_candidate_records", "missing_occurrences",
                        "unassigned_occurrences", "ambiguous_occurrences",
                        "scan_amendment_event_count"):
              assert after[field] == previous_state[field], (field, after.get(field), previous_state.get(field))
          assert after["consolidation_gate_valid"] is False
          assert history.read_bytes() == original_node
          for name, content in historical_ledger.items():
              assert (g / name).read_bytes() == content, name
          new_node = json.loads((g / "nodes" / (fid + ".json")).read_text())
          assert new_node["version_sha256"] == new_version and new_node["scan_status"] == "complete"
          assert [x["state"] for x in new_node["references"]] == ["external","missing","missing","external","external"]
          assert [new_node["references"][i]["missing_candidate_id"] for i in (1,2)] == [
              "missing.622459998fd4b876125d", "missing.ded806b239b007c8af8c"]
          assert not (g / "CONSOLIDATION.json").exists()
          print(json.dumps({
              "status": "approved_version_anchored_rescan_applied_in_independent_graph_only",
              "old_version": old_version,
              "new_version": new_version,
              "scans_complete": after["scan_complete"],
              "canonical_missing": after["unresolved_missing_candidates"],
              "aliases": after["alias_candidate_records"],
              "missing_occurrences": after["missing_occurrences"],
              "gate_valid": after["consolidation_gate_valid"],
              "receipt_id": packet_id,
          }, indent=2))
          PY
      - name: Exhaustive graph readiness check, no phase transition
        run: |
          python -m research_pipeline.engine.dependency_consolidation_readiness \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --exhaustive > /tmp/fip-readiness-post-apply.json
          python - <<'PY'
          import json
          r = json.load(open("/tmp/fip-readiness-post-apply.json"))
          assert r["status"] == "mechanical_checks_passed_review_decision_required", r["status"]
          assert len(r["mechanical_checks"]) == 19
          assert all(r["mechanical_checks"].values())
          assert r["pass3_authorized_by_this_assessment"] is False
          assert r["gate_contract"]["gate_written_by_assessment"] is False
          print("Readiness: 19/19 mechanical checks passed; global review decision remains required.")
          PY
      - name: Refresh exact-input portable resume checkpoint
        run: |
          python -m research_pipeline.engine.resume_checkpoint --config research_pipeline/adapters/mathdef/resume.json --check > /tmp/resume-check.json
          python -m research_pipeline.engine.resume_checkpoint --config research_pipeline/adapters/mathdef/resume.json --write > /tmp/resume-write.json
          python -m research_pipeline.engine.resume_checkpoint --config research_pipeline/adapters/mathdef/resume.json --verify > /tmp/resume-verify.json
      - name: Commit only the isolated reviewed graph and portable resume checkpoint
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          W="research_pipeline/experiments/reconstruction-v2-independent"
          git add -- "$W/dependency_graph" "$W/state/RESUME_STATE.json"
          if git diff --cached --name-only | grep -Ev "^($W/dependency_graph/|$W/state/RESUME_STATE[.]json$)"; then
            echo "Refusing a commit touching other datasets" >&2
            exit 1
          fi
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(wave2): checkpoint approved FIP re-anchor with full historical audit trail"
          git push origin HEAD:codex/wave2-fip-nonempty-family
          echo "Isolated graph and checkpoint persisted. No main merge, gate, or Pass3 event."
