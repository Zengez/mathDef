name: Admit product topology eigenvalue graph connectivity and EGF source evidence — Batch 128
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-branch-source-batch128.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generic and mathDef adapter regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four sourced headings and six individual observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_branch_source_batch128 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independent source coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check frozen Wave1, untouched reviewed Wave2 and precise source scope
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":473,"observations":938,"meanings":583,"relations":840}
          assert {k:len(w.records(k)) for k in expect}==expect
          assert not any(w.state(k).get("sealed") for k in expect)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==618 and dict(Counter(r["decision"] for r in reviews))=={"linked":612,"no_supported_target":6}
          assert {i for r in reviews for i in r["relation_ids"]}==set(w.records("relations"))
          for path in ("wave2/conv125_quarantined_source_claims.jsonl","wave2/quot118_quarantined_source_claims.jsonl","wave2/directional112_quarantined_source_claims.jsonl"):
            h=jsonl(w.root/path)
            assert len(h)==1 and h[0]["observation_id"] not in {i for m in w.records("meanings").values() for f in m["formulations"] for i in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_branch128_source_intake.json").read_text())
          assert report["new_meanings"]==report["new_links"]==0
          assert report["product_subbasis_vs_basis_distinguished"] and report["eigenvalue_nontrivial_kernel_distinguished"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent source evidence
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit independently sourced product topology eigenvalues connected graphs and exponential generating functions"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
