name: Intake independent natural and quotient set foundations — Wave 2 Batch 62

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-set-source-batch62.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read latest independent state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated research tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Ingest four vetted set-theoretic source observations, not meanings
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_set_foundations_source_batch62 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile all 406 source identities without rewriting old reviews
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check frozen lineage, source-ledger history, and no premature promotion
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          wanted={"sources":14,"terms":406,"observations":830,"meanings":503,"relations":681}
          assert {s:len(w.records(s)) for s in wanted}==wanted
          assert not any(w.state(s).get("sealed") for s in wanted)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in first.records(s).items())
          old=jsonl(w.root/"state/wave2_term_coverage_snapshot_402.jsonl")
          current=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          byid={x["term_id"]:x for x in current}
          assert len(old)==402 and len(current)==len(byid)==406
          assert all(byid[x["term_id"]]==x for x in old)
          assert len(jsonl(w.root/"state/wave2_formulation_reviews.jsonl"))==516
          report=json.loads((w.root/"state/wave2_set_source_intake_batch62.json").read_text())
          assert report["zero_in_natural_numbers_convention_recorded"]
          assert report["equivalence_class_not_identified_with_quotient_set"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit independently reviewed source and lineage records only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit four independent set-theoretic source candidates preserving 402 older term decisions"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
