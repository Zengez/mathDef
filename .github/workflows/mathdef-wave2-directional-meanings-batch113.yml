name: Screen mathematical metric balls, homeomorphism and directional derivative — Batch 113
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-directional-meanings-batch113.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  mathematical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reusable research engine and mathDef adapter tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen six mathematical contexts, seven formulations, held claim excluded
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_directional_metric_meanings_batch113 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify independent source term coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify new mathematical meanings, historical dispositions and untouched graph
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":453,"observations":906,"meanings":564,"relations":784}
          assert {k:len(w.records(k)) for k in counts}==counts
          assert not any(w.state(k).get("sealed") for k in counts)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          ms=w.records("meanings")
          new=[m for m in ms.values() if m["id"].startswith("meaning.wave2.directional113.")]
          assert len(new)==6 and sum(len(m["formulations"]) for m in new)==7
          assert len(ms["meaning.wave2.directional113.homeomorphism-topological"]["formulations"])==2
          assert "obs.wave2.directional112.directional-derivative.02" not in {e for m in new for f in m["formulations"] for e in f["evidence_ids"]}
          before=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_587_before_directional113.jsonl")
          after=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          index={r["formulation_id"]:r for r in after}
          assert len(before)==587 and len(after)==len(index)==594
          for r in before:
            n=index[r["formulation_id"]]
            assert all(n.get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert {i for r in after for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in after))=={"linked":581,"no_supported_target":6,"needs_review":7}
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in after)
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_directional113_meaning_screen.json").read_text())
          assert report["held_gradient_claim_remains_excluded"]
          assert report["historical_587_formulation_reviews_preserved"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit mathematical contexts and preserved historical review snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen six mathematical topology and directional contexts, quarantining unsupported gradient form"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
