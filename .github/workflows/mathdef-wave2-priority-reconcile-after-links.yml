name: Reconcile 192 original independent Wave 2 priority tasks after screened links

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-priority-reconcile-after-links.yml'
  workflow_run:
    workflows:
      - Screen Wave 2 links after four new Stacks meaning reviews pass
      - Screen eighteen Wave 2 algebra order and topology prerequisite relationships
      - Screen six Stacks covering-family and site prerequisite links
      - Screen fifteen independent homological and category prerequisites
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh immutable original priority queue and screened current relations
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all pipeline scripts and run research regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Recalculate conservative fixed-baseline priority progress
        run: |
          python -m research_pipeline.engine.wave2_priority_progress \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify original 192-task historical snapshot and honest progress metric
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_pipeline.engine.core import Workspace,jsonl,digest
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          base=jsonl(w.root/"wave2/prioritized_research.jsonl")
          untouched=jsonl(w.root/"state/wave2_priority_reconciliation_2026-10-19.jsonl")
          assert len(base)==len(untouched)==192
          assert all(x["status"]=="unresearched" for x in base)
          assert len(w.records("relations"))==621
          assert len(w.records("meanings"))==462
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          updated=jsonl(w.root/"state/wave2_priority_progress_current.jsonl")
          result=json.loads((w.root/"state/wave2_priority_progress_current.json").read_text())
          assert len(updated)==192
          assert result["original_relationship_gap_tasks"]==93
          assert result["other_source_variant_collection_tasks_not_proven_complete_by_this_metric"]==99
          assert result["original_relationship_gaps_with_at_least_one_screened_link"]>=91
          assert result["a_link_is_not_proof_of_exhaustive_prerequisites"] is True
          assert result["source_task_research_not_automatically_closed"] is True
          assert result["original_production_mathdef_consulted"] is False
          assert result["wave2_stages_unsealed"] is True
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only independent Wave 2 regenerated progress reports
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent/state/wave2_priority_progress_current.json research_pipeline/experiments/reconstruction-v2-independent/state/wave2_priority_progress_current.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh independent 192-priority fixed-baseline progress from verified screened links"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
