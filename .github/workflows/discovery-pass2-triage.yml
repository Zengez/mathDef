name: Triage existing high-recall mathDef leads
on:
  push:
    branches:
      - 'discovery/false-positive-pass-*'
    paths:
      - 'scripts/discovery_pass2_triage.py'
      - '.github/workflows/discovery-pass2-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch durable discovery checkpoint
        run: |
          git fetch origin +refs/heads/discovery-checkpoints:refs/remotes/origin/discovery-checkpoints
          mkdir -p _pass2
          git show origin/discovery-checkpoints:research_pipeline/discovery/checkpoint.json > _pass2/checkpoint.json
      - name: Triage existing high-recall candidate phrases
        run: |
          python scripts/discovery_pass2_triage.py --checkpoint _pass2/checkpoint.json --output _pass2/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathdef-pass2-high-recall-triage
          path: _pass2/results/
          retention-days: 90
