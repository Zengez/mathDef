name: Screen four new Stacks Wave 2 meanings with historical review preservation

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-foundations-batch6.yml'
      - 'research_pipeline/engine/wave2_screen_more_foundations.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use newest independent Wave 2 checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile every pipeline Python module and run isolated tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Require finished presheaf correction before meaning-catalog expansion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_pipeline/experiments/reconstruction-v2-independent/state/wave2_presheaf_math_corrections.json")
          assert p.is_file(), "Previous Stacks presheaf corrections not committed"
          r=json.loads(p.read_text())
          assert r["corrected_formulations"]==2 and r["relations_preserved"]==545
          assert r["groupoid_valued_strict_source_correction_applied"]
          assert r["historical_wave1_dispositions_preserved"]
          assert r["human_peer_verified"] is False
          PY
      - name: Screen four new mathematical meanings and migrate 443 historical formulation decisions
        run: |
          python -m research_pipeline.engine.wave2_screen_more_foundations \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh source review coverage with sixteen screened Wave 2 foundational meanings
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Independently verify frozen Wave 1, source provenance and relation review identity
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==frozen["published_catalog_digest"]
          expect={"sources":9,"terms":343,"observations":766,"meanings":435,"relations":545}
          for stage,n in expect.items():
              previous=old.records(stage)
              new=w.records(stage)
              assert len(new)==n,stage
              if stage=="meanings":
                  intentionally_corrected={
                     "meaning.f7206eb9332b9389.category-valued-presheaf",
                     "meaning.f0d993a60533fc99.groupoid-valued-presheaf"}
                  assert all(new.get(k)==v for k,v in previous.items()
                             if k not in intentionally_corrected),stage
                  assert all(k in new for k in intentionally_corrected)
              else:
                  assert all(new.get(k)==v for k,v in previous.items()),stage
              assert not w.state(stage).get("sealed"),stage
          meanings=w.records("meanings")
          added=[m for m in meanings.values() if m["id"].startswith("meaning.wave2.foundation.")]
          assert len(added)==16
          assert all(f["review_state"]=="screened" for m in meanings.values() for f in m["formulations"])
          assert all(m.get("human_verified") is False for m in added)
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          old_reviews=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_443_before_new_foundations.jsonl")
          assert len(reviews)==447 and len(old_reviews)==443
          review_ids={r["formulation_id"]:r for r in reviews}
          assert len(review_ids)==447
          for row in old_reviews:
              now=review_ids.get(row["formulation_id"])
              assert now is not None
              assert {k:v for k,v in now.items() if k!="meaning_catalog_digest"}=={
                    k:v for k,v in row.items() if k!="meaning_catalog_digest"}
          assert sum(r["decision"]=="needs_review" for r in reviews)==4
          assert {rid for row in reviews for rid in row["relation_ids"]}==set(w.records("relations"))
          check_cycles(meanings,w.records("relations"))
          coverage=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==343 and coverage["mathematical_candidate_meanings_screened"]==16
          report=json.loads((w.root/"state/wave2_new_foundations_batch_06_screened.json").read_text())
          assert report["historical_review_rows_preserved"]==443
          assert report["screened_relations_retained"]==545
          assert report["new_foundation_formulations_needing_link_review"]==4
          assert report["presheaf_audit_completed_before_growth"] is True
          assert report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only individual independent Wave 2 screenings and append-only review ledger
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then
            echo "Unexpected out-of-scope modifications" >&2
            exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen four additional Stacks Wave 2 meanings and preserve 443 prior mathematical reviews"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
