name: Independently source Stacks 10.123.7 strong transcendence

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-source-strong-transcendence36.yml'
      - 'research_pipeline/engine/wave2_foundations_batch36_strong_transcendence.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest independent GitHub checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test the independent research engine
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Ingest exact Stacks definition source paraphrase as observation only
        run: |
          python -m research_pipeline.engine.wave2_foundations_batch36_strong_transcendence \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Version the exact per-term source audit from 376 to 377
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify independent provenance, counts and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          a=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((a.root/"state/wave1_freeze.json").read_text())
          assert digest(a.publication())==freeze["published_catalog_digest"]
          expected={"sources":9,"terms":377,"observations":800,"meanings":479,"relations":648}
          for stage,n in expected.items():
              before=a.records(stage);after=w.records(stage)
              assert len(after)==n,stage
              if stage!="meanings":
                  assert all(after.get(k)==v for k,v in before.items()),stage
              assert not w.state(stage).get("sealed"),stage
          old=jsonl(w.root/"state/wave2_term_coverage_snapshot_376.jsonl")
          new=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          assert len(old)==376 and len(new)==377
          index={x["term_id"]:x for x in new}
          assert all(index.get(x["term_id"])==x for x in old)
          report=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert report["term_count"]==377
          assert report["source_read_new_candidates"]==51
          assert report["new_term_review_coverage"]==59
          assert report["new_source_locators_unverified"]==8
          assert report["complete_for_wave2_sealing"] is False
          evidence=jsonl(w.root/"wave2/foundation_source_discovery_batch_36.jsonl")
          assert len(evidence)==1
          assert evidence[0]["source_access_outcome"]=="direct_page_read"
          assert evidence[0]["meaning_screened"] is False
          assert evidence[0]["locator"]=="https://stacks.math.columbia.edu/tag/00PZ"
          result=json.loads((w.root/"state/wave2_foundations_batch_36.json").read_text())
          assert result["zero_divisor_sensitive_coefficient_condition_preserved"]
          assert result["new_mathematical_meanings_screened"]==0
          assert result["original_production_mathdef_consulted"] is False
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only independent Wave 2 source intake and audit snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover Stacks strongly transcendental element source and archive 376-term audit"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
