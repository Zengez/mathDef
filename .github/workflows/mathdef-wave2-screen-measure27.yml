name: Screen independent sigma algebra and nonnegative measure meanings

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-measure27.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use newest independent source and mathematical checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all scripts and run isolated regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually screen ProofWiki source-specific sigma-algebra and measure formulations
        run: |
          python -m research_pipeline.engine.wave2_screen_measure27 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh 373 individual source coverage records
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify mathematical axioms, 486 historical reviews, and 634 old links
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==freeze["published_catalog_digest"]
          for s,n in (("sources",9),("terms",373),("observations",796),("meanings",476),("relations",634)):
              assert len(w.records(s))==n,s
              assert not w.state(s).get("sealed"),s
          for s in ("sources","terms","observations","relations"):
              assert all(w.records(s).get(k)==v for k,v in old.records(s).items()),s
          old_reviews=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_486_before_measure27.jsonl")
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(old_reviews)==486 and len(reviews)==488
          index={r["formulation_id"]:r for r in reviews}
          assert len(index)==488
          for x in old_reviews:
              y=index[x["formulation_id"]]
              assert {k:v for k,v in x.items() if k!="meaning_catalog_digest"}=={
                     k:v for k,v in y.items() if k!="meaning_catalog_digest"}
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(w.records("relations"))
          assert sum(r["decision"]=="needs_review" for r in reviews)==3
          meanings=w.records("meanings")
          for suffix in ("sigma-algebra","nonnegative-measure"):
              assert meanings["meaning.wave2.foundation."+suffix]["formulations"][0]["review_state"]=="screened"
          check_cycles(meanings,w.records("relations"))
          report=json.loads((w.root/"state/wave2_foundations_batch_27_screened.json").read_text())
          assert report["screened_contextual_meanings"]==476
          assert report["reviewed_formulations"]==488
          assert report["previous_486_review_rows_preserved"]
          assert report["screened_links_preserved"]==634
          assert report["measure_normalization_at_empty_set_retained"]
          assert report["extended_nonnegative_measure_values_retained"]
          assert report["riemann_vs_lebesgue_stieltjes_contexts_not_conflated"]
          assert report["human_peer_verified"] is False
          source_report=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert source_report["term_count"]==373
          assert source_report["mathematical_candidate_meanings_screened"]==57
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent individually source-reviewed meaning and review history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen measure and sigma algebra foundations preserving 486 historical mathematical reviews"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
