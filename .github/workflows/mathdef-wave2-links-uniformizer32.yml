name: Screen three source-anchored Stacks DVR uniformizer prerequisites

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-links-uniformizer32.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh source-corrected independent Wave 2 checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all pipeline modules and execute isolated tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually screen DVR-specific uniformizer dependency links
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_32.jsonl
      - name: Verify all historical mathematical reviews and no dependency cycles
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==freeze["published_catalog_digest"]
          for stage,expected in (("sources",9),("terms",374),("observations",797),("meanings",477),("relations",643)):
              assert len(w.records(stage))==expected,stage
              assert not w.state(stage).get("sealed"),stage
          assert len(old.records("relations"))==445
          assert all(w.records("relations").get(k)==v for k,v in old.records("relations").items())
          new=jsonl(w.root/"intake/wave2_curated_relations_batch_32.jsonl")
          assert len(new)==3 and len({r["id"] for r in new})==3
          assert all(w.records("relations")[r["id"]]==r for r in new)
          assert all(r["from_formulation"]=="form.wave2.foundation.uniformizer-dvr" for r in new)
          assert {r["target_meaning"] for r in new}=={
            "meaning.f72779e263dd3e51.discrete-valuation-ring-value-group",
            "meaning.wave2.foundation.commutative-maximal-ideal",
            "meaning.wave2.foundation.two-sided-ideal"}
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==489 and len({r["formulation_id"] for r in reviews})==489
          assert {r for x in reviews for r in x["relation_ids"]}==set(w.records("relations"))
          assert sum(x["decision"]=="needs_review" for x in reviews)==0
          uniformizer=next(r for r in reviews if r["formulation_id"]=="form.wave2.foundation.uniformizer-dvr")
          assert uniformizer["decision"]=="linked" and len(uniformizer["relation_ids"])==3
          history=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_488_before_uniformizer31.jsonl")
          assert len(history)==488
          historical={r["formulation_id"]:r for r in history}
          for current in reviews:
              previous=historical.get(current["formulation_id"])
              if previous:
                  assert current["original_wave1_disposition"]==previous["original_wave1_disposition"]
          check_cycles(w.records("meanings"),w.records("relations"))
          result=json.loads((w.root/"state/wave2_link_review_batch_32.json").read_text())
          assert result["added_source_grounded_links"]==3
          assert result["total_screened_links"]==643
          assert result["dependency_graph_has_cycles"] is False
          assert result["pending_wave2_link_reviews"]==0
          assert result["wave2_link_stage_sealed"] is False
          assert result["human_peer_verified"] is False
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only independent Wave 2 source-anchored mathematical relations
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen three Stacks DVR uniformizer dependencies and preserve mathematical audit history"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
