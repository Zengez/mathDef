name: Screen four homological definitions with historical review preservation

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-homological-meanings-batch14.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  mathematical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out authoritative latest Wave 2 data
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all modules and run research regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Independently source-screen and review four homological contexts
        run: |
          python -m research_pipeline.engine.wave2_screen_homological_foundations_batch14 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Update independent source-term coverage without altering source decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify category distinctions, historic 467 reviews, and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==freeze["published_catalog_digest"]
          for stage,n in (("sources",9),("terms",360),("observations",783),("meanings",459),("relations",606)):
              assert len(w.records(stage))==n,stage
              assert not w.state(stage).get("sealed"),stage
          assert all(w.records("terms").get(k)==v for k,v in old.records("terms").items())
          assert all(w.records("observations").get(k)==v for k,v in old.records("observations").items())
          old_reviews=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_467_before_homological14.jsonl")
          new_reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(old_reviews)==467 and len(new_reviews)==471
          indexed={x["formulation_id"]:x for x in new_reviews}
          assert len(indexed)==471
          for prior in old_reviews:
              new=indexed[prior["formulation_id"]]
              assert {k:v for k,v in prior.items() if k!="meaning_catalog_digest"}=={
                     k:v for k,v in new.items() if k!="meaning_catalog_digest"}
          assert {rid for x in new_reviews for rid in x["relation_ids"]}==set(w.records("relations"))
          assert sum(x["decision"]=="needs_review" for x in new_reviews)==4
          check_cycles(w.records("meanings"),w.records("relations"))
          new=[m for m in w.records("meanings").values() if m["id"].startswith("meaning.wave2.foundation13.")]
          assert len(new)==4
          assert all(m["formulations"][0]["review_state"]=="screened" for m in new)
          assert new[0]["human_verified"] is False
          c=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert c["term_count"]==360 and c["mathematical_candidate_meanings_screened"]==40
          report=json.loads((w.root/"state/wave2_foundations_batch_14_screened.json").read_text())
          assert report["concrete_and_categorical_kernels_context_specific"]
          assert report["preadditive_kernels_cokernels_not_assumed_to_exist"]
          assert report["abelian_category_required_for_image_kernel_exactness"]
          assert report["screened_relations_preserved"]==606
          assert report["previous_review_rows_preserved"]==467
          assert report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only source-screened Wave 2 mathematical meanings and review evidence
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen four contextual homological meanings preserving all 467 historical reviews and 606 links"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
