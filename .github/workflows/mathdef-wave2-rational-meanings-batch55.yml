name: Screen independent rational numbers, sequences, modulus, positive epsilons — Batch 55

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-rational-meanings-batch55.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout authoritative independent research state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run general research-pipeline tests before screening
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually screen four rational mathematical meanings
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_screen_rational_foundations_batch55 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile existing 399 source term reviews and new meaning count
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate complete historical review lineage, frozen wave and no premature links
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":399,"observations":822,"meanings":500,"relations":670}
          assert {s:len(w.records(s)) for s in expect}==expect
          assert not any(w.state(s).get("sealed") for s in expect)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(i)==v for i,v in frozen.records(s).items())
          older=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_508_before_rational55.jsonl")
          latest=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(older)==508 and len(latest)==512
          current={r["formulation_id"]:r for r in latest}
          assert len(current)==512
          for r in older:
            assert all(current[r["formulation_id"]].get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in latest)
          assert {i for r in latest for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in latest))=={"linked":503,"no_supported_target":5,"needs_review":4}
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_rational_meanings_batch55.json").read_text())
          assert report["new_meanings"]==4 and report["rational_epsilons_strictly_positive"]
          assert report["rational_absolute_value_does_not_require_reals"]
          assert report["historical_508_dispositions_preserved"]
          assert not report["production_corpus_used"] and not report["peer_verified"]
          source_cov=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert source_cov["term_count"]==399 and source_cov["mathematical_candidate_meanings_screened"]==81
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent wave and protected review snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen four rational foundations without altering 508 earlier definitions or 670 links"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
