name: Review martingale and graph-source prerequisites with prior-decision amendments — Batch 86

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-martingale-foundations-links-batch86.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-link-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout current independent math research state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reusable pipeline regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Review thirteen source-specific prerequisites with three historical martingale amendments
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_martingale_foundations_links_batch86 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify historical 706 source links, 538 unrelated reviews and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          wanted={"sources":14,"terms":422,"observations":858,"meanings":523,"relations":719}
          assert {s:len(w.records(s)) for s in wanted}==wanted
          assert not any(w.state(s).get("sealed") for s in wanted)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in frozen.records(s).items())
          history=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_547_before_found86.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in current}
          assert len(history)==len(current)==len(idx)==547
          newer={fid for fid in idx if fid.startswith("form.wave2.found85.")}
          older={
            "form.wave2.research81.martingale-discrete.01",
            "form.wave2.research81.martingale-discrete.02",
            "form.wave2.research81.martingale-continuous-index.01"
          }
          assert len(newer)==6
          additive_chrom="form.wave2.research81.chromatic-proper-coloring.01"
          for row in history:
            if row["formulation_id"] not in newer|older|{additive_chrom}:
              assert idx[row["formulation_id"]]==row
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in current)
          assert {rid for r in current for rid in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in current))=={"linked":539,"no_supported_target":8}
          assert len([id for id in w.records("relations") if id.startswith("rel.wave2.found86.")])==13
          assert idx[additive_chrom]["relation_ids"]==["rel.wave2.research82.01","rel.wave2.found86.13"]
          chromatic_events=jsonl(w.root/"events/chromatic_link_extension_batch86.jsonl")
          assert len(chromatic_events)==1 and chromatic_events[0]["preserved_existing_link_ids"]==["rel.wave2.research82.01"]
          assert idx[additive_chrom]["link_extension_event_id"]==chromatic_events[0]["event_id"]
          assert w.records("relations")["rel.wave2.found86.11"]["target_meaning"]=="meaning.wave2.found85.adapted-continuous"
          check_cycles(w.records("meanings"),w.records("relations"))
          amendments=jsonl(w.root/"events/martingale_review_amendments_batch86.jsonl")
          assert len(amendments)==3
          assert all(x["previous_decision"]=="no_supported_target" and x["new_decision"]=="linked" for x in amendments)
          assert all(idx[x["formulation_id"]]["override_event_id"]==x["event_id"] for x in amendments)
          report=json.loads((w.root/"state/wave2_found86_links.json").read_text())
          assert report["historical_706_links_preserved"]
          assert report["chromatic_existing_graph_link_retained_and_extended_with_event"]
          assert report["three_martingale_no_target_decisions_explicitly_amended"]
          assert report["new_stochastic_process_missing_prerequisite_explicit"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent mathematical source, link, and amendment evidence
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review thirteen martingale and graph prerequisites with three audited old-disposition amendments"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
