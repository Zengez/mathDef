name: Screen six Stacks covering-family and site prerequisite links
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-site-links-batch12.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read newest independent checkpoint and compile research modules
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually apply source-anchored site and indexed family relations
        run: |
          python -m research_pipeline.engine.wave2_apply_links --workspace research_pipeline/experiments/reconstruction-v2-independent --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_12.jsonl
      - name: Validate six new links, historical review overrides, no cycles, no seals
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          a=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(a.publication())==json.loads((a.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          assert len(w.records("terms"))==356 and len(w.records("observations"))==779
          assert len(w.records("meanings"))==455 and len(w.records("relations"))==606
          assert all(w.records("relations").get(k)==v for k,v in a.records("relations").items())
          batch=jsonl(w.root/"intake/wave2_curated_relations_batch_12.jsonl")
          assert len(batch)==6 and len({r["id"] for r in batch})==6
          assert all(w.records("relations").get(r["id"])==r for r in batch)
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==467 and len({r["formulation_id"] for r in reviews})==467
          assert {i for r in reviews for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in reviews))=={"linked":461,"no_supported_target":5,"held_ambiguity":1}
          history=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_465_before_foundations12.jsonl")
          by={r["formulation_id"]:r for r in reviews}
          assert len(history)==465
          assert all(by[r["formulation_id"]]["original_wave1_disposition"]==r["original_wave1_disposition"] for r in history)
          events=jsonl(w.root/"events/wave2_link_disposition_overrides_batch12.jsonl")
          assert len(events)==2
          check_cycles(w.records("meanings"),w.records("relations"))
          assert all(not w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          report=json.loads((w.root/"state/wave2_link_review_batch_12.json").read_text())
          assert report["total_screened_links"]==606
          assert report["added_source_grounded_links"]==6
          assert report["inherited_missing_or_held_dispositions_revisited"]==2
          assert report["pending_wave2_link_reviews"]==0
          assert report["dependency_graph_has_cycles"] is False
          assert report["human_peer_verified"] is False
          PY
      - name: Commit only Wave 2 screened sources and relation override ledger
        run: |
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen six Stacks site indexed family and covering-family dependencies"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
