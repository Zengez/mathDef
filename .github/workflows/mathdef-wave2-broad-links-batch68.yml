name: Review three cross-domain variants and noncircular compactness links — Batch 68

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-broad-links-batch68.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read latest independent Wave 2 state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute portable math research regressions
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen two topology prerequisites and one explicit source-based no-target decision
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_broad_variant_links_batch68 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Confirm 521 previous decisions and 691 earlier relations remain unchanged
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":408,"observations":834,"meanings":509,"relations":693}
          assert {k:len(w.records(k)) for k in expected}==expected
          assert not any(w.state(k).get("sealed") for k in expected)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==v for i,v in first.records(k).items())
          history=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_524_before_broad68.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          index={r["formulation_id"]:r for r in current}
          assert len(history)==len(current)==len(index)==524
          changed={
            "form.wave2.broad67.sigma-difference-disjoint-countable",
            "form.wave2.broad67.compact-open-cover",
            "form.wave2.broad67.compact-closed-fip"
          }
          for row in history:
            if row["formulation_id"] not in changed:
              assert index[row["formulation_id"]]==row
          assert all(row["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for row in current)
          assert {id for row in current for id in row["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(row["decision"] for row in current))=={"linked":518,"no_supported_target":6}
          assert len([k for k in w.records("relations") if k.startswith("rel.wave2.broad68.")])==2
          check_cycles(w.records("meanings"),w.records("relations"))
          info=json.loads((w.root/"state/wave2_broad_relation_review_batch68.json").read_text())
          assert info["sigma_new_variant_explicit_no_supported_target_not_self_linked"]
          assert info["all_691_previous_screened_links_preserved"]
          assert not info["production_corpus_used"] and not info["human_peer_verified"]
          print(json.dumps(info,indent=2))
          PY
      - name: Commit independent screened relations and historical audit
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen compactness topological prerequisites and independent sigma-variant no-target decision"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
