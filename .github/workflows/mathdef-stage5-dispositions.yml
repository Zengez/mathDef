name: Record independently reviewed Stage 5 no-link and ambiguity outcomes

on:
  push:
    paths:
      - 'research_pipeline/experiments/reconstruction-v1-recovery/intake/stage5-disposition-batch-*.jsonl'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage5-reconstruction-writes
  cancel-in-progress: false

jobs:
  save-reviewed-dispositions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out freshest committed Stage 5 state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Apply individually reviewed no-link or held ambiguity outcomes
        run: |
          set -euo pipefail
          for batch in research_pipeline/experiments/reconstruction-v1-recovery/intake/stage5-disposition-batch-*.jsonl; do
            python -m research_pipeline.engine.stage5_review_gate \
              --workspace research_pipeline/experiments/reconstruction-v1-recovery \
              --apply-dispositions "$batch"
          done
      - name: Audit total formulation coverage without premature sealing
        run: |
          python -m research_pipeline.engine.stage5_review_gate \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery --audit
      - name: Commit audited review ledger and checkpoint
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage5_formulation_reviews.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint individually assessed Stage 5 no-link and ambiguity cases"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Could not persist Stage 5 disposition checkpoint" >&2
            exit 1
          fi
