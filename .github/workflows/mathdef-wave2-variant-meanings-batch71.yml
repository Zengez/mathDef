name: Screen distinct connectedness conventions and Noetherian equivalents — Batch 71

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-variant-meanings-batch71.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load latest independently reconstructed Wave 2 research
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all domain-adapted and portable tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen connectedness conventions and four Noetherian equivalent definitions
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_connected_noetherian_meanings_batch71 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independently source-reviewed term variants
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify original Stacks context, Noetherian event, all 524 previous reviews, and frozen wave
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":410,"observations":841,"meanings":510,"relations":693}
          assert {s:len(w.records(s)) for s in expected}==expected
          assert not any(w.state(s).get("sealed") for s in expected)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in first.records(s).items())
          ms=w.records("meanings")
          original=ms["meaning.ab260940ea9c523d.connected-topological-space"]
          alternate=ms["meaning.wave2.variant71.connected-empty-allowed"]
          assert original["formulations"][0]["text"].startswith("A nonempty topological space")
          assert original["term_group_id"]==alternate["term_group_id"]
          assert len(alternate["formulations"])==3
          assert "empty space included" in alternate["context"]
          noeth=ms["meaning.86b5d488b98c612f.noetherian-commutative-ring"]
          assert len(noeth["formulations"])==4
          assert noeth["formulations"][0]["text"].startswith("A commutative ring R with identity")
          historical=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_524_before_variant71.jsonl")
          latest=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in latest}
          assert len(historical)==524 and len(latest)==len(idx)==530
          for old in historical:
            newer=idx[old["formulation_id"]]
            assert all(newer.get(k)==v for k,v in old.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in latest)
          assert {i for r in latest for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in latest))=={"linked":518,"no_supported_target":6,"needs_review":6}
          check_cycles(ms,w.records("relations"))
          events=jsonl(w.root/"events/noetherian_meaning_amendment_batch71.jsonl")
          older=jsonl(w.root/"events/noetherian_meaning_before_variant71.jsonl")
          assert len(events)==len(older)==1
          assert events[0]["old_meaning_digest"]==digest(older[0])
          assert events[0]["original_stacks_evidence_preserved"]
          info=json.loads((w.root/"state/wave2_variant71_meanings.json").read_text())
          assert info["historical_524_review_decisions_preserved"]
          assert info["existing_stacks_nonempty_convention_retained"]
          assert info["noetherian_existing_meaning_amended_not_duplicated"]
          assert not info["production_corpus_used"] and not info["human_peer_verified"]
          print(json.dumps(info,indent=2))
          PY
      - name: Commit only independently screened mathematical evidence and audit history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve distinct connectedness conventions and four Noetherian variants with 524 reviews"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
