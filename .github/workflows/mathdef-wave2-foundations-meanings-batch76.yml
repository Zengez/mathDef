name: Screen Noetherian module, submodule, discrete topology and continuity — Batch 76

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-foundations-meanings-batch76.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load authoritative current independent Wave 2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full independent research tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen four meanings and seven source-specific formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_foundations_meanings_batch76 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile source evidence without changing previous research decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check frozen wave, complete review lineage and distinct mathematical variants
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":414,"observations":848,"meanings":514,"relations":698}
          assert {s:len(w.records(s)) for s in expect}==expect
          assert not any(w.state(s).get("sealed") for s in expect)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in first.records(s).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_530_before_foundation76.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          keyed={x["formulation_id"]:x for x in current}
          assert len(old)==530 and len(current)==len(keyed)==537
          for prev in old:
            after=keyed[prev["formulation_id"]]
            assert all(after.get(k)==v for k,v in prev.items() if k!="meaning_catalog_digest")
          ms=w.records("meanings")
          assert len(ms["meaning.wave2.foundation76.noetherian-module"]["formulations"])==3
          assert len(ms["meaning.wave2.foundation76.continuous-topological-map"]["formulations"])==2
          assert len(ms["meaning.wave2.foundation76.discrete-topology"]["formulations"])==1
          assert len(ms["meaning.wave2.foundation76.submodule"]["formulations"])==1
          assert all(x["meaning_catalog_digest"]==digest(list(ms.values())) for x in current)
          assert {rid for row in current for rid in row["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(x["decision"] for x in current))=={"linked":523,"no_supported_target":7,"needs_review":7}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_foundations_meaning_screen_batch76.json").read_text())
          assert report["historic_530_formulation_decisions_preserved"] and report["historic_698_screened_links_preserved"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only source-screened Wave 2 meanings and protected audit history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen seven mathematical formulations with full historical 530-review preservation"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
