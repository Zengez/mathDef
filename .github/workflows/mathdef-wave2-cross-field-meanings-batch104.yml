name: Screen independent cross-field contextual meanings — Batch 104

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-field-meanings-batch104.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  mathematical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read latest independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run portable and mathDef adapter regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen six mathematical contexts with seven formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_field_meanings_batch104 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independent source term review histories
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate independent meaning scopes, frozen first wave and history
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":441,"observations":884,"meanings":547,"relations":754}
          assert {s:len(w.records(s)) for s in counts}==counts
          assert not any(w.state(s).get("sealed") for s in counts)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in frozen.records(s).items())
          ms=w.records("meanings")
          new=[m for m in ms.values() if m["id"].startswith("meaning.wave2.cross104.")]
          assert len(new)==6 and sum(len(m["formulations"]) for m in new)==7
          assert len(ms["meaning.wave2.cross104.tree-unrooted"]["formulations"])==2
          assert ms["meaning.wave2.cross104.lipschitz-global"]["context"]!=ms["meaning.wave2.cross104.lipschitz-at-point-anchored"]["context"]
          assert ms["meaning.wave2.cross104.independent-sigma-pair"]["context"]!=ms["meaning.wave2.cross104.independent-sigma-countable"]["context"]
          prev=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_566_before_cross104.jsonl")
          curr=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in curr}
          assert len(prev)==566 and len(curr)==len(ix)==573
          for p in prev:
            n=ix[p["formulation_id"]]
            assert all(n.get(k)==v for k,v in p.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in curr)
          assert {r for row in curr for r in row["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in curr))=={"linked":560,"no_supported_target":6,"needs_review":7}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross104_meaning_screen.json").read_text())
          assert report["tree_acyclicity_formulations_equivalent"]
          assert report["point_anchored_vs_global_lipschitz_distinct"] and report["pairwise_vs_mutual_independence_distinct"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only mathematics-specific screens and immutable prior review history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen six cross-field mathematical contexts and seven source-specific formulations"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
