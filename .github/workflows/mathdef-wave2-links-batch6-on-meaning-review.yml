name: Screen Wave 2 links after four new Stacks meaning reviews pass

on:
  workflow_run:
    workflows:
      - Screen four new Stacks Wave 2 meanings with historical review preservation
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  links:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load latest committed independently screened meanings
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all scripts and run independent research regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually apply eighteen justified prerequisite relationships after source-screening
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_06.jsonl
      - name: Assert exact relationship, audit, context, and frozen Wave 1 invariants
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          one=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((one.root/"state/wave1_freeze.json").read_text())
          assert digest(one.publication())==frozen["published_catalog_digest"]
          assert len(one.records("relations"))==445
          assert len(w.records("meanings"))==435
          assert len(w.records("relations"))==563
          assert len(w.records("terms"))==343 and len(w.records("observations"))==766
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          newlinks=jsonl(w.root/"intake/wave2_curated_relations_batch_06.jsonl")
          assert len(newlinks)==18 and len({x["id"] for x in newlinks})==18
          currentrels=w.records("relations")
          assert all(currentrels[r["id"]]==r for r in newlinks)
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==447 and len({x["formulation_id"] for x in reviews})==447
          assert {rid for x in reviews for rid in x["relation_ids"]}==set(currentrels)
          forms={f["id"]:m["id"] for m in w.records("meanings").values() for f in m["formulations"]}
          assert len(forms)==447
          assert all(x["meaning_id"]==forms[x["formulation_id"]] for x in reviews)
          assert not any(x["decision"]=="needs_review" for x in reviews)
          snapshots=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_443_before_new_foundations.jsonl")
          historical={x["formulation_id"]:x for x in snapshots}
          now={x["formulation_id"]:x for x in reviews}
          assert len(historical)==443
          assert all(x["original_wave1_disposition"]==historical[x["formulation_id"]]["original_wave1_disposition"] for x in reviews if x["formulation_id"] in historical)
          check_cycles(w.records("meanings"),currentrels)
          report=json.loads((w.root/"state/wave2_link_review_batch_06.json").read_text())
          assert report["added_source_grounded_links"]==18
          assert report["total_screened_links"]==563
          assert report["dependency_graph_has_cycles"] is False
          assert report["wave2_link_stage_sealed"] is False
          assert report["human_peer_verified"] is False
          assert report["original_production_baseline_consulted"] is False
          assert set(Counter(x["decision"] for x in reviews)) <= {"linked","no_supported_target","held_ambiguity"}
          print(json.dumps(report,indent=2))
          PY
      - name: Commit ONLY independent Wave 2 screened links and provenance events
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then
            echo "18-link batch already committed (idempotent)"
            exit 0
          fi
          git commit -m "Screen 18 context-checked Stacks field functor groupoid and pseudofunctor dependencies"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
