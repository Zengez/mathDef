name: Screen independent Dedekind cuts and cut-model real-number meanings

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-dedekind-batch50.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest independently forked research state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full isolated research regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually screen two source-backed Dedekind meanings and preserve 502 previous dispositions
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_dedekind_meanings_batch50 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile 395 source terms with updated screened-meaning totals
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify frozen independent provenance, exact means, prior review lineage and no new links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert frozen["state"]=="FROZEN"
          assert digest(old.publication())==frozen["published_catalog_digest"]
          expected={"sources":14,"terms":395,"observations":818,"meanings":492,"relations":664}
          assert {stage:len(w.records(stage)) for stage in expected}==expected
          assert not any(w.state(stage).get("sealed") for stage in expected)
          for stage in ("sources","terms","observations","relations"):
            assert all(w.records(stage).get(k)==v for k,v in old.records(stage).items()),stage
          ms=w.records("meanings")
          assert ms["meaning.wave2.real50.dedekind-rational-lower-cut"]["formulations"][0]["review_state"]=="screened"
          assert ms["meaning.wave2.real50.cut-model-reals"]["term_group_id"]=="wave2.real45.complete-ordered-real-field"
          earlier=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_502_before_real50.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(earlier)==502 and len(now)==504
          idx={r["formulation_id"]:r for r in now}
          assert len(idx)==504
          for original in earlier:
            actual=idx[original["formulation_id"]]
            assert all(actual.get(k)==v for k,v in original.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in now)
          assert {rid for r in now for rid in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_dedekind_meaning_screen_batch50.json").read_text())
          assert report["screened_new_meanings"]==2
          assert report["existing_664_links_preserved"]
          assert report["supremum_union_result_is_a_theorem_not_new_definition"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          cov=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert cov["term_count"]==395 and cov["mathematical_candidate_meanings_screened"]==73
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent research and append-only proof of prior reviews
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen two independent Dedekind meanings retaining 502 earlier reviews and 664 links"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
