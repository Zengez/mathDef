name: Individually screen Bell Stirling convex and graph degree links — Batch 134
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-links-batch134.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  link-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync latest independent source-screened main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reusable engine and topic-dependent mathDef adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually review fourteen direct mathematical source links
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_links_batch134 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate historic individual decisions, source holds and dependency graph
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          one=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(one.publication())==json.loads((one.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":477,"observations":946,"meanings":591,"relations":869}
          assert {k:len(w.records(k)) for k in counts}==counts
          assert not any(w.state(k).get("sealed") for k in counts)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in one.records(k).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_632_before_cross134.jsonl")
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in reviews}
          assert len(old)==len(reviews)==len(ix)==632
          for prior in old:
            if not prior["formulation_id"].startswith("form.wave2.cross133."):
              assert ix[prior["formulation_id"]]==prior
          assert len([i for i in w.records("relations") if i.startswith("rel.wave2.cross134.")])==14
          assert dict(Counter(r["decision"] for r in reviews))=={"linked":626,"no_supported_target":6}
          assert {i for r in reviews for i in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in reviews)
          assert len(jsonl(w.root/"wave2/cross134_missing_prerequisite_targets.jsonl"))==3
          for path in ("wave2/conv125_quarantined_source_claims.jsonl","wave2/quot118_quarantined_source_claims.jsonl","wave2/directional112_quarantined_source_claims.jsonl"):
            h=jsonl(w.root/path)
            assert len(h)==1 and h[0]["observation_id"] not in {i for m in w.records("meanings").values() for f in m["formulations"] for i in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross134_link_review.json").read_text())
          assert report["all_855_prior_links_preserved"] and report["all_624_unrelated_formulation_reviews_preserved"]
          assert report["missing_convex_set_falling_factorial_delta_targets_explicitly_logged"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent screened links and source-ledger snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Individually review fourteen Bell Stirling convex hull and graph degree prerequisites"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
