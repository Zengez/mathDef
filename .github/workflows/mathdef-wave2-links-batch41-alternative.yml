name: Screen five independent Borel Boolean and bipartition prerequisites

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-links-batch41-alternative.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screened-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest authoritative independent Wave 2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all pipeline scripts and execute isolated tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually apply source-screened Borel and ring links
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_41.jsonl
      - name: Verify link integrity historical reviews and immutable frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==freeze["published_catalog_digest"]
          assert len(w.records("sources"))==9 and len(w.records("terms"))==381
          assert len(w.records("observations"))==804 and len(w.records("meanings"))==485
          assert len(w.records("relations"))==655
          assert len(old.records("relations"))==445
          assert set(old.records("relations")).issubset(w.records("relations"))
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          rs=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(rs)==497 and len({r["formulation_id"] for r in rs})==497
          assert {rid for r in rs for rid in r["relation_ids"]}==set(w.records("relations"))
          counts=Counter(r["decision"] for r in rs)
          assert counts=={"linked":491,"no_supported_target":5,"needs_review":1}
          oldrs=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_492_before_alt40.jsonl")
          prev={r["formulation_id"]:r for r in oldrs}
          now={r["formulation_id"]:r for r in rs}
          assert len(prev)==492
          assert all(now[fid]["original_wave1_disposition"]==r["original_wave1_disposition"] for fid,r in prev.items())
          new=jsonl(w.root/"intake/wave2_curated_relations_batch_41.jsonl")
          assert len(new)==5 and all(w.records("relations")[r["id"]]==r for r in new)
          assert now["form.wave2.alternative39.adjacency-matrix-simple-undirected"]["decision"]=="needs_review"
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_link_review_batch_41.json").read_text())
          assert report["added_source_grounded_links"]==5 and report["total_screened_links"]==655
          assert report["pending_wave2_link_reviews"]==1
          assert report["dependency_graph_has_cycles"] is False and report["human_peer_verified"] is False
          assert report["original_production_baseline_consulted"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit independent Wave 2 screened mathematical relationships only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen five ProofWiki alternative-source mathematical dependencies without false graph links"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
