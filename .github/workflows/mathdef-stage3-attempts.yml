name: Recover Stage 3 definition attempts for every term

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage3-attempts.yml'
  workflow_dispatch:

# Writes ONLY the isolated experiment's Stage 3 recovery ledger.
# The historical sealed Stage 3 and Stage 4 registries remain untouched.
permissions:
  contents: write

concurrency:
  group: mathdef-stage3-full-source-attempts
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout research pipeline
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated research tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Attempt all 318 terms with durable GitHub checkpoints
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=research_pipeline/experiments/reconstruction-v1
          LEDGER="$WORKSPACE/state/stage3_acquisition_attempts.jsonl"
          REPORT="$WORKSPACE/state/stage3_acquisition_report.json"

          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each batch is independently resumable, and each completed batch
          # is pushed to GitHub. At most 12*40 = 480 term attempts (including
          # a bounded retry for transient failures) are permitted per run.
          for batch in $(seq 1 12); do
            echo "===== Stage 3 acquisition batch $batch / 12 ====="
            python -m research_pipeline.engine.stage3_attempts \
              --workspace "$WORKSPACE" --ledger "$LEDGER" \
              --report "$REPORT" --batch-size 40 --delay 1.5
            git add -- "$LEDGER" "$REPORT"
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint definition-source attempt batch $batch"
              git push origin "HEAD:${{ github.ref_name }}"
            fi
          done
          # This fails if even one term was never attempted, or a transient
          # fetch error still requires another retry.
          python -m research_pipeline.engine.stage3_attempts \
            --workspace "$WORKSPACE" --ledger "$LEDGER" \
            --report "$REPORT" --verify-only

      - name: Preserve recovery evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-acquisition-attempts-${{ github.run_id }}
          path: |
            research_pipeline/experiments/reconstruction-v1/state/stage3_acquisition_attempts.jsonl
            research_pipeline/experiments/reconstruction-v1/state/stage3_acquisition_report.json
          if-no-files-found: warn
          retention-days: 30
