name: Screen sourced ball homeomorphism directional prerequisites — Batch 114
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-directional-links-batch114.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  dependency-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync latest independently researched main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress reusable engine and mathematics adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually source-screen ten ball homeomorphism directional dependencies
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_directional_metric_links_batch114 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Check historical links, frozen wave and quarantined mathematical source evidence
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          one=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(one.publication())==json.loads((one.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":453,"observations":906,"meanings":564,"relations":794}
          assert {k:len(w.records(k)) for k in counts}==counts
          assert not any(w.state(k).get("sealed") for k in counts)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==v for i,v in one.records(k).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_594_before_directional114.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in now}
          assert len(old)==len(now)==len(idx)==594
          for r in old:
            if not r["formulation_id"].startswith("form.wave2.directional113."):
              assert idx[r["formulation_id"]]==r
          assert len([i for i in w.records("relations") if i.startswith("rel.wave2.directional114.")])==10
          assert dict(Counter(r["decision"] for r in now))=={"linked":588,"no_supported_target":6}
          assert {i for r in now for i in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in now)
          held=jsonl(w.root/"wave2/directional112_quarantined_source_claims.jsonl")
          assert len(held)==1
          assert held[0]["observation_id"] not in {e for m in w.records("meanings").values() for f in m["formulations"] for e in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          result=json.loads((w.root/"state/wave2_directional114_link_review.json").read_text())
          assert result["all_784_old_links_preserved"] and result["all_587_unrelated_reviews_preserved"]
          assert result["held_gradient_source_claim_preserved_and_excluded"]
          assert not result["human_peer_verified"] and not result["production_corpus_used"]
          print(json.dumps(result,indent=2))
          PY
      - name: Commit independently reviewed links and historical disposition snapshot
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen ten direct directional/topological dependencies retaining unsafe-gradient quarantine"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
