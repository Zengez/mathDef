name: Independent mathDef Stage 2 title intake

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage2-intake.yml'
      - 'research_pipeline/engine/stage2_actions.py'
      - 'research_pipeline/engine/source_intake.py'
      - 'research_pipeline/experiments/reconstruction-v1/source_pages.jsonl'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathdef-stage2-title-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research engine and isolated experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify isolated pipeline tests
        run: python -m unittest discover -s research_pipeline/tests -v

      - name: Collect approved term-title candidates
        run: |
          python -m research_pipeline.engine.stage2_actions \
            --workspace research_pipeline/experiments/reconstruction-v1 \
            --manifest research_pipeline/experiments/reconstruction-v1/source_pages.jsonl \
            --output-dir research_pipeline/experiments/reconstruction-v1/stage2_actions_artifacts \
            --max-pages 12

      - name: Upload reviewable output even when an index fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-title-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: research_pipeline/experiments/reconstruction-v1/stage2_actions_artifacts/
          if-no-files-found: warn
          retention-days: 30
