name: Screen independent normal quotient graph and generating mathematics — Batch 119
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-quotient-graph-meanings-batch119.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  mathematical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync latest independently researched main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reusable engine and mathDef adapters
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen four source-specific contexts and six mathematical formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_quotient_graph_meanings_batch119 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independent source-term evidence
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check 600 previous formulation decisions and unsafe graph source hold
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":461,"observations":919,"meanings":572,"relations":803}
          assert {s:len(w.records(s)) for s in counts}==counts
          assert not any(w.state(s).get("sealed") for s in counts)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==r for k,r in first.records(s).items())
          ms=w.records("meanings")
          new=[m for m in ms.values() if m["id"].startswith("meaning.wave2.quot119.")]
          assert len(new)==4 and sum(len(m["formulations"]) for m in new)==6
          assert len(ms["meaning.wave2.quot119.normal-subgroup"]["formulations"])==3
          past=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_600_before_quot119.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in now}
          assert len(past)==600 and len(now)==len(ix)==606
          for r in past:
            n=ix[r["formulation_id"]]
            assert all(n.get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert dict(Counter(r["decision"] for r in now))=={"linked":594,"no_supported_target":6,"needs_review":6}
          assert {i for r in now for i in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in now)
          held=jsonl(w.root/"wave2/quot118_quarantined_source_claims.jsonl")
          assert len(held)==1 and held[0]["observation_id"] not in {e for m in ms.values() for fm in m["formulations"] for e in fm["evidence_ids"]}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_quot119_meaning_screen.json").read_text())
          assert report["normal_subgroup_equivalent_three_formulations_grouped"] and report["held_forward_only_graph_claim_unpromoted"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit source-scoped meanings and immutable prior review snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen normal quotient graph isomorphism and convergent OGF mathematical meanings"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
