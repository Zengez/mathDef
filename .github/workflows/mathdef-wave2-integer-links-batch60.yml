name: Screen integer and fraction-field prerequisites with historical rational review amendment — Batch 60

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-integer-links-batch60.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  verify-mathematical-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load latest Wave 2 state from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated portable tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen five exact-source definition links and record rational decision amendment
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_integer_field_links_batch60 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Check frozen lineage, all 516 decisions and source-to-source dependency integrity
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":402,"observations":826,"meanings":503,"relations":681}
          assert {s:len(w.records(s)) for s in expected}==expected
          assert not any(w.state(s).get("sealed") for s in expected)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in frozen.records(s).items())
          past=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_516_before_integer60.jsonl")
          final=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          byid={r["formulation_id"]:r for r in final}
          assert len(past)==len(final)==len(byid)==516
          changed={
            "form.wave2.integer59.integer-equivalence-class",
            "form.wave2.integer59.integer-ring",
            "form.wave2.integer59.fraction-field-integral-domain",
            "form.wave2.integer59.fraction-field-universal",
            "form.wave2.rational55.rational-number"
          }
          for row in past:
            if row["formulation_id"] not in changed:
              assert byid[row["formulation_id"]]==row
          assert all(x["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for x in final)
          assert {id for row in final for id in row["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(row["decision"] for row in final))=={"linked":511,"no_supported_target":5}
          assert len([id for id in w.records("relations") if id.startswith("rel.wave2.integer60.")])==5
          # Both definition variants must retain their own source locator.
          edges=w.records("relations")
          assert edges["rel.wave2.integer60.02"]["source_locator"]=="https://stacks.math.columbia.edu/tag/09FJ"
          assert edges["rel.wave2.integer60.03"]["source_locator"]=="https://proofwiki.org/wiki/Definition%3AField_of_Quotients"
          check_cycles(w.records("meanings"),w.records("relations"))
          event=jsonl(w.root/"events/rational_number_review_amendment_batch60.jsonl")
          assert len(event)==1
          assert event[0]["previous_decision"]=="no_supported_target"
          assert byid["form.wave2.rational55.rational-number"]["override_event_id"]==event[0]["event_id"]
          report=json.loads((w.root/"state/wave2_integer_field_prerequisite_batch60.json").read_text())
          assert report["old_676_links_preserved"] and report["one_no_supported_target_explicitly_amended"]
          assert report["integer_construction_still_awaits_natural_number_foundations"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent Wave 2 links and audit history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen integer and fraction-field dependencies with auditable rational-number revision"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
