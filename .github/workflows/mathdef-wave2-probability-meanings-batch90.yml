name: Screen independent probability/measurable-space contexts — Batch 90

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-probability-meanings-batch90.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout latest independent source data
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent research regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Source-screen four mathematical contexts
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_probability_meanings_batch90 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile entire source term review ledger
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Confirm old reviews, distinct codomain contexts and Wave 1 frozen lineage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":425,"observations":862,"meanings":527,"relations":719}
          assert {s:len(w.records(s)) for s in expected}==expected
          assert not any(w.state(s).get("sealed") for s in expected)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in old.records(s).items())
          ms=w.records("meanings")
          gen=ms["meaning.wave2.prob90.random-variable-general"]
          real=ms["meaning.wave2.prob90.random-variable-real"]
          assert gen["term_group_id"]==real["term_group_id"] and gen["context"]!=real["context"]
          assert ms["meaning.wave2.foundation.left-module-nonunital"]["formulations"][0]["id"]=="form.wave2.foundation.left-module-nonunital"
          prior=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_547_before_prob90.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          by={r["formulation_id"]:r for r in current}
          assert len(prior)==547 and len(current)==len(by)==551
          for r in prior:
            newer=by[r["formulation_id"]]
            assert all(newer.get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in current)
          assert {i for r in current for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in current))=={"linked":539,"no_supported_target":8,"needs_review":4}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_prob90_meaning_screen.json").read_text())
          assert report["random_variable_general_and_real_distinct_contexts"]
          assert report["old_547_formulation_dispositions_preserved"]
          assert not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent screened meanings with protected lineage
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen four measure/probability contexts preserving 547 prior mathematical reviews"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
