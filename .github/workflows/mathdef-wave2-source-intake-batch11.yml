name: Intake two exact Stacks site and fixed-target family sources

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-source-intake-batch11.yml'
      - 'research_pipeline/engine/wave2_foundations_batch11_site.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest committed independent checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run compilation and isolated research regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Add only two individually attributed Stacks source observations
        run: |
          python -m research_pipeline.engine.wave2_foundations_batch11_site \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Version previous 354-term individual source audit before 356-term ledger
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify frozen Wave 1 and no automatic mathematical approvals
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          w1=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((w1.root/"state/wave1_freeze.json").read_text())
          assert digest(w1.publication())==freeze["published_catalog_digest"]
          for stage,n in (("sources",9),("terms",356),("observations",779),("meanings",453),("relations",600)):
              assert len(w.records(stage))==n,stage
              assert not w.state(stage).get("sealed"),stage
          for stage in ("sources","terms","observations","relations"):
              assert all(w.records(stage).get(k)==v for k,v in w1.records(stage).items())
          previous=jsonl(w.root/"state/wave2_term_coverage_snapshot_354.jsonl")
          now=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          assert len(previous)==354 and len(now)==356
          newmap={x["term_id"]:x for x in now}
          assert len(newmap)==356
          assert all(newmap[x["term_id"]]==x for x in previous)
          report=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert report["source_read_new_candidates"]==30
          assert report["new_term_review_coverage"]==38
          assert report["new_source_locators_unverified"]==8
          assert report["mathematical_candidate_meanings_screened"]==34
          assert report["complete_for_wave2_sealing"] is False
          added=jsonl(w.root/"wave2/foundation_source_discovery_batch_11.jsonl")
          assert len(added)==2
          assert all(r["source_access_outcome"]=="direct_page_read" and r["meaning_screened"] is False for r in added)
          oldreview=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(oldreview)==465
          assert not any(r["decision"]=="needs_review" for r in oldreview)
          assert {id for r in oldreview for id in r["relation_ids"]}==set(w.records("relations"))
          scoped=json.loads((w.root/"state/wave2_foundations_batch_11.json").read_text())
          assert scoped["screened_meanings_added"]==0 and scoped["screened_links_added"]==0
          assert scoped["human_peer_verified"] is False
          print(json.dumps(scoped,indent=2))
          PY
      - name: Commit only independent reviewed source observations and coverage snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Independently source site and fixed-target morphism family with archived 354-term decisions"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
