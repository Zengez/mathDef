name: Export mathDef technical-term review input
on:
  push:
    branches:
      - 'work/targeted-2175-review-*'
    paths:
      - '.github/workflows/export-technical-terms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble precise historical review inputs
        run: |
          mkdir -p _technical_inputs
          cp -r research_pipeline/discovery/independent_term_review_20261028/survivor_batches _technical_inputs/
          cp -r research_pipeline/discovery/contextual_review_20261028/batches _technical_inputs/contextual_batches
          cp research_pipeline/discovery/independent_term_review_20261028/manifest.json _technical_inputs/input_manifest.json
          cp research_pipeline/discovery/contextual_review_20261028/manifest.json _technical_inputs/contextual_manifest.json
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path('_technical_inputs/survivor_batches')
          rows=[]
          for p in sorted(root.glob('*.tsv')):
              with p.open(encoding='utf8',newline='') as f:
                  rows+=list(csv.DictReader(f,delimiter='\t'))
          n=sum(r['disposition']=='needs_targeted_review' for r in rows)
          assert len(rows)==3109 and n==2175,(len(rows),n)
          print(f'Validated full survivor input: {len(rows)} rows, {n} targeted')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mathdef-2175-research-input
          path: _technical_inputs/
          retention-days: 30
