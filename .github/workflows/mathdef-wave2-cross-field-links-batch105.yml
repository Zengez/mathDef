name: Screen independent cross-field mathematical prerequisites — Batch 105

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-field-links-batch105.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  dependency-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read newest independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable research pipeline and adapter regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen eleven mathematically exact source-specific definition dependencies
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_field_links_batch105 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify frozen Wave1, historic review coverage and directed acyclicity
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":441,"observations":884,"meanings":547,"relations":765}
          assert {s:len(w.records(s)) for s in counts}==counts
          assert not any(w.state(s).get("sealed") for s in counts)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in frozen.records(s).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_573_before_cross105.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          index={r["formulation_id"]:r for r in current}
          assert len(old)==len(current)==len(index)==573
          assert len([r for r in w.records("relations") if r.startswith("rel.wave2.cross105.")])==11
          for prior in old:
            if not prior["formulation_id"].startswith("form.wave2.cross104."):
              assert index[prior["formulation_id"]]==prior
          assert dict(Counter(r["decision"] for r in current))=={"linked":567,"no_supported_target":6}
          assert {x for r in current for x in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in current)
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross105_link_review.json").read_text())
          assert report["historical_754_screened_links_preserved"] and report["historical_566_unrelated_formulation_reviews_preserved"]
          assert report["all_seven_new_formulations_separately_dependency_reviewed"]
          assert report["lipschitz_global_and_anchored_not_conflated"] and report["binary_and_countable_independence_not_conflated"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit individually vetted source relations and complete review history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen eleven cross-field source prerequisites preserving 754 historic links"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
