name: Independently acquire ordered-real and Dedekind completeness foundations

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-source-real45.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh latest independent mathematical research checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test independent research pipeline
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Intake four specifically sourced mathematical observations, not approved definitions
        run: |
          python -m research_pipeline.engine.wave2_real_source_batch45 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile 388 source terms with historic 384-research-term snapshot
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check frozen wave and individual evidence exactness and variant nonconflation
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          new=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          assert len(new.records("terms"))==388
          assert len(new.records("observations"))==811
          assert len(new.records("meanings"))==487
          assert len(new.records("relations"))==659
          assert all(new.records(s).get(k)==v for s in ("sources","terms","observations","relations") for k,v in old.records(s).items())
          assert not any(new.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          prior=jsonl(new.root/"state/wave2_term_coverage_snapshot_384.jsonl")
          current=jsonl(new.root/"state/wave2_term_coverage.jsonl")
          assert len(prior)==384 and len(current)==388
          mapped={x["term_id"]:x for x in current}
          assert len(mapped)==388 and all(mapped.get(x["term_id"])==x for x in prior)
          coverage=json.loads((new.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==388
          assert coverage["source_read_new_candidates"]==62
          assert coverage["new_source_locators_unverified"]==8
          assert coverage["new_term_review_coverage"]==70
          assert coverage["mathematical_candidate_meanings_screened"]==68
          assert coverage["complete_for_wave2_sealing"] is False
          source=jsonl(new.root/"wave2/foundation_source_discovery_batch_45.jsonl")
          assert len(source)==4 and all(r["source_access_outcome"]=="direct_page_read" and r["meaning_screened"] is False for r in source)
          r=json.loads((new.root/"state/wave2_real_source_batch_45.json").read_text())
          assert r["real_definition_circular_original_lead_rejected"]
          assert r["complete_ordered_field_requires_supremum_axiom"]
          assert r["ordered_field_distinct_from_complete_ordered_field"]
          assert r["modulus_sqrt_variant_requires_nonnegative_sqrt"]
          assert r["new_meanings_screened"]==0 and r["human_peer_verified"] is False
          print(json.dumps(r,indent=2))
          PY
      - name: Commit only independent Wave 2 source observations and archived review provenance
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Source four independent ordered-real observations retaining complete prior 384-term history"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
