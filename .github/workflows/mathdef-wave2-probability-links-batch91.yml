name: Audit independent probability and random-variable prerequisite links — Batch 91

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-probability-links-batch91.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read latest independently screened Wave 2 research
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent and reusable research regressions
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually screen eleven source/target dependencies with historical amendments
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_probability_links_batch91 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify historical 719 links, individual outcomes and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":425,"observations":862,"meanings":527,"relations":730}
          assert {s:len(w.records(s)) for s in expected}==expected
          assert not any(w.state(s).get("sealed") for s in expected)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in frozen.records(s).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_551_before_prob91.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          by={r["formulation_id"]:r for r in now}
          assert len(old)==len(now)==len(by)==551
          changed={f for f in by if f.startswith("form.wave2.prob90.")}
          stoch="form.wave2.found85.stochastic-process"
          cond="form.wave2.found85.conditional-expectation"
          changed.update({stoch,cond})
          assert len(changed)==6
          for r in old:
            if r["formulation_id"] not in changed:
              assert by[r["formulation_id"]]==r
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in now)
          assert {rid for r in now for rid in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in now))=={"linked":544,"no_supported_target":7}
          assert len([k for k in w.records("relations") if k.startswith("rel.wave2.prob91.")])==11
          assert by[cond]["relation_ids"]==["rel.wave2.found86.05","rel.wave2.prob91.10","rel.wave2.prob91.11"]
          check_cycles(w.records("meanings"),w.records("relations"))
          a=jsonl(w.root/"events/stochastic_process_no_target_amendment_batch91.jsonl")
          b=jsonl(w.root/"events/conditional_expectation_link_extension_batch91.jsonl")
          assert len(a)==len(b)==1
          assert a[0]["earlier_decision"]=="no_supported_target" and a[0]["new_decision"]=="linked"
          assert by[stoch]["override_event_id"]==a[0]["event_id"]
          assert by[cond]["link_extension_event_id"]==b[0]["event_id"]
          report=json.loads((w.root/"state/wave2_prob91_links.json").read_text())
          assert report["historical_719_links_preserved"]
          assert report["stochastic_process_previous_no_target_amended_explicitly"]
          assert report["conditional_expectation_old_sigma_link_retained_and_extended"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent source-screened links and historical audit
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen eleven independent probability relations and archive stochastic/expectation review amendments"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
