name: Screen independently sourced topology, linear kernel and derivative meanings — Batch 107

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-branch-meanings-batch107.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  mathematical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable research and mathDef adapter regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen five source-scoped contexts and seven formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_branch_meanings_batch107 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify independent source term review coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate old 573 review dispositions and independent frozen lineage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":445,"observations":891,"meanings":552,"relations":765}
          assert {k:len(w.records(k)) for k in expect}==expect
          assert not any(w.state(k).get("sealed") for k in expect)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==row for i,row in first.records(k).items())
          ms=w.records("meanings")
          new=[m for m in ms.values() if m["id"].startswith("meaning.wave2.cross107.")]
          assert len(new)==5 and sum(len(m["formulations"]) for m in new)==7
          assert len(ms["meaning.wave2.cross107.topological-closure"]["formulations"])==2
          assert len(ms["meaning.wave2.cross107.topological-boundary"]["formulations"])==2
          before=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_573_before_cross107.jsonl")
          after=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in after}
          assert len(before)==573 and len(after)==len(idx)==580
          for old in before:
            now=idx[old["formulation_id"]]
            assert all(now.get(k)==v for k,v in old.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in after)
          assert {i for r in after for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in after))=={"linked":567,"no_supported_target":6,"needs_review":7}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross107_meaning_screen.json").read_text())
          assert report["historical_573_individual_decisions_preserved"]
          assert report["historical_765_screened_links_preserved"]
          assert report["erroneous_exterior_boundary_variant_excluded"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit source-scoped mathematical screens and untouched prior reviews
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen five topological kernel and derivative meanings preserving all historical review decisions"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
