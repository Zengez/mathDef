name: Seal corrected independent Wave 1 Stage 5 after comprehensive review

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage5-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage5-reconstruction-writes
  cancel-in-progress: false

jobs:
  seal-complete-stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use freshest committed independent reconstruction
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full isolated test suite
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Check independent preview JavaScript syntax
        run: node --check research_pipeline/adapters/mathdef/preview.js
      - name: Audit complete source-backed Stage 5 review coverage
        run: |
          python -m research_pipeline.engine.stage5_review_gate \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery \
            --audit
      - name: Seal Stage 5 with non-bypassable formulation-coverage gate
        run: |
          python -m research_pipeline.engine.stage5_review_gate \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery \
            --seal
      - name: Verify saved seal, counts, and source isolation
        run: |
          python - <<'PY'
          import json, os, subprocess
          from collections import Counter
          from pathlib import Path
          from research_pipeline.engine.core import Workspace, atomic_json, digest
          path=Path("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace(path)
          status=w.status()
          for stage, expected in (("sources",9),("terms",318),("observations",749),("meanings",419),("relations",445)):
              assert status[stage]["sealed"] and status[stage]["count"]==expected, (stage,status[stage])
              assert w.state(stage)["record_digest"]==digest(list(w.records(stage).values())), stage
          reviews=[json.loads(line) for line in (path/"state/stage5_formulation_reviews.jsonl").read_text().splitlines() if line.strip()]
          assert len(reviews)==431 and len({row["formulation_id"] for row in reviews})==431
          dispositions=Counter(row["decision"] for row in reviews)
          assert dispositions=={"linked":338,"no_supported_target":89,"held_ambiguity":4}, dispositions
          relations=w.records("relations")
          types=Counter(x["relation_type"] for x in relations.values())
          assert types=={"definition_uses":428,"logical_implication":5,"equivalent_characterization":12}, types
          audited=json.loads((path/"state/stage5_review.json").read_text())
          assert audited["sealed"] and audited["reviewed"]==431 and audited["needs_review"]==0
          assert audited["screened_relations"]==445 and audited["complete"] and audited["human_verified"] is False
          evidence={
            "status":"Stage 5 complete and independently sealed",
            "human_verified":False,
            "reviewed_formulations":431,
            "meaning_candidates":419,
            "review_dispositions":dict(dispositions),
            "relations":445,
            "relation_types":dict(types),
            "stage3_observations_sealed":749,
            "stage4_meanings_sealed":419,
            "sealed_relation_digest":w.state("relations")["record_digest"],
            "test_suite":"All research_pipeline/tests and independent JavaScript syntax",
            "github_actions_run_id":os.environ.get("GITHUB_RUN_ID",""),
            "origin_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "caveat":"Editorially source-screened research reconstruction, not third-party mathematical peer review. Four ambiguous formulations remain held; no reference to production mathDef definitions."
          }
          atomic_json(path/"state/stage5_seal_evidence.json",evidence)
          print(json.dumps(evidence,indent=2))
          PY
      - name: Commit sealed Stage 5 and evidence atomically in Git history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/state/relations.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage5_review.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage5_seal_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Seal complete 431-formulation Stage 5 and audit 445 mathematical relationships"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Unable to persist complete Stage 5 seal" >&2
            exit 1
          fi
