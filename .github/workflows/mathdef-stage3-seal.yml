name: Seal corrected independent Stage 3 (review gate)

# Deliberately MANUAL: the source-attempt and per-term editorial gates
# must be satisfied first. The old reconstruction-v1 seal is historical.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research_pipeline/tests -v
      - name: Refuse to seal until all 318 term reviews are complete
        run: |
          python -m research_pipeline.engine.stage3_finalize \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery
      - name: Commit only corrected Stage 3 seal
        run: |
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/state/observations.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage3_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Seal corrected independent Stage 3 after full editorial review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
