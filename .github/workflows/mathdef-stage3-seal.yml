name: Seal independent mathDef Stage 3 evidence

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage3-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage3-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check isolated pipeline tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Audit all source-backed evidence and seal
        run: |
          python -m research_pipeline.engine.stage3_finalize \
            --workspace research_pipeline/experiments/reconstruction-v1
      - name: Commit isolated observations stage seal and audit
        run: |
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1/state/observations.json \
            research_pipeline/experiments/reconstruction-v1/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1/state/stage3_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Seal independent Wave 1 Stage 3 evidence registry"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
