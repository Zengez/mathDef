name: Independently acquire three Graph Theory ProofWiki foundations

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-source-graph42.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest verified independent research state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all scripts and run isolated pipeline tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Acquire three source observations with separately recorded graph conventions
        run: |
          python -m research_pipeline.engine.wave2_graph_source_batch42 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh individual 384-term source reviews retaining 381-term immutable snapshot
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify source rights provenance exact historical coverage and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((first.root/"state/wave1_freeze.json").read_text())
          assert digest(first.publication())==frozen["published_catalog_digest"]
          assert len(w.records("sources"))==9 and len(w.records("terms"))==384
          assert len(w.records("observations"))==807 and len(w.records("meanings"))==485
          assert len(w.records("relations"))==655
          assert all(w.records(s).get(k)==v for s in ("sources","terms","observations","relations") for k,v in first.records(s).items())
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          a=jsonl(w.root/"state/wave2_term_coverage_snapshot_381.jsonl")
          b=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          assert len(a)==381 and len(b)==384
          index={r["term_id"]:r for r in b}
          assert len(index)==384 and all(index.get(x["term_id"])==x for x in a)
          result=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert result["term_count"]==384 and result["new_term_review_coverage"]==66
          assert result["source_read_new_candidates"]==58
          assert result["new_source_locators_unverified"]==8
          assert result["mathematical_candidate_meanings_screened"]==66
          assert result["complete_for_wave2_sealing"] is False
          source=jsonl(w.root/"wave2/foundation_source_discovery_batch_42.jsonl")
          assert len(source)==3
          assert all(x["source_access_outcome"]=="direct_page_read" and not x["meaning_screened"] for x in source)
          report=json.loads((w.root/"state/wave2_graph_source_batch_42.json").read_text())
          assert report["source_conventions_distinguished"] is True
          assert report["multi_edges_not_conflated_with_simple_edges"] is True
          assert report["new_meanings_screened"]==0 and report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent Wave 2 graph source evidence
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record three independent graph-theory definition source observations and 384-term audit"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
