name: Screen scalar division-ring and left-right vector dependencies — Batch 102

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-scalar-links-batch102.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  dependency-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read latest independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portable pipeline and adapter regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually screen twelve precise mathematical source dependencies
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_scalar_division_ring_links_batch102 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify historical link extension events and graph
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":437,"observations":877,"meanings":541,"relations":754}
          assert {s:len(w.records(s)) for s in counts}==counts
          assert not any(w.state(s).get("sealed") for s in counts)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in frozen.records(s).items())
          ms=w.records("meanings")
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_566_before_scalar102.jsonl")
          actual=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in actual}
          assert len(old)==len(actual)==len(idx)==566
          changed={f for f in idx if f.startswith("form.wave2.scalar101.")}
          changed|={"form.wave2.analysis98.norm-over-normed-division-ring","form.wave2.analysis98.normed-vector-space"}
          assert len(changed)==7
          for prior in old:
            if prior["formulation_id"] not in changed:
              assert idx[prior["formulation_id"]]==prior
          ev=jsonl(w.root/"events/scalar102_norm_link_extension_events.jsonl")
          assert len(ev)==2
          for e in ev:
            assert all(i in idx[e["formulation_id"]]["relation_ids"] for i in e["previous_relation_ids"])
          assert len([r for r in w.records("relations") if r.startswith("rel.wave2.scalar102.")])==12
          assert dict(Counter(r["decision"] for r in actual))=={"linked":560,"no_supported_target":6}
          assert {i for r in actual for i in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in actual)
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_scalar102_link_review.json").read_text())
          assert report["all_742_prior_links_preserved"] and report["two_previous_norm_formulation_reviews_extended_with_events"]
          assert report["multiplicative_norm_vs_submultiplicative_ring_norm_distinct"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit independently audited math source relationships and historical review events
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen 12 scalar norm and left-right division-ring prerequisites preserving 742 older links"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
