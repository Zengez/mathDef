name: Acquire new ProofWiki algebra and relation foundation evidence after screened links

on:
  workflow_run:
    workflows:
      - Screen Wave 2 links after four new Stacks meaning reviews pass
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh authoritative independently screened source and relation state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile new modules and execute all isolated regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Intake only the four personally reviewed ProofWiki foundational source paraphrases
        run: |
          python -m research_pipeline.engine.wave2_foundations_batch6_settheory \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Expand term source-review coverage 343 to 347 without mutating historical 343 decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate exact source permissions and conservative mathematical review states
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((first.root/"state/wave1_freeze.json").read_text())
          assert digest(first.publication())==freeze["published_catalog_digest"]
          assert len(w.records("sources"))==9
          assert len(w.records("terms"))==347
          assert len(w.records("observations"))==770
          assert len(w.records("meanings"))==435
          assert len(w.records("relations"))==563
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          for stage in ("sources","terms","observations","relations"):
              assert all(w.records(stage).get(k)==v for k,v in first.records(stage).items())
          old=jsonl(w.root/"state/wave2_term_coverage_snapshot_343.jsonl")
          now=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          assert len(old)==343 and len(now)==347
          index={x["term_id"]:x for x in now}
          assert len(index)==347
          assert all(index.get(x["term_id"])==x for x in old)
          source=jsonl(w.root/"wave2/foundation_source_discovery_batch_06.jsonl")
          assert len(source)==4
          assert all(x["source_access_outcome"]=="direct_page_read" and
                     x["meaning_screened"] is False and
                     x["human_verified"] is False for x in source)
          report=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert report["term_count"]==347
          assert report["new_term_review_coverage"]==29
          assert report["source_read_new_candidates"]==21
          assert report["new_source_locators_unverified"]==8
          assert report["mathematical_candidate_meanings_screened"]==16
          assert report["complete_for_wave2_sealing"] is False
          original_rel={x["id"] for x in first.records("relations").values()}
          assert original_rel.issubset(w.records("relations"))
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent source evidence and source-review ledger snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record four ProofWiki foundational observations with archived 343-term source decisions"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
