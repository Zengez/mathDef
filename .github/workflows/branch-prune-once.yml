name: One-time branch pruning — mathDef
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-prune-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
