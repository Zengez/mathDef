name: Backfill individually reviewed Stirling and convex hull prerequisites — Batch 138
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-bridge-backfill-batch138.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  retroactive-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress reusable research engine and mathDef domain adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Append four directly sourced historic mathematical prerequisites
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_bridge_backfill_batch138 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate 883 earlier links and 639 unaltered formulation conclusions
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          one=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(one.publication())==json.loads((one.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":481,"observations":953,"meanings":595,"relations":887}
          assert {k:len(w.records(k)) for k in counts}==counts
          assert not any(w.state(k).get("sealed") for k in counts)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in one.records(k).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_639_before_bridge138.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in current}
          assert len(old)==len(current)==len(ix)==639
          changed=0
          affected={
            "form.wave2.cross133.stirling-second-kind.1",
            "form.wave2.cross133.stirling-second-kind.2",
            "form.wave2.cross133.convex-hull-real.2",
            "form.wave2.cross133.convex-hull-real.3"
          }
          for p in old:
            now=ix[p["formulation_id"]]
            if now==p:continue
            changed+=1
            assert p["formulation_id"] in affected
            assert now["relation_ids"][:len(p["relation_ids"])]==p["relation_ids"]
            assert all(now.get(k)==v for k,v in p.items() if k!="relation_ids")
          assert changed==4
          assert len([i for i in w.records("relations") if i.startswith("rel.wave2.bridge138.")])==4
          assert dict(Counter(r["decision"] for r in current))=={"linked":633,"no_supported_target":6}
          assert {i for r in current for i in r["relation_ids"]}==set(w.records("relations"))
          for p in ("wave2/conv125_quarantined_source_claims.jsonl","wave2/quot118_quarantined_source_claims.jsonl","wave2/directional112_quarantined_source_claims.jsonl"):
            h=jsonl(w.root/p)
            assert len(h)==1 and h[0]["observation_id"] not in {i for m in w.records("meanings").values() for f in m["formulations"] for i in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_bridge138_retroactive_links.json").read_text())
          assert report["all_883_previous_relations_preserved"]
          assert report["all_639_individual_formulation_decisions_and_rationales_untouched"]
          assert report["stirling_delta_and_falling_factorial_targets_recovered"]
          assert report["convex_hull_convex_set_target_recovered"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent mathematical link evidence and review-history snapshot
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover four mathematically screened Stirling and convex-hull prerequisite target links"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
