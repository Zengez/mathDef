name: Complete individual real absolute-value prerequisite review without fabricated links

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-review-absolute-value.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh independent Wave 2 mathematical source review state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile math pipeline modules and run full isolated suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Classify real absolute value as reviewed foundation with missing lower axioms
        run: |
          python -m research_pipeline.engine.wave2_review_real_absolute_value_foundation \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/wave2/real_absolute_value_individual_no_target_decision_2026-10-19.jsonl
      - name: Verify all 483 mathematical reviews retain exact historical meaning and source
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":9,"terms":368,"observations":791,"meanings":471,"relations":626}
          for stage,n in expected.items():
              assert len(w.records(stage))==n,stage
              assert not w.state(stage).get("sealed"),stage
          past=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_483_before_absolute_value_review.jsonl")
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(past)==len(reviews)==483
          index={r["formulation_id"]:r for r in reviews}
          assert len(index)==483
          key="form.wave2.analysis.real-absolute-value"
          for row in past:
              new=index[row["formulation_id"]]
              if row["formulation_id"]!=key:
                  assert row==new
              else:
                  assert row["decision"]=="needs_review"
                  assert new["decision"]=="no_supported_target"
                  assert new["original_wave2_pending_reason"]==row["editorial_reason"]
              assert row["relation_ids"]==new["relation_ids"]
          assert sum(r["decision"]=="linked" for r in reviews)==474
          assert sum(r["decision"]=="no_supported_target" for r in reviews)==9
          assert not any(r["decision"] in ("needs_review","held_ambiguity") for r in reviews)
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_real_absolute_value_dependency_review_complete.json").read_text())
          assert report["remaining_unreviewed"]==0
          assert report["screened_links"]==626
          assert report["original_483_formulation_review_snapshot_preserved"]
          assert report["future_real_ordered_field_foundation_research_needed"]
          assert report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent real-value review and its immutable event lineage
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Individually review real absolute value as elementary foundation preserving 483 prior mathematical decisions"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
