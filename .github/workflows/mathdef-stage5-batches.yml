name: Continue independent Stage 5 audited relation batches

on:
  push:
    paths:
      - 'research_pipeline/experiments/reconstruction-v1-recovery/intake/stage5-curated-batch-*.jsonl'
      - '.github/workflows/mathdef-stage5-batches.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage5-reconstruction-writes
  cancel-in-progress: false

jobs:
  review-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out freshest committed Stage 5 state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests and stage audits
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Idempotently process every committed reviewed batch
        run: |
          set -euo pipefail
          for batch in research_pipeline/experiments/reconstruction-v1-recovery/intake/stage5-curated-batch-*.jsonl; do
            python -m research_pipeline.engine.stage5_review_gate \
              --workspace research_pipeline/experiments/reconstruction-v1-recovery \
              --apply-batch "$batch"
          done
      - name: Check 431-formulation ledger without prematurely sealing Stage 5
        run: |
          python -m research_pipeline.engine.stage5_review_gate \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery --audit
      - name: Persist independent screened relations and checkpoint
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/records/relations.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/state/relations.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage5_formulation_reviews.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint subsequent independent Stage 5 definition links"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Unable to persist Stage 5 reviewed link batch" >&2
            exit 1
          fi
