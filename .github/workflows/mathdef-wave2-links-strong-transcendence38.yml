name: Screen Stacks strong transcendence ring prerequisites

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-links-strong-transcendence38.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest independently verified mathDef Wave 2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and regression-test all research engine scripts
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Screen two individually mathematically justified ring prerequisites
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_38.jsonl
      - name: Verify historical review, source, frozen Wave 1 and acyclic links
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==freeze["published_catalog_digest"]
          assert len(old.records("relations"))==445
          for stage,n in (("sources",9),("terms",377),("observations",800),("meanings",480),("relations",650)):
              assert len(w.records(stage))==n,stage
              assert not w.state(stage).get("sealed"),stage
          allrels=w.records("relations")
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==492 and len({r["formulation_id"] for r in reviews})==492
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(allrels)
          assert sum(r["decision"]=="needs_review" for r in reviews)==0
          r=next(x for x in reviews if x["formulation_id"]=="form.wave2.foundation.strongly-transcendental-subring-element")
          assert r["decision"]=="linked" and len(r["relation_ids"])==2
          source=jsonl(w.root/"intake/wave2_curated_relations_batch_38.jsonl")
          assert len(source)==2
          assert all(allrels[x["id"]]==x for x in source)
          check_cycles(w.records("meanings"),allrels)
          report=json.loads((w.root/"state/wave2_link_review_batch_38.json").read_text())
          assert report["added_source_grounded_links"]==2
          assert report["total_screened_links"]==650
          assert report["dependency_graph_has_cycles"] is False
          assert report["human_peer_verified"] is False
          assert report["original_production_baseline_consulted"] is False
          assert report["wave2_link_stage_sealed"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent screened mathematical links and individual review provenance
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen Stacks strong-transcendence ring prerequisites preserving 648 prior links"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
