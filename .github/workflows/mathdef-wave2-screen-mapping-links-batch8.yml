name: Screen eight contextual mapping and subset mathematical dependencies

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-mapping-links-batch8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reload latest source-reviewed independent Wave 2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source screening scripts and run all independent regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Screen eight individual mapping graph subset and topological relationships
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_08.jsonl
      - name: Validate mathematical cycles, preserved review history and complete frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          for stage,number in (("sources",9),("terms",350),("observations",773),("meanings",447),("relations",582)):
             assert len(w.records(stage))==number,stage
             assert not w.state(stage).get("sealed"),stage
          allrels=w.records("relations")
          assert all(allrels.get(k)==v for k,v in first.records("relations").items())
          newlinks=jsonl(w.root/"intake/wave2_curated_relations_batch_08.jsonl")
          assert len(newlinks)==8 and len({r["id"] for r in newlinks})==8
          assert all(allrels[r["id"]]==r for r in newlinks)
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==459 and len({r["formulation_id"] for r in reviews})==459
          assert {id for row in reviews for id in row["relation_ids"]}==set(allrels)
          current=Counter(r["decision"] for r in reviews)
          assert current=={"linked":444,"no_supported_target":10,"held_ambiguity":1,"needs_review":4}
          earlier=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_453_before_foundations09.jsonl")
          assert len(earlier)==453
          mapped={r["formulation_id"]:r for r in reviews}
          assert all(mapped[r["formulation_id"]]["original_wave1_disposition"]==r["original_wave1_disposition"] for r in earlier)
          check_cycles(w.records("meanings"),allrels)
          report=json.loads((w.root/"state/wave2_link_review_batch_08.json").read_text())
          assert report["total_screened_links"]==582
          assert report["added_source_grounded_links"]==8
          assert report["dependency_graph_has_cycles"] is False
          assert report["human_peer_verified"] is False
          assert report["wave2_link_stage_sealed"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only individually reviewed independent mathematical prerequisites and audit events
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Individually screen eight source-grounded mapping subset and topology prerequisites"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
