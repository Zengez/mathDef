name: Build corrected independent Stage 4 mathematical meanings

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage4-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage4-rebuild
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete isolated research regression suite
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Generate one candidate meaning per distinct mathematical context
        run: |
          python -m research_pipeline.engine.stage4_recovery_build \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery \
            --output /tmp/mathdef-reviewed-meanings.jsonl
      - name: Ingest all mathematical meanings, preserving alternate formulations
        run: |
          python -m research_pipeline.engine.cli \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery \
            ingest meanings --input /tmp/mathdef-reviewed-meanings.jsonl --batch-size 25
      - name: Audit full review coverage and seal Stage 4
        run: |
          python -m research_pipeline.engine.stage4_finalize \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery --seal
      - name: Commit only independent Stage 4 meaning/variant reconstruction
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/records/meanings.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/state/meanings.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage4_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Seal corrected Stage 4 meanings across all reviewed Stacks terms"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Unable to commit Stage 4 result safely" >&2
            exit 1
          fi
