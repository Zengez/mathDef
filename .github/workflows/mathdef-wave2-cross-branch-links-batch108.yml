name: Screen independent topological, kernel and derivative prerequisites — Batch 108

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-branch-links-batch108.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  link-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read latest independent researched main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generic engine and mathDef-adapter integrity
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen nine independent source-to-meaning prerequisite links
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_branch_links_batch108 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify immutable first wave and individual link disposition history
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":445,"observations":891,"meanings":552,"relations":774}
          assert {k:len(w.records(k)) for k in expect}==expect
          assert not any(w.state(k).get("sealed") for k in expect)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_580_before_cross108.jsonl")
          new=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in new}
          assert len(old)==len(new)==len(ix)==580
          for row in old:
            if not row["formulation_id"].startswith("form.wave2.cross107."):
              assert ix[row["formulation_id"]]==row
          assert len([r for r in w.records("relations") if r.startswith("rel.wave2.cross108.")])==9
          assert {i for r in new for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in new))=={"linked":574,"no_supported_target":6}
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in new)
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross108_link_review.json").read_text())
          assert report["historic_765_links_preserved"] and report["historic_573_unrelated_formulation_reviews_preserved"]
          assert report["closure_not_circularly_defined_using_boundary"]
          assert report["invalid_boundary_exterior_source_variant_excluded"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only screened independent relations and exact historical snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen nine topological kernel derivative prerequisite links preserving 765 historical relationships"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
