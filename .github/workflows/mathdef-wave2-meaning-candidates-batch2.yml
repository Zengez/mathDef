name: Wave 2 ring/category context-sensitive meaning candidates

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-meaning-candidates-batch2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use freshest GitHub state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full isolated regressions
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Import two scoped but not yet screened mathematical meanings
        run: |
          python -m research_pipeline.engine.wave2_meaning_candidates_batch2 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify no frozen or inherited meaning changed
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest
          a=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          b=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((a.root/"state/wave1_freeze.json").read_text())
          assert digest(a.publication())==freeze["published_catalog_digest"]
          assert len(b.records("terms"))==336 and len(b.records("observations"))==759
          assert len(b.records("meanings"))==428
          assert sum(len(x["formulations"]) for x in b.records("meanings").values())==440
          assert len(b.records("relations"))==445
          for s in ("sources","terms","observations","meanings","relations"):
              assert not b.state(s).get("sealed"),s
              assert all(b.records(s).get(k)==v for k,v in a.records(s).items()),s
          assert all(m["formulations"][0]["review_state"]=="candidate" for k,m in
                   b.records("meanings").items() if k.startswith("meaning.wave2."))
          print("Nine meaning candidates, zero screened or published, frozen Wave 1 intact.")
          PY
      - name: Save checkpoint within independent Wave 2 only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          git commit -m "Append two mathematically scoped ring and small-category Wave 2 research candidates"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
