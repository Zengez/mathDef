name: Independent Wave2 dependency graph pilot

on:
  push:
    branches: [main]
    paths:
      - 'research_pipeline/engine/dependency_graph.py'
      - 'research_pipeline/engine/dependency_phase_gate.py'
      - 'research_pipeline/engine/dependency_generation.py'
      - 'research_pipeline/adapters/mathdef/dependency_scan.py'
      - 'research_pipeline/adapters/mathdef/phase_gate_policy.json'
      - 'research_pipeline/tests/test_dependency_graph.py'
      - 'research_pipeline/tests/test_dependency_generation.py'
      - 'research_pipeline/experiments/reconstruction-v2-independent/records/*.jsonl'
      - 'research_pipeline/experiments/reconstruction-v2-independent/population/records/*.jsonl'
      - 'research_pipeline/experiments/reconstruction-v2-independent/dependency_graph/inbox/*.json'
      - '.github/workflows/research-dependency-graph.yml'
  workflow_dispatch:
    inputs:
      proposal_limit:
        description: "Additional unscanned formulation proposal snapshots (zero for inventory only)"
        required: false
        default: '75'
        type: string

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  graph:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test crash recovery and contextual-linking invariants
        run: |
          python -m compileall -q research_pipeline/engine/dependency_graph.py research_pipeline/adapters/mathdef/dependency_scan.py
          python -m unittest research_pipeline.tests.test_dependency_graph research_pipeline.tests.test_dependency_generation -v
      - name: Generate and commit isolated inventory and bounded, nonauthoritative graph proposals
        env:
          PROPOSAL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.proposal_limit || '75' }}
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKSPACE="research_pipeline/experiments/reconstruction-v2-independent"
          GRAPH="$WORKSPACE/dependency_graph"
          case "$PROPOSAL_LIMIT" in ''|*[!0-9]*) echo "Invalid proposal limit" >&2; exit 1 ;; esac
          if [ "$PROPOSAL_LIMIT" -gt 100 ]; then echo "Bound at 100 per commit" >&2; exit 1; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            python -m research_pipeline.engine.dependency_graph \
              --workspace "$WORKSPACE" --mode inventory
            # A committed semantic-scan batch is ingested only into this
            # independent graph; no promotion or certification occurs.
            python -m research_pipeline.engine.dependency_graph \
              --workspace "$WORKSPACE" --mode apply_inbox --limit 20
            # A reviewed owner-approved phase policy eliminates repetitive manual
            # gate packet uploads; it only seals a complete, version-pinned graph.
            # It never approves mathematical definitions or production publication.
            python -m research_pipeline.engine.dependency_phase_gate \
              --workspace "$WORKSPACE" \
              --policy research_pipeline/adapters/mathdef/phase_gate_policy.json \
              --apply
            # Freeze the original first-generation candidate list once, after the
            # graph has a valid gate. Staged research does not alter this inventory.
            python - <<'PY'
          from pathlib import Path
          from research_pipeline.engine.dependency_graph import read
          from research_pipeline.engine.dependency_generation import create
          root = Path("research_pipeline/experiments/reconstruction-v2-independent")
          state = read(root / "dependency_graph" / "STATE.json")["summary"]
          if state["consolidation_gate_valid"]:
              print(create(root))
          else:
              print("Research milestone remains gated")
          PY
            python -m research_pipeline.engine.dependency_graph \
              --workspace "$WORKSPACE" --mode propose --limit "$PROPOSAL_LIMIT"
            python -m research_pipeline.engine.dependency_graph \
              --workspace "$WORKSPACE" --mode queue --limit 10 > /tmp/dependency-queue-summary.json
            # The legacy population planner must never retain unrelated breadth
            # recommendations after the dependency graph changes phase.
            python -m research_pipeline.engine.population_queue \
              --workspace "$WORKSPACE" \
              --profile research_pipeline/adapters/mathdef/population_topics.json --write
            git add -- "$GRAPH" "$WORKSPACE/population/QUEUE.json" "$WORKSPACE/generation_staging"
            if git diff --cached --name-only | grep -Ev "^($GRAPH/|$WORKSPACE/population/QUEUE[.]json$|$WORKSPACE/generation_staging/)"; then
              echo "Write escaped isolated graph workspace" >&2; exit 1
            fi
            if git diff --cached --quiet; then echo "No new graph work"; exit 0; fi
            git commit -m "Checkpoint independent Wave2 dependency inventory and safe scan proposals"
            if git push origin HEAD:main; then
              echo "Persisted graph snapshot and bounded pilot"; exit 0
            fi
            echo "Concurrent population write: restart from newest committed graph"
          done
          echo "Unable to commit graph after retries" >&2
          exit 1
