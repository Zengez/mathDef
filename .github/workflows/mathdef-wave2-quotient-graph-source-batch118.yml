name: Admit independent quotient graph generating source evidence — Batch 118
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-quotient-graph-source-batch118.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync most recent independent Wave2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generic engine and math-specific adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four source headings, seven observations, one held graph error
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_quotient_graph_source_batch118 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independent source coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify source-only additions and previous mathematical screens
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          f=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(f.publication())==json.loads((f.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":461,"observations":919,"meanings":568,"relations":803}
          assert {s:len(w.records(s)) for s in counts}==counts
          assert not any(w.state(s).get("sealed") for s in counts)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==r for k,r in f.records(s).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(old)==600 and dict(Counter(r["decision"] for r in old))=={"linked":594,"no_supported_target":6}
          assert {i for r in old for i in r["relation_ids"]}==set(w.records("relations"))
          held=jsonl(w.root/"wave2/quot118_quarantined_source_claims.jsonl")
          assert len(held)==1 and held[0]["observation_id"]=="obs.wave2.quot118.graph-isomorphism.02"
          assert held[0]["observation_id"] not in {e for m in w.records("meanings").values() for fm in m["formulations"] for e in fm["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_quot118_source_intake.json").read_text())
          assert report["graph_forward_only_not_promoted"] and report["new_mathematical_meanings"]==0
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independently sourced source/term records
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit quotient graph and generating independent source evidence with graph caution"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
