name: Screen group quotient graph isomorphism and OGF prerequisites — Batch 120
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-quotient-graph-links-batch120.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  link-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent source-review main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress generic engine and topic-specific adapters
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Review eight direct individual dependencies and target-coverage gaps
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_quotient_graph_links_batch120 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify immutable Wave1, historical links and source holds
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":461,"observations":919,"meanings":572,"relations":811}
          assert {s:len(w.records(s)) for s in counts}==counts
          assert not any(w.state(s).get("sealed") for s in counts)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==r for k,r in first.records(s).items())
          prev=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_606_before_quot120.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in now}
          assert len(prev)==len(now)==len(idx)==606
          for p in prev:
            if not p["formulation_id"].startswith("form.wave2.quot119."):
              assert idx[p["formulation_id"]]==p
          assert len([i for i in w.records("relations") if i.startswith("rel.wave2.quot120.")])==8
          assert dict(Counter(r["decision"] for r in now))=={"linked":600,"no_supported_target":6}
          assert {i for r in now for i in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in now)
          assert len(jsonl(w.root/"wave2/quot120_missing_prerequisite_target_candidates.jsonl"))==3
          held=jsonl(w.root/"wave2/quot118_quarantined_source_claims.jsonl")
          assert len(held)==1 and held[0]["observation_id"] not in {e for m in w.records("meanings").values() for f in m["formulations"] for e in f["evidence_ids"]}
          assert len(jsonl(w.root/"wave2/directional112_quarantined_source_claims.jsonl"))==1
          check_cycles(w.records("meanings"),w.records("relations"))
          r=json.loads((w.root/"state/wave2_quot120_link_review.json").read_text())
          assert r["all_prior_803_links_preserved"] and r["all_600_unrelated_formulation_dispositions_preserved"]
          assert r["three_missing_dependency_targets_logged_not_invented"] and r["source_held_graph_forward_only_unpromoted"]
          assert not r["human_peer_verified"] and not r["production_corpus_used"]
          print(json.dumps(r,indent=2))
          PY
      - name: Commit independent mathematical links and historic reviews
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review eight quotient graph and analytic generating prerequisites with source holds"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
