name: Screen nine Wave 2 foundations individually with source-comparison revisions

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-foundations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh latest Wave 2 revisions and frozen reference
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full independent regression tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Individually screen nine source-grounded, context-labelled mathematical meanings
        run: |
          python -m research_pipeline.engine.wave2_screen_foundations \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify isolated revision history and all inherited meanings
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          w1=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w2=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(w1.publication())==json.loads(
             (w1.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          inherited=w1.records("meanings")
          revised=w2.records("meanings")
          assert len(inherited)==419 and len(revised)==428
          assert all(revised.get(k)==v for k,v in inherited.items())
          extra=[m for k,m in revised.items() if k not in inherited]
          assert len(extra)==9
          assert all(f["review_state"]=="screened" for m in extra for f in m["formulations"])
          assert all(m["human_verified"] is False for m in extra)
          assert len(w1.records("relations"))==len(w2.records("relations"))==445
          events=jsonl(w2.root/"events/revisions.jsonl")
          assert len(events)==9
          assert len({x["event_id"] for x in events})==9
          for stage in ("sources","terms","observations","meanings","relations"):
              assert w2.state(stage).get("sealed") is not True
          report=json.loads((w2.root/"state/wave2_foundation_meanings_screened.json").read_text())
          assert report["screened_wave2_foundations"]==9
          assert report["source_review_records"]==9
          assert report["screened_meaning_stage_sealed"] is False
          print("Nine individually source-screened meanings; nine independent audited revision events; no seals.")
          PY
      - name: Commit revision ledger, nine meaning screenings and evidence to Wave 2
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          git commit -m "Screen nine source-reviewed Wave 2 foundations with nine explicit mathematical revision events"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
