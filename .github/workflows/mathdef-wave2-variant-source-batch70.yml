name: Admit independent connectedness and Noetherian alternative sources — Batch 70

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-variant-source-batch70.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest independent Wave 2
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full independent pipeline regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Ingest 2 terms and 7 independently researched formulation observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_connected_noetherian_source_batch70 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Update independently reviewed term evidence with historical preservation
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check frozen lineage, source audit and full history
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          wanted={"sources":14,"terms":410,"observations":841,"meanings":509,"relations":693}
          assert {s:len(w.records(s)) for s in wanted}==wanted
          assert not any(w.state(s).get("sealed") for s in wanted)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in first.records(s).items())
          previous=jsonl(w.root/"state/wave2_term_coverage_snapshot_408.jsonl")
          current=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          index={r["term_id"]:r for r in current}
          assert len(previous)==408 and len(current)==len(index)==410
          assert all(index[r["term_id"]]==r for r in previous)
          for label,num in (("connected",3),("noetherian",4)):
            term="term.wave2.variant70."+label
            assert len([o for o in w.records("observations").values() if o["term_id"]==term])==num
          assert len(jsonl(w.root/"state/wave2_formulation_reviews.jsonl"))==524
          info=json.loads((w.root/"state/wave2_variant70_source_intake.json").read_text())
          assert info["historical_stacks_nonempty_connected_meaning_preserved"]
          assert info["empty_connected_convention_distinct_context"]
          assert not info["original_production_mathdef_content_consulted"]
          print(json.dumps(info,indent=2))
          PY
      - name: Commit only independent research records and proof history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Independently source three connected-space and four Noetherian variants"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
