name: Stage-only mathDef cleanup (no linking rebuild)
on:
  workflow_dispatch:
  push:
    branches:
      - work/dedup-subject-context-sources-20261027
    paths:
      - 'data/merged_cleanup_decisions.json'
      - 'data/merged_cleanup_retained_variants.json'
      - 'data/math_subjects.json'
      - 'data/math_subject_routing.json'
      - 'data/math_subject_assignments.json'
      - 'data/math_contexts.json'
      - 'data/math_definition_conventions.json'
      - 'data/math_source_convention_assessments.json'
      - 'research_pipeline/adapters/mathdef/merged_cleanup.py'
      - 'research_pipeline/adapters/mathdef/dedup_screen.py'
      - 'research_pipeline/tests/test_dedup_screen.py'
      - 'data/merged_cleanup_cross_heading_review.json'
      - 'research_pipeline/adapters/mathdef/subject_routing.py'
      - 'research_pipeline/adapters/mathdef/conventions.py'
      - 'research_pipeline/adapters/mathdef/stage_cleanup.py'
      - 'research_pipeline/tests/test_merged_cleanup.py'
      - 'research_pipeline/tests/test_conventions.py'
      - '.github/workflows/cleanup-stage-only.yml'
permissions:
  contents: read
jobs:
  stage-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test semantic cleanup and live convention fallback
        run: python -m unittest research_pipeline.tests.test_merged_cleanup research_pipeline.tests.test_conventions -v
      - name: Compile merged canonical cleanup WITHOUT any global linking
        run: |
          python -m research_pipeline.adapters.mathdef.stage_cleanup --output /tmp/mathdef-cleanup-stage
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/mathdef-cleanup-stage')
          report=json.loads((root/'cleanup-report.stage-only.json').read_text())
          catalog=json.loads((root/'catalog.stage-only.json').read_text())
          sources=json.loads((root/'sources.stage-only.json').read_text())
          checks=json.loads((root/'build-provenance.stage-only.json').read_text())
          assert checks['full_linking_rebuild_ran'] is False
          assert checks['published'] is False
          assert report['starting_meanings']==2197
          assert report['starting_formulations']==2246
          cross=json.loads(Path('data/merged_cleanup_cross_heading_review.json').read_text())
          ncross=len(cross['clear_duplicate_pending_group_migration'])
          ngroup_only=len(cross.get('group_only_alias_merges', []))
          nalias=ncross+ngroup_only
          expected_merges=len(json.loads(Path('data/merged_cleanup_decisions.json').read_text())['merge_meanings'])+ncross
          assert report['removed_duplicate_meanings']==expected_merges
          assert report['surviving_meanings']==2197-report['removed_duplicate_meanings']
          assert len(catalog['groups'])==2048-nalias
          assert len(sources['groups'])==2048-nalias
          assert report['retired_searchable_heading_aliases']==nalias
          assert len(report['group_only_alias_cases_applied'])==ngroup_only
          assert len(catalog['consolidated_ids']['group_aliases'])==nalias
          surviving_groups={g['id']:g for g in catalog['groups']}
          for case in cross['clear_duplicate_pending_group_migration']:
              assert case['removed_group_id'] not in surviving_groups
              target=surviving_groups[case['retained_group_id']]
              assert case['removed_title'].casefold() in {s.casefold() for s in [target['title'], *target['aliases']]}
              assert catalog['consolidated_ids']['group_aliases'][case['removed_group_id']]==target['id']
          for case in cross.get('group_only_alias_merges', []):
              assert case['removed_group_id'] not in surviving_groups
              target=surviving_groups[case['retained_group_id']]
              assert case['removed_title'].casefold() in {s.casefold() for s in [target['title'], *target['aliases']]}
              assert catalog['consolidated_ids']['group_aliases'][case['removed_group_id']]==target['id']
          # Recovery integrity: all historical original IDs remain accessible
          # through a live meaning or an explicit consolidation alias.
          all_meanings=[m for g in catalog['groups'] for m in g['meanings']]
          all_forms=[f for m in all_meanings for f in m['formulations']]
          original_ids={x for m in all_meanings
                        for x in ([m['original_definition_id']]
                                  if m.get('original_definition_id') else [])
                        + m.get('legacy_original_definition_ids',[])}
          assert len(original_ids)==1014, f"Original ID aliases lost: {len(original_ids)} / 1014"
          meaning_ids={m['id'] for m in all_meanings}
          form_ids={f['id'] for f in all_forms}
          assert len(meaning_ids)==len(all_meanings)
          assert len(form_ids)==len(all_forms)
          assert all(r['from_formulation'] in form_ids
                     and r['target_meaning'] in meaning_ids
                     for r in catalog['relations']), "Dangling stage-only relation endpoint"
          known_sources=set(sources['sources'])
          assert all(set(group['source_ids'])<=known_sources for group in sources['groups'])
          # Check the two surviving original TeX multi-form meanings explicitly.
          # Closure's duplicate neighborhood description was consolidated;
          # metric, sequential and Kuratowski constructions must still survive.
          closure_group=next(g for g in catalog['groups'] if g['title'].casefold()=='closure')
          closure=next(m for m in closure_group['meanings']
                       if m['id']=='meaning.mathdef.original.topology.closure')
          cforms={f['id'] for f in closure['formulations']}
          assert 'form.mathdef.original.topology.closure.primary' in cforms
          assert 'form.mathdef.original.topology.closure.neighborhood' not in cforms
          for suffix in ('metric','sequences','kuratowski'):
              assert 'form.mathdef.original.topology.closure.'+suffix in cforms
          assert catalog['consolidated_ids']['formulation_aliases'].get(
              'form.mathdef.original.topology.closure.neighborhood'
          )=='form.mathdef.original.topology.closure.primary'
          function_group=next(g for g in catalog['groups'] if g['title'].casefold()=='function')
          function=next(m for m in function_group['meanings']
                        if m['id']=='meaning.mathdef.original.functions.function')
          assert {f['id'] for f in function['formulations']}=={
              'form.mathdef.original.functions.function.primary',
              'form.mathdef.original.functions.function.graph'
          }
          assert report['subject_missing']==0, "Every surviving meaning must have a mathematical Subject"
          assert report['retained_variant_groups_reviewed']>=40, "Reviewed variants must survive"
          assert len(report['convention_sensitive_text_translations'])==1
          assert report['source_convention_assessments']==1
          assert report['is_publication_ready'] is False
          assert len(catalog['consolidated_ids']['meaning_aliases'])==report['removed_duplicate_meanings']
          titles={g['title'].lower():g for g in catalog['groups']}
          connected=titles['connected space']
          assert len(connected['meanings'])==1, 'Canonical connected-space meaning should be unique'
          assert 'convention_notes' in connected['meanings'][0]
          component=titles['connected component']['meanings'][0]
          assert 'nonempty connected subset' in component['formulations'][0]['text']
          stacks=[row for row in sources['sources'].values() if row['url']=='https://stacks.math.columbia.edu/tag/004R']
          assert len(stacks)==1
          assert stacks[0]['source_convention_assessments'][0]['status']=='verified_applies'
          assert stacks[0]['source_convention_assessments'][0]['restriction']=='nonempty_required'
          inv=json.loads((root/'comparison-inventory.stage-only.json').read_text())
          print('EXISTING_ORIGINAL_NEW_GROUPS='+json.dumps([
              {'term':x['title'],'old':x['original_ids'],'new':x['researched_ids']}
              for x in inv['original_versus_researched']
          ],ensure_ascii=False,separators=(',',':')))
          print('EXISTING_RESEARCH_ONLY_MULTI_GROUPS='+json.dumps([
              {'term':x['title'],'new':x['researched_ids']}
              for x in inv['within_research']
          ],ensure_ascii=False,separators=(',',':')))
          print('Staged semantic merge + convention/source checks passed', {
              'terms':len(catalog['groups']),
              'meanings':report['surviving_meanings'],
              'formulations':report['surviving_formulations'],
              'source_ids':len(sources['sources'])
          })
          PY
      - name: Test existing-definition comparison screen
        run: python -m unittest research_pipeline.tests.test_dedup_screen -v
      - name: Screen live existing definitions without new terms or link rebuild
        run: |
          python -m research_pipeline.adapters.mathdef.dedup_screen \
            --catalog /tmp/mathdef-cleanup-stage/catalog.stage-only.json \
            --output /tmp/mathdef-cleanup-stage/existing-dedup-screen.stage-only.json \
            --limit 60
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/mathdef-cleanup-stage')
          data=json.loads((root/'existing-dedup-screen.stage-only.json').read_text())
          catalog=json.loads((root/'catalog.stage-only.json').read_text())
          gids={g['id'] for g in catalog['groups']}
          mids={m['id'] for g in catalog['groups'] for m in g['meanings']}
          fids={f['id'] for g in catalog['groups'] for m in g['meanings']
                for f in m['formulations']}
          assert data['kind']=='existing_definitions_only_no_vocabulary_discovery'
          assert data['counts']['groups']==len(gids)
          for x in data['cross_heading_lexical_screen']:
              assert x['left_group'] in gids and x['right_group'] in gids
              assert x['left_meaning'] in mids and x['right_meaning'] in mids
              assert x['left_formulation'] in fids and x['right_formulation'] in fids
              assert x['left_group']!=x['right_group']
          print('Screened ONLY existing canonical IDs for manual deduplication review.')
          PY
