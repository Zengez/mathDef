name: Revisit Cauchy dependencies using independent rational foundations — Batch 56

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-rational-links-batch56.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  verify-links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest independently reconstructed wave on main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run portable and mathDef-specific regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Record six mathematically justified noncircular links and one prior-decision revision
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_rational_prerequisite_links_batch56 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Check 670 earlier links and every unrelated individual mathematical review unchanged
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":399,"observations":822,"meanings":500,"relations":676}
          assert {s:len(w.records(s)) for s in expect}==expect
          assert not any(w.state(s).get("sealed") for s in expect)
          for stage in ("sources","terms","observations","relations"):
            assert all(w.records(stage).get(i)==v for i,v in first.records(stage).items()),stage
          prior=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_512_before_rational56.jsonl")
          final=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(prior)==len(final)==512
          finalby={r["formulation_id"]:r for r in final}
          assert len(finalby)==512
          changed={
            "form.wave2.real51.rational-cauchy",
            "form.wave2.rational55.rational-number",
            "form.wave2.rational55.rational-sequence",
            "form.wave2.rational55.rational-absolute-value",
            "form.wave2.rational55.strictly-positive-rational"
          }
          for old in prior:
            if old["formulation_id"] not in changed:
              assert finalby[old["formulation_id"]]==old
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in final)
          assert {i for r in final for i in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in final))=={"linked":507,"no_supported_target":5}
          assert len([r for r in w.records("relations") if r.startswith("rel.wave2.rational56.")])==6
          check_cycles(w.records("meanings"),w.records("relations"))
          event=jsonl(w.root/"events/rational_cauchy_override_batch56.jsonl")
          assert len(event)==1
          assert event[0]["previous_decision"]=="no_supported_target"
          assert finalby["form.wave2.real51.rational-cauchy"]["override_event_id"]==event[0]["event_id"]
          report=json.loads((w.root/"state/wave2_rational_dependency_review_batch56.json").read_text())
          assert report["historic_670_links_preserved"]
          assert report["previous_no_supported_target_overridden_with_explicit_event"]
          assert report["strict_epsilon_excludes_zero"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit independent graph, review snapshot and amendment event only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review six noncircular rational prerequisites with explicit Cauchy override event"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
