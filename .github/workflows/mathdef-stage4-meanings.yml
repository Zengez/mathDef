name: Seal corrected independent Stage 4 meanings

# No automatic reinsertion of the old 25-term Stage 4 batches.
# The corrected source-review gates must pass before sealing new meanings.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research_pipeline/tests -v
      - name: Refuse to seal meanings with unsupported or omitted terms
        run: |
          python -m research_pipeline.engine.stage4_finalize \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery \
            --seal
      - name: Commit only corrected Stage 4 meanings/audit
        run: |
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/records/meanings.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/state/meanings.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage4_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Seal corrected Stage 4 after dynamic full-coverage review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
