name: Source four independently reviewed module and topology foundations — Batch 75

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-foundations-source-batch75.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout authoritative independent Wave 2 main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent research pipeline regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four source-scoped terms and seven individual observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_foundations_source_batch75 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Extend individual term evidence coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify original Wave 1 and all previous evidence decisions
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          want={"sources":14,"terms":414,"observations":848,"meanings":510,"relations":698}
          assert {s:len(w.records(s)) for s in want}==want
          assert not any(w.state(s).get("sealed") for s in want)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in old.records(s).items())
          past=jsonl(w.root/"state/wave2_term_coverage_snapshot_410.jsonl")
          current=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          refs={r["term_id"]:r for r in current}
          assert len(past)==410 and len(current)==len(refs)==414
          assert all(refs[r["term_id"]]==r for r in past)
          for key,n in (("noetherian-module",3),("submodule",1),("discrete-topology",1),("continuous-topological-map",2)):
            tid="term.wave2.foundation75."+key
            assert len([o for o in w.records("observations").values() if o["term_id"]==tid])==n
          assert len(jsonl(w.root/"state/wave2_formulation_reviews.jsonl"))==530
          report=json.loads((w.root/"state/wave2_foundations_source_batch75.json").read_text())
          assert report["continuous_topological_map_source_resolved"]
          assert report["old_410_term_reviews_unchanged"]
          assert not report["original_mathdef_production_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent source evidence and review ledgers
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit seven vetted source observations for four independent module/topology terms"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
