name: Screen independent integers, integer ring and fraction-field variants — Batch 59

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-integer-meanings-batch59.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load independent Wave 2 main branch
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source and mathematical regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually screen three meanings and four distinct sourced formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_integer_field_meanings_batch59 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile source review and screened meaning totals without changing source decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Assert all 512 historical formulation reviews and 676 links are preserved
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          want={"sources":14,"terms":402,"observations":826,"meanings":503,"relations":676}
          assert {s:len(w.records(s)) for s in want}==want
          assert not any(w.state(s).get("sealed") for s in want)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in frozen.records(s).items())
          before=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_512_before_integer59.jsonl")
          after=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(before)==512 and len(after)==516
          keyed={r["formulation_id"]:r for r in after}
          assert len(keyed)==516
          for old in before:
            curr=keyed[old["formulation_id"]]
            assert all(curr.get(k)==v for k,v in old.items() if k!="meaning_catalog_digest")
          meanings=w.records("meanings")
          assert len(meanings["meaning.wave2.integer59.fraction-field-integral-domain"]["formulations"])==2
          assert {r["source_id"] for r in (
            w.records("observations")[e] for form in
            meanings["meaning.wave2.integer59.fraction-field-integral-domain"]["formulations"]
            for e in form["evidence_ids"])}=={"src.stacks","src.proofwiki"}
          assert all(r["meaning_catalog_digest"]==digest(list(meanings.values())) for r in after)
          assert {rid for r in after for rid in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in after))=={"linked":507,"no_supported_target":5,"needs_review":4}
          check_cycles(meanings,w.records("relations"))
          report=json.loads((w.root/"state/wave2_integer_meanings_batch59.json").read_text())
          assert report["prior_512_individual_review_decisions_preserved"] and report["prior_676_links_preserved"]
          assert report["fraction_field_equivalent_contextual_variants"]==2
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          cov=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert cov["term_count"]==402 and cov["mathematical_candidate_meanings_screened"]==85
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only bounded independent Wave 2 records and historical review proof
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Individually screen integer and fraction-field variants preserving 512 earlier formulations"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
