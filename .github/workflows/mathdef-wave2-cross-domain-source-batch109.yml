name: Admit independently sourced algebra and accumulation variants — Batch 109
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-domain-source-batch109.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync most recent independent main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress reusable engine and mathDef adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four source headings and seven attributed observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_domain_source_batch109 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile source-specific term coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check stage freeze, source counts, unchanged screened review dispositions
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          one=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(one.publication())==json.loads((one.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":449,"observations":898,"meanings":552,"relations":774}
          assert {k:len(w.records(k)) for k in expected}==expected
          assert not any(w.state(k).get("sealed") for k in expected)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==v for i,v in one.records(k).items())
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==580 and dict(Counter(r["decision"] for r in reviews))=={"linked":574,"no_supported_target":6}
          assert {i for r in reviews for i in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross109_source_intake.json").read_text())
          assert report["new_screened_meanings"]==report["new_screened_links"]==0
          assert report["rank_finite_image_condition_retained"] and report["accumulation_point_sequence_and_set_distinct"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only new independent source observations and source review coverage
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit four independent algebra and topological source headings, seven observations"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
