name: Screen convex sets falling factorial delta and bipartite mathematical meanings — Batch 136
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-bridge-meanings-batch136.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  mathematical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generic engine and mathDef adapter regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen four contexts with seven mathematical source formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_bridge_meanings_batch136 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Independently reconcile source coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify frozen Wave1 and all 632 preceding individual mathematical decisions
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":481,"observations":953,"meanings":595,"relations":869}
          assert {k:len(w.records(k)) for k in expect}==expect
          assert not any(w.state(k).get("sealed") for k in expect)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          ms=w.records("meanings")
          assert len([i for i in ms if i.startswith("meaning.wave2.bridge136.")])==4
          assert len(ms["meaning.wave2.bridge136.convex-real"]["formulations"])==2
          assert len(ms["meaning.wave2.bridge136.numeric-delta"]["formulations"])==2
          assert len(ms["meaning.wave2.bridge136.simple-bipartite"]["formulations"])==2
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_632_before_bridge136.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in now}
          assert len(old)==632 and len(now)==len(ix)==639
          for p in old:
            v=ix[p["formulation_id"]]
            assert all(v.get(k)==a for k,a in p.items() if k!="meaning_catalog_digest")
          assert dict(Counter(r["decision"] for r in now))=={"linked":626,"no_supported_target":6,"needs_review":7}
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in now)
          assert {i for r in now for i in r["relation_ids"]}==set(w.records("relations"))
          for path in ("wave2/conv125_quarantined_source_claims.jsonl","wave2/quot118_quarantined_source_claims.jsonl","wave2/directional112_quarantined_source_claims.jsonl"):
            hold=jsonl(w.root/path)
            assert len(hold)==1 and hold[0]["observation_id"] not in {i for m in ms.values() for form in m["formulations"] for i in form["evidence_ids"]}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_bridge136_meaning_screen.json").read_text())
          assert report["all_632_unrelated_reviews_and_869_links_preserved"]
          assert report["nonnegative_falling_factorial_zero_case_corroborated"]
          assert not report["human_peer_verified"] and not report["production_corpus_used"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent mathematical screens and historical snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mathematically screen independent convex falling factorial numeric delta bipartite variant meanings"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
