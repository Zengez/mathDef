name: Intake vetted martingale and graph-coloring foundations — Batch 84

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-martingale-foundations-source-batch84.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use current independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run domain-independent research regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit five source-scoped foundational terms and six observations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_foundation_research_source_batch84 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile historic source research and all term review dispositions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify original Wave 1 freeze and all old source research
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          want={"sources":14,"terms":422,"observations":858,"meanings":517,"relations":706}
          assert {s:len(w.records(s)) for s in want}==want
          assert not any(w.state(s).get("sealed") for s in want)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in old.records(s).items())
          prev=jsonl(w.root/"state/wave2_term_coverage_snapshot_417.jsonl")
          latest=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          indexed={r["term_id"]:r for r in latest}
          assert len(prev)==417 and len(latest)==len(indexed)==422
          assert all(indexed[r["term_id"]]==r for r in prev)
          assert len(jsonl(w.root/"state/wave2_formulation_reviews.jsonl"))==541
          info=json.loads((w.root/"state/wave2_found84_source_intake.json").read_text())
          assert info["new_source_terms"]==5 and info["new_individual_source_observations"]==6
          assert info["new_meanings_screened"]==0 and info["new_links_screened"]==0
          assert info["continuous_time_filtration_source_not_claimed"]
          assert not info["production_corpus_used"]
          print(json.dumps(info,indent=2))
          PY
      - name: Commit only independently source-vetted records and preserved historical reviews
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Intake five source-vetted probability/combinatorics foundations preserving 417 term reviews"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
