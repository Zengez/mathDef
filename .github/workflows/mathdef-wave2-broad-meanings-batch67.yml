name: Screen equivalent σ-algebra and compactness variants without duplicate meanings — Batch 67

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-broad-meanings-batch67.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest independent research data
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test portable pipeline and domain adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Perform audited same-meaning σ-algebra variant revision and independently screen compact space
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_broad_variant_meanings_batch67 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile existing source review decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check 521 old meanings/formulations decisions, source attachments and frozen-wave lineage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":408,"observations":834,"meanings":509,"relations":691}
          assert {s:len(w.records(s)) for s in expected}==expected
          assert not any(w.state(s).get("sealed") for s in expected)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in first.records(s).items())
          ms=w.records("meanings")
          sig=ms["meaning.wave2.foundation.sigma-algebra"]
          assert len(sig["formulations"])==2 and len(sig["term_ids"])==2
          assert sig["formulations"][0]["id"]=="form.wave2.foundation.sigma-algebra"
          assert sig["formulations"][1]["id"]=="form.wave2.broad67.sigma-difference-disjoint-countable"
          compact=ms["meaning.wave2.broad67.compact-topological-space"]
          assert len(compact["formulations"])==2
          assert "no Hausdorff" in compact["context"]
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_521_before_broad67.jsonl")
          latest=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          byid={r["formulation_id"]:r for r in latest}
          assert len(old)==521 and len(latest)==len(byid)==524
          for r in old:
            newer=byid[r["formulation_id"]]
            assert all(newer.get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in latest)
          assert {rid for r in latest for rid in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in latest))=={"linked":516,"no_supported_target":5,"needs_review":3}
          check_cycles(ms,w.records("relations"))
          amendments=jsonl(w.root/"events/sigma_algebra_equivalent_variant_amendment_batch67.jsonl")
          assert len(amendments)==1
          oldmeaning=jsonl(w.root/"events/sigma_algebra_meaning_before_broad67.jsonl")
          assert len(oldmeaning)==1
          assert amendments[0]["previous_meaning_digest"]==digest(oldmeaning[0])
          state=json.loads((w.root/"state/wave2_broad_meanings_batch67.json").read_text())
          assert state["historical_521_formulation_reviews_preserved"]
          assert state["existing_sigma_algebra_meaning_amended_not_duplicated"]
          assert not state["production_corpus_used"] and not state["human_peer_verified"]
          print(json.dumps(state,indent=2))
          PY
      - name: Commit only independent mathematical reviews and audit history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine existing sigma-algebra meaning and screen two compactness variants with prior 521 reviews preserved"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
