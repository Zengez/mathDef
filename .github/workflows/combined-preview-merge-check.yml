name: Combined original mathDef + Wave2 + post-Wave2 smoke checks

on:
  pull_request:
    paths:
      - "research_pipeline/adapters/mathdef/original_merge.py"
      - "research_pipeline/adapters/mathdef/preview_site.py"
      - "research_pipeline/ui/renderer.py"
      - "research_pipeline/tests/test_original_merge.py"
      - "research_pipeline/tests/test_merged_linking.py"
      - "research_pipeline/tests/merged_ui_browser_smoke.cjs"
      - "research_pipeline/ui/app.js"
      - "research_pipeline/ui/template.html"
      - "research_pipeline/adapters/mathdef/merged_linking.py"
      - "research_pipeline/experiments/reconstruction-v2-independent/post_wave2/**"
      - ".github/workflows/combined-preview-merge-check.yml"
  push:
    branches: [main]
    paths:
      - "research_pipeline/adapters/mathdef/original_merge.py"
      - "research_pipeline/adapters/mathdef/preview_site.py"
      - "research_pipeline/ui/renderer.py"
      - "research_pipeline/tests/test_original_merge.py"
      - "research_pipeline/experiments/reconstruction-v2-independent/post_wave2/**"
      - "definitions/**"
      - "variants/**"
      - "research_pipeline/ui/app.js"
      - "research_pipeline/ui/template.html"
      - "research_pipeline/adapters/mathdef/merged_linking.py"
      - "research_pipeline/tests/merged_ui_browser_smoke.cjs"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test lossless merge and rapid scan
        run: python -m unittest research_pipeline.tests.test_original_merge research_pipeline.tests.test_merged_linking -v
      - name: Syntax-check reusable inline expansion UI
        run: node --check research_pipeline/ui/app.js
      - name: Build independent baselines and original-inclusive site
        run: |
          python -m research_pipeline.adapters.mathdef.preview_site --site-root /tmp/mathdef-merge-check
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/mathdef-merge-check")
          base=json.loads((root/"wave2/catalog.json").read_text())
          merged=json.loads((root/"merged/catalog.json").read_text())
          scan=json.loads((root/"merged/scan-report.json").read_text())
          base_n=sum(len(g["meanings"]) for g in base["groups"])
          merged_n=sum(len(g["meanings"]) for g in merged["groups"])
          original_n=scan["scan_scope"]["original_mathdef_definitions"]
          post_file=Path("research_pipeline/experiments/reconstruction-v2-independent/post_wave2/terms.json")
          post_n=len(json.loads(post_file.read_text())["entries"])
          assert base_n==958, f"Independent Wave2 count changed: {base_n}"
          assert scan["scan_scope"]["wave2_direct_meanings"]==363
          assert original_n>=1007
          assert merged_n==base_n+original_n+post_n
          assert sum(m["id"].startswith("meaning.mathdef.postwave.")
                     for g in merged["groups"] for m in g["meanings"])==post_n
          assert sum(m.get("source_origin")=="original_mathdef"
                     for g in merged["groups"] for m in g["meanings"])==original_n
          assert scan["counts"]["new_phrase_leads"]>=1
          assert scan["counts"]["known_term_mentions"]>=1
          assert (root/"merged/index.html").is_file()
          assert (root/"merged/definitions-index.json").is_file()
          link_report=json.loads((root/"merged/link-report.json").read_text())
          assert link_report["status"]=="tentative_lexical_links_not_semantically_verified"
          # Audit sample is drawn from ALREADY EXISTING concepts in the merged
          # dictionary; it is not an additional terminology candidate collection.
          print("MERGED_LINK_AMBIGUITY_TOP_JSON="+json.dumps([
              {"phrase":item["phrase"],"occurrences":item["occurrences"],
               "examples":link_report["ambiguous_context_examples"].get(item["phrase"],[])[:3]}
              for item in link_report["ambiguous_contexts"][:25]
          ],ensure_ascii=False,separators=(",",":")))
          assert link_report["forms_visited"] >= merged_n
          assert link_report["new_tentative_links"] > 50, link_report
          assert sum(r.get("review_state")=="lexical_candidate"
                     for r in merged["relations"]) == link_report["new_tentative_links"]
          assert all(r["from_formulation"] and r["target_meaning"]
                     for r in merged["relations"] if r.get("review_state")=="lexical_candidate")
          form_text={f["id"]: f["text"] for g in merged["groups"]
                     for m in g["meanings"] for f in m["formulations"]}
          for rel in merged["relations"]:
              if rel.get("review_state")!="lexical_candidate":
                  continue
              start,end=rel["span_start"],rel["span_end"]
              body=form_text[rel["from_formulation"]]
              assert 0<=start<end<=len(body), rel["id"]
              assert body[start:end]==rel["source_phrase"], rel["id"]
          assert (root/"wave1/index.html").is_file()
          # Confirm dispositions describe literal, ranked records from the
          # completed original scan (rather than a newly generated term list).
          ledger=json.loads((Path("research_pipeline/experiments/reconstruction-v2-independent/post_wave2")/
                             "scan_candidate_dispositions.json").read_text())
          decisions=ledger["dispositions"]
          assert [d["rank"] for d in decisions]==list(range(1,len(decisions)+1))
          meanings={m["id"] for g in merged["groups"] for m in g["meanings"]}
          for decision in decisions:
              scanned=scan["possible_new_terminology"][decision["rank"]-1]
              assert decision["phrase"]==scanned["phrase"]
              assert decision["occurrences"]==scanned["count"]
              assert decision["examples"]==scanned["examples"]
              for target in decision["targets"]:
                  if target.startswith("meaning."):
                      assert target in meanings, f"Unknown disposition target: {target}"
                  elif target.startswith("definitions/"):
                      assert Path(target).is_file(), f"Unknown source target: {target}"
                  else:
                      raise AssertionError(f"Malformed disposition target: {target}")
          # Frozen original candidate-research phase is complete.
          # Verify exact full coverage without re-running discovery or
          # exporting another candidate-research work queue.
          assert len(scan["possible_new_terminology"])==2019
          assert len(decisions)==len(scan["possible_new_terminology"]), (
              "Original frozen terminology candidates not all dispositioned")
          print(f"Frozen original quick-scan research COMPLETE: {len(decisions)} verified ranked candidate dispositions")
          print("Merged-preview smoke passed:", {
              "independent":base_n,
              "original":original_n,
              "post_wave2_researched":post_n,
              "combined":merged_n,
              "rough_phrase_leads":scan["counts"]["new_phrase_leads"]
          })
          PY

      - name: Browser-check recursive inline linking and independent searches
        run: |
          npm install --silent --no-save --no-audit --no-fund --prefix /tmp/mathdef-browser-test playwright-core@1.56.0
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/mathdef-merge-check > /tmp/mathdef-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          node research_pipeline/tests/merged_ui_browser_smoke.cjs
