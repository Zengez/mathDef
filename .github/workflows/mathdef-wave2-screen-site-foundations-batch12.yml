name: Screen two independent Stacks site foundation meanings
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-site-foundations-batch12.yml'
      - 'research_pipeline/engine/wave2_screen_site_foundations_batch12.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh latest independently sourced checkpoint
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Compile and regression test all research modules
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Review site and indexed family meanings and preserve earlier dispositions
        run: |
          python -m research_pipeline.engine.wave2_screen_site_foundations_batch12 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify frozen lineage, new meanings, old links, individual reviews and no seals
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          a=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(a.publication())==json.loads((a.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          assert len(w.records("meanings"))==455 and len(w.records("relations"))==600
          assert len(w.records("terms"))==356 and len(w.records("observations"))==779
          assert all(w.records("relations").get(k)==v for k,v in a.records("relations").items())
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_465_before_foundations12.jsonl")
          by={r["formulation_id"]:r for r in reviews}
          assert len(reviews)==467 and len(old)==465 and len(by)==467
          assert all({k:v for k,v in by[r["formulation_id"]].items() if k!="meaning_catalog_digest"}=={k:v for k,v in r.items() if k!="meaning_catalog_digest"} for r in old)
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(w.records("relations"))
          assert sum(r["decision"]=="needs_review" for r in reviews)==2
          assert all(not w.state(k).get("sealed") for k in ("sources","terms","observations","meanings","relations"))
          report=json.loads((w.root/"state/wave2_foundations_batch_12_screened.json").read_text())
          assert report["site_family_coverage_not_equated_to_sieve_topology"] is True
          assert report["human_peer_verified"] is False
          PY
      - name: Commit only independent Wave 2 mathematically screened meanings
        run: |
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review two sourced site foundations and preserve 465 historical decisions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
