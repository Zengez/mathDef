name: Ingest independent preadditive additive abelian category source evidence

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-category-axiom-sources-batch15.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh verified independent main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research code and run regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Ingest source observations, without automatic meaning or link approval
        run: |
          python -m research_pipeline.engine.wave2_foundations_batch15_category_axioms \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Preserve old 360-term audit and calculate exact 363-term coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Independently verify Stacks evidence, unsealed state and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(old.publication())==json.loads((old.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          for stage,size in (("sources",9),("terms",363),("observations",786),("meanings",459),("relations",606)):
              assert len(w.records(stage))==size
              assert not w.state(stage).get("sealed")
          for stage in ("sources","terms","observations","relations"):
              assert all(w.records(stage).get(k)==v for k,v in old.records(stage).items())
          old_cov=jsonl(w.root/"state/wave2_term_coverage_snapshot_360.jsonl")
          current=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          assert len(old_cov)==360 and len(current)==363
          index={x["term_id"]:x for x in current}
          assert len(index)==363
          assert all(index.get(r["term_id"])==r for r in old_cov)
          c=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert c["term_count"]==363 and c["new_term_review_coverage"]==45
          assert c["source_read_new_candidates"]==37
          assert c["new_source_locators_unverified"]==8
          assert c["mathematical_candidate_meanings_screened"]==40
          sources=jsonl(w.root/"wave2/foundation_source_discovery_batch_15.jsonl")
          assert len(sources)==3
          assert all(x["meaning_screened"] is False and x["human_verified"] is False for x in sources)
          r=json.loads((w.root/"state/wave2_foundations_batch_15.json").read_text())
          assert r["preadditive_does_not_imply_additive"]
          assert r["additive_does_not_imply_abelian"]
          assert r["coimage_image_isomorphism_not_omitted"]
          assert r["human_peer_verified"] is False
          print(json.dumps(r,indent=2))
          PY
      - name: Commit only independently researched source observations and audit history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve distinct preadditive additive abelian source axioms and individual 363-term evidence"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
