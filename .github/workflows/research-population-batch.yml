name: Independent research population or reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'research_pipeline/experiments/reconstruction-v2-independent/population/inbox/*.json'
  workflow_dispatch:
    inputs:
      mode:
        description: "Population, reconciliation audit, or read-only status"
        required: true
        type: choice
        options:
          - populate
          - reconcile
          - status
      batch_path:
        description: "For populate: committed JSON inside independent Wave2 population/inbox/"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reusable engine and adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef
          python -m unittest research_pipeline.tests.test_population research_pipeline.tests.test_population_promotion -v
      - name: Process independent package, recomputing on push collision
        env:
          MODE: ${{ github.event_name == 'push' && 'populate' || inputs.mode }}
          BATCH: ${{ inputs.batch_path }}
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKSPACE="research_pipeline/experiments/reconstruction-v2-independent"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            if [ "$MODE" = "populate" ]; then
              if [ -n "$BATCH" ]; then
                case "$BATCH" in
                  "$WORKSPACE"/population/inbox/*.json) ;;
                  *) echo "Batch path is outside the approved inbox" >&2; exit 1 ;;
                esac
                PACKAGES=("$BATCH")
              else
                # Push-triggered runs process all yet-unapplied committed packages.
                # Package IDs are immutable, so the operation is safe to replay.
                PACKAGES=("$WORKSPACE"/population/inbox/*.json)
              fi
              for PACKAGE in "${PACKAGES[@]}"; do
                [ -f "$PACKAGE" ] || continue
                python -m research_pipeline.engine.population \
                  --workspace "$WORKSPACE" --mode populate --batch "$PACKAGE" \
                  --policy research_pipeline.adapters.mathdef.population_policy
              done
            elif [ "$MODE" = "reconcile" ]; then
              python -m research_pipeline.engine.population \
                --workspace "$WORKSPACE" --mode reconcile
            else
              python -m research_pipeline.engine.population \
                --workspace "$WORKSPACE" --mode status
            fi
            if [ "$MODE" != "status" ]; then
              # New independent provisional meanings automatically enter the
              # durable graph inventory. This never certifies or rescans old
              # formulations and does not touch the frozen Wave1.
              python -m research_pipeline.engine.dependency_graph \
                --workspace "$WORKSPACE" --mode inventory
              python -m research_pipeline.engine.population_queue \
                --workspace "$WORKSPACE" \
                --profile research_pipeline/adapters/mathdef/population_topics.json --write
            fi
            git add -- "$WORKSPACE/population" "$WORKSPACE/dependency_graph"
            if git diff --cached --name-only | grep -Ev "^$WORKSPACE/(population|dependency_graph)/"; then
              echo "Attempted change outside the isolated independent ledgers" >&2
              exit 1
            fi
            if git diff --cached --quiet; then echo "No changed research files"; exit 0; fi
            git commit -m "Apply independent population package or reconciliation report"
            if git push origin HEAD:main; then exit 0; fi
            echo "New main revision; recompute from latest committed inputs"
          done
          exit 1
