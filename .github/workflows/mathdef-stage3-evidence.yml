name: Ingest corrected Stage 3 mathematical evidence

on:
  push:
    paths:
      - 'research_pipeline/experiments/reconstruction-v1-recovery/state/stage3_paraphrase_batch*.jsonl'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-recovered-stage3-evidence
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent research regression suite
        run: python -m unittest discover -s research_pipeline/tests -v

      - name: Ingest reviewed substantive candidate paraphrases
        run: |
          set -euo pipefail
          shopt -s nullglob
          WORKSPACE=research_pipeline/experiments/reconstruction-v1-recovery
          evidence_files=("$WORKSPACE"/state/stage3_paraphrase_batch*.jsonl)
          for evidence in "${evidence_files[@]}"; do
            python -m research_pipeline.engine.cli \
              --workspace "$WORKSPACE" ingest observations \
              --input "$evidence" --batch-size 10
          done
          echo "Ingested ${#evidence_files[@]} corrected evidence batch file(s)."
          python -m research_pipeline.engine.cli --workspace "$WORKSPACE" status

      - name: Commit only unsealed, corrected Stage 3 observations
        run: |
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/records/observations.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/state/observations.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint reviewed mathematical evidence in corrected Stage 3"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
