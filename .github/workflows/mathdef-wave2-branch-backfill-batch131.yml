name: Backfill independently reviewed pointwise and eigenvalue prerequisites — Batch 131
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-branch-backfill-batch131.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  retroactive-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent Wave2 research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generic research engine and mathematics adapter
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Append three individually reviewed previously missing direct prerequisites
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_branch_backfill_batch131 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify 852 previous links and all 624 previous review rationales
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":473,"observations":938,"meanings":587,"relations":855}
          assert {k:len(w.records(k)) for k in expected}==expected
          assert not any(w.state(k).get("sealed") for k in expected)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_624_before_branch131.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in now}
          assert len(old)==len(now)==len(ix)==624
          changed=0
          for p in old:
            n=ix[p["formulation_id"]]
            if n==p:continue
            changed+=1
            assert p["formulation_id"] in (
              "form.wave2.conv126.pointwise-topological",
              "form.wave2.conv126.eigenvector-linear-operator.1",
              "form.wave2.conv126.eigenvector-linear-operator.2"
            )
            assert n["relation_ids"][:len(p["relation_ids"])]==p["relation_ids"]
            assert all(n.get(k)==v for k,v in p.items() if k!="relation_ids")
          assert changed==3
          assert len([id for id in w.records("relations") if id.startswith("rel.wave2.branch131.")])==3
          assert dict(Counter(r["decision"] for r in now))=={"linked":618,"no_supported_target":6}
          assert {id for r in now for id in r["relation_ids"]}==set(w.records("relations"))
          for path in ("wave2/conv125_quarantined_source_claims.jsonl","wave2/quot118_quarantined_source_claims.jsonl","wave2/directional112_quarantined_source_claims.jsonl"):
            held=jsonl(w.root/path)
            assert len(held)==1 and held[0]["observation_id"] not in {i for m in w.records("meanings").values() for f in m["formulations"] for i in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          result=json.loads((w.root/"state/wave2_branch131_retroactive_links.json").read_text())
          assert result["all_852_prior_links_preserved"] and result["all_624_existing_formulation_decisions_and_rationales_preserved"]
          assert result["pointwise_product_topology_gap_closed"] and result["eigenvector_eigenvalue_gap_closed_noncircular"]
          assert not result["human_peer_verified"] and not result["production_corpus_used"]
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only independent backfilled relations and their reviewed provenance
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backfill independently verified product topology and operator eigenvalue historical prerequisites"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
