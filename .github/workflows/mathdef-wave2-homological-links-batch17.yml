name: Screen fifteen independent homological and category prerequisites

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-homological-links-batch17.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start from latest independently reviewed mathematics
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all independent regression and compilation gates
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Apply fifteen source-specific homological prerequisite links
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_17.jsonl
      - name: Verify all screened links, historical reviews, and category contexts
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          one=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((one.root/"state/wave1_freeze.json").read_text())
          assert digest(one.publication())==frozen["published_catalog_digest"]
          assert len(one.records("relations"))==445
          assert len(w.records("terms"))==363 and len(w.records("observations"))==786
          assert len(w.records("meanings"))==462 and len(w.records("relations"))==621
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==474 and len({r["formulation_id"] for r in reviews})==474
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==reviews[0]["meaning_catalog_digest"] for r in reviews)
          assert not any(r["decision"]=="needs_review" for r in reviews)
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_471_before_category16.jsonl")
          now={r["formulation_id"]:r for r in reviews}
          assert len(old)==471
          assert all(now[r["formulation_id"]]["original_wave1_disposition"]==
                     r["original_wave1_disposition"] for r in old)
          latest=jsonl(w.root/"intake/wave2_curated_relations_batch_17.jsonl")
          assert len(latest)==15 and len(set(x["id"] for x in latest))==15
          assert all(w.records("relations")[r["id"]]==r for r in latest)
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_link_review_batch_17.json").read_text())
          assert report["total_screened_links"]==621
          assert report["added_source_grounded_links"]==15
          assert report["dependency_graph_has_cycles"] is False
          assert report["pending_wave2_link_reviews"]==0
          assert report["original_wave1_dispositions_preserved_in_review_fields"]
          assert report["human_peer_verified"] is False
          assert report["wave2_link_stage_sealed"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent Wave 2 mathematical link and historical review evidence
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen fifteen kernel cokernel exactness and category hierarchy links preserving 471 older decisions"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
