name: Verify corrected Stage 5 integrity and tests

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage5-healthcheck.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage5-reconstruction-writes
  cancel-in-progress: false

jobs:
  stage5-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out latest committed reconstruction state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all independent reconstruction tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Validate JavaScript prototype syntax
        run: node --check research_pipeline/adapters/mathdef/preview.js
      - name: Audit every existing mathematical relationship against sealed source and review records
        run: |
          python -m research_pipeline.engine.stage5_review_gate \
            --workspace research_pipeline/experiments/reconstruction-v1-recovery \
            --audit > /tmp/stage5-audit.json
      - name: Enforce coverage and record independently checked health snapshot
        run: |
          python - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          root=Path("research_pipeline/experiments/reconstruction-v1-recovery")
          result=json.loads(Path("/tmp/stage5-audit.json").read_text())
          source=json.loads((root/"state/observations.json").read_text())
          meaning=json.loads((root/"state/meanings.json").read_text())
          links=json.loads((root/"state/relations.json").read_text())
          assert source["sealed"] and meaning["sealed"]
          assert source["total"]==749 and meaning["total"]==419
          assert result["formulations"]==431 and result["meanings"]==419
          assert result["reviewed"]+result["needs_review"]==431
          assert result["screened_relations"]==links["total"]
          assert not links["sealed"], "Stage 5 has not completed coverage; it must remain open"
          assert result["needs_review"]>0, "If complete, use explicit Stage 5 seal workflow"
          report={"status":"passed","source_stage_sealed":True,"meaning_stage_sealed":True,
                  "link_stage_sealed":False,"audited_stage5":result,
                  "origin_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                  "workflow_run_id":os.environ.get("GITHUB_RUN_ID", ""),
                  "test_suite":"all research_pipeline/tests and prototype JavaScript syntax",
                  "caveat":"Integrity and provenance validation; independent mathematical peer review not asserted."}
          output=root/"state/stage5_healthcheck.json"
          output.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY
      - name: Persist checked health snapshot
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v1-recovery/state/stage5_healthcheck.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify Stage 5 full registry and regression suite integrity"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Failed to persist healthcheck snapshot" >&2
            exit 1
          fi
