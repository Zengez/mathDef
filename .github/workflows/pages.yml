name: Publish mathDef
on:
  push:
    branches: [main]
    # Deploy only when published definitions or independent preview inputs
    # change. Internal dependency graph indexes and audit reports are not
    # published site content and should not initiate a Pages deployment.
    paths:
      - 'definitions/**'
      - 'variants/**'
      - 'data/**'
      - 'web/**'
      - 'scripts/**'
      - 'research_pipeline/adapters/mathdef/*.py'
      - 'research_pipeline/adapters/mathdef/preview.js'
      - 'research_pipeline/adapters/mathdef/ui_branding.json'
      - 'research_pipeline/adapters/mathdef/resume.json'
      - 'research_pipeline/ui/**'
      - 'research_pipeline/tests/release_browser_smoke.cjs'
      - 'research_pipeline/engine/core.py'
      - 'research_pipeline/engine/population.py'
      - 'research_pipeline/engine/resume_checkpoint.py'
      - 'research_pipeline/experiments/**'
      - '!research_pipeline/experiments/**/dependency_graph/**'
      - '!research_pipeline/experiments/**/*.md'
      - '!research_pipeline/experiments/**/population/QUEUE.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://zengez.github.io/mathDef/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frontend JavaScript syntax
        run: node --check web/app.js
      - name: Check feedback JavaScript syntax
        run: node --check web/feedback.js
      - name: Test feedback issue drafts
        run: node --test tests/test_feedback.cjs tests/test_feedback_ui.cjs
      - name: Test arXiv candidate scanner
        run: python -m unittest discover -s tests
      - name: Validate cleaned-release code and historical redirects
        run: |
          python -m unittest tests.test_merged_definition_export -v
          python -m unittest research_pipeline.tests.test_merged_cleanup research_pipeline.tests.test_conventions research_pipeline.tests.test_cleaned_global_links research_pipeline.tests.test_full_corpus_link_audit research_pipeline.tests.test_reference_ui -v
          node --test research_pipeline/tests/test_sources_ui.cjs research_pipeline/tests/test_subject_priority.cjs
      - name: Generate definition index
        run: python scripts/build_index.py
      - name: Render separate independent reconstruction previews
        run: |
          python -m research_pipeline.adapters.mathdef.preview_site \
            --site-root _site/reconstruction
          node --check _site/reconstruction/wave1/preview.js
          node --check _site/reconstruction/wave2/preview.js
          test -f _site/reconstruction/wave1/index.html
          test -f _site/reconstruction/wave2/index.html
      - name: Publish combined mathDef collection at main site root
        run: |
          python -m research_pipeline.adapters.mathdef.publish_root --site-root _site
          node --check _site/app.js
          node --check _site/feedback.js
          node --check _site/subject_priority.js
          node --check _site/sources_ui.js
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("_site")
          index=json.loads((root/"definitions-index.json").read_text())
          original=json.loads((root/"api/definitions/v1/snapshot.json").read_text())
          merged=json.loads((root/"catalog.json").read_text())
          original_ids={e["id"] for e in original["definitions"]}
          preserved={oid for g in merged["groups"] for m in g["meanings"]
                     for oid in ([m.get("original_definition_id")] +
                                  m.get("legacy_original_definition_ids", [])) if oid}
          assert original_ids == preserved, "Main site dropped a historical original ID"
          assert len(original_ids)==1014
          assert len(index)==len(merged["groups"])==1986, "Main site index incomplete"
          assert sum(len(g["meanings"]) for g in merged["groups"])==2065
          assert sum(len(m["formulations"]) for g in merged["groups"]
                     for m in g["meanings"])==2104
          assert len(merged["relations"])==6445
          v1_manifest=json.loads((root/"api/definitions/v1/manifest.json").read_text())
          v2_manifest=json.loads((root/"api/definitions/v2/manifest.json").read_text())
          v2=json.loads((root/"api/definitions/v2/snapshot.json").read_text())
          assert v1_manifest["definition_count"] == len(original_ids)
          assert v2_manifest["dataset"] == "merged"
          assert v2_manifest["definition_count"] == len(index)
          assert v2_manifest["meaning_count"] == sum(len(g["meanings"]) for g in merged["groups"])
          assert v2_manifest["original_definition_count"] == len(original_ids)
          assert v2["schema"] == "mathdef.definition-snapshot.v2"
          assert {x["id"] for x in v2["definitions"]} == {x["id"] for x in index}
          assert {original_id for d in v2["definitions"] for original_id in d["original_ids"]} == original_ids
          assert v2["consolidated_ids"]==merged["consolidated_ids"]
          assert v2_manifest["formulation_count"]==2104
          assert v2_manifest["original_definition_count"]==1014
          assert (root/"catalog.json").is_file()
          assert (root/"link-report.json").is_file()
          assert (root/"sources-index.json").is_file()
          assert (root/"audits/global-link-rebuild.json").is_file()
          assert (root/"reconstruction/merged/index.html").is_file()
          assert (root/"index.html").is_file()
          assert "Expanded mathematical definitions" in (root/"index.html").read_text()
          print("Main mathDef site published:",len(index),"term groups including",len(original["definitions"]),"original definitions")
          PY
      - name: Audit every published mathematical link across all cohorts
        run: |
          python -m research_pipeline.adapters.mathdef.audit_merged_links \
            --catalog _site/catalog.json \
            --index _site/definitions-index.json \
            --report _site/audits/full-link-graph.json
          test -s _site/audits/full-link-graph.json
      - name: Install browser smoke dependency
        run: npm install --prefix /tmp/mathdef-browser-test --no-audit --no-fund playwright-core@1.56.1
      - name: Test actual cleaned primary site in headless browser
        run: |
          python -m http.server 8765 --directory _site >/tmp/mathdef-pages-http.log 2>&1 &
          MATHDEF_PREVIEW_ROOT=_site MATHDEF_PREVIEW_URL=http://127.0.0.1:8765/ node research_pipeline/tests/release_browser_smoke.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
