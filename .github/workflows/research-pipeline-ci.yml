name: Research pipeline isolated tests
on:
  push:
    paths:
      - 'research_pipeline/**'
      # Audit prose/checkpoints cannot change executable behaviour.
      # Exclude documentation-only pushes without skipping source/graph tests.
      - '!research_pipeline/**/*.md'
      - '.github/workflows/research-pipeline-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all pipeline Python modules before isolated tests
        run: python -m compileall -q research_pipeline/engine research_pipeline/tests
      - name: Test portable engine and isolated mathDef preview
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Run read-only global Wave2 dependency audit on live independent graph
        run: |
          W=research_pipeline/experiments/reconstruction-v2-independent
          python -m research_pipeline.engine.dependency_global_audit \
            --workspace "$W" scan --limit 80 --candidate-limit 50 \
            > /tmp/wave2-global-dependency-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("/tmp/wave2-global-dependency-audit.json").read_text())
          s = audit["summary"]
          assert audit["read_only"] and not audit["mathematics_certified"]
          assert s["formulation_count"] >= s["complete_effective_formulations"]
          assert s["meaning_count"] >= 1
          assert s["cycle_components"] == 0, "Global meaning dependency cycle regressed"
          assert not any(f["severity"] == "integrity" for f in audit["flags"]), (
              "Global audit surfaced broken node or reference identity"
          )
          print("Global independent graph:", s["meaning_count"], "meanings;",
                s["complete_effective_formulations"], "/", s["formulation_count"],
                "complete formulations;", s["existing_dependency_edges"],
                "reviewed dependency edges;", s["total_flags"], "review leads.")
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as fh:
              fh.write("### Read-only Wave2 global dependency review\n\n")
              fh.write(f"Meanings: {s['meaning_count']}; formulations: "
                       f"{s['complete_effective_formulations']}/{s['formulation_count']}; "
                       f"cycles: {s['cycle_components']}; review leads: "
                       f"{s['total_flags']}.\n\n")
              fh.write("Heuristic flags are **not** certified mathematical errors; "
                       "passing checks does not certify definitions.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-global-dependency-review
          path: /tmp/wave2-global-dependency-audit.json
          retention-days: 14
      - name: Validate live independent research checkpoint against protected lineage
        run: |
          python -m research_pipeline.engine.resume_checkpoint \
            --config research_pipeline/adapters/mathdef/resume.json --check > /tmp/live-resume-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/live-resume-check.json").read_text())
          assert report["domain_validation"]["frozen_wave1_digest_recomputed_and_matched"]
          assert report["domain_validation"]["editable_wave2_unsealed"]
          assert report["domain_validation"]["original_priority_firstpass_records"] == 192
          assert report["supporting_input_evidence"]["wave2_research_support"]["files"] > 0
          PY
      - name: Build the two independent reconstruction browser previews
        run: |
          python -m research_pipeline.adapters.mathdef.preview_site \
            --site-root /tmp/mathdef-independent-preview
          node --check /tmp/mathdef-independent-preview/wave2/preview.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/mathdef-independent-preview")
          assert (root / "wave1/index.html").is_file()
          assert (root / "wave2/index.html").is_file()
          a = json.loads((root / "wave1/catalog.json").read_text())
          b = json.loads((root / "wave2/catalog.json").read_text())
          assert sum(len(g["meanings"]) for g in a["groups"]) == 419
          assert sum(len(g["meanings"]) for g in b["groups"]) >= 490
          assert len(b["relations"]) >= 664
          assert "evolving research draft" in (root / "wave2/index.html").read_text()
          assert "frozen baseline" in (root / "wave1/index.html").read_text()
          PY
      - name: Check command-line invocation
        run: python -m research_pipeline.engine.cli --help
      - name: Check reconstruction viewer JavaScript syntax
        run: |
          node --check research_pipeline/adapters/mathdef/preview.js
          node --check research_pipeline/ui/app.js
          node --check research_pipeline/ui/feedback.js
          node --test research_pipeline/tests/test_reference_ui_feedback.cjs
