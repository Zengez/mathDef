name: Browser smoke tests for isolated Wave 1 prototype

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage6-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage6-browser-qa
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest committed isolated prototype
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright testing dependency and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise independent mathematical definition searches and recursive display in Chromium
        env:
          STAGE6_SCREENSHOT: /tmp/mathdef-stage6-browser-smoke.png
        run: node research_pipeline/tests/test_stage6_browser.cjs
      - name: Record successful automated browser smoke evidence
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from research_pipeline.engine.core import atomic_json
          root=Path("research_pipeline/experiments/reconstruction-v1-recovery")
          assert (root/"state/stage6_review.json").exists()
          review=json.loads((root/"state/stage6_review.json").read_text())
          assert review["published_meanings"]==419
          report={
            "status":"passed",
            "browser":"Chromium (GitHub-hosted Playwright)",
            "tests":"Term-name vs definition search, heading separation, source modal, recursive dependency expansion/collapse, nonrecursive implication labels, verification dialog and JavaScript exceptions",
            "test_script":"research_pipeline/tests/test_stage6_browser.cjs",
            "screenshot_uploaded_to_workflow_artifact":True,
            "workflow_run_id":os.environ.get("GITHUB_RUN_ID",""),
            "origin_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "human_verified":False,
            "manual_browser_visual_inspection":False,
            "ready_for_second_wave":False,
            "note":"Automated browser smoke test passed; editorial/manual visual review remains a separate check before Wave 2."
          }
          atomic_json(root/"state/stage6_browser_smoke.json",report)
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-mathdef-stage6-browser-screenshot
          path: /tmp/mathdef-stage6-browser-smoke.png
          if-no-files-found: ignore
      - name: Commit successful browser QA metadata
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v1-recovery/state/stage6_browser_smoke.json
          if ! git diff --cached --quiet; then
            git commit -m "Confirm corrected Wave 1 prototype browser interaction smoke tests"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Could not persist Stage 6 browser QA result" >&2
            exit 1
          fi
