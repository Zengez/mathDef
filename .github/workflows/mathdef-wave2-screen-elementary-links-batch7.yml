name: Review 11 elementary math dependencies after separate source meaning screens

on:
  workflow_run:
    workflows:
      - Screen six independent elementary foundation formulations after source verification
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  links:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use authoritative latest independent Wave 2 research state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pipeline scripts and run regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Screen eleven individually justified elementary links with exact source anchors
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_07.jsonl
      - name: Check preserved frozen Wave 1 and contextual relation review ledger
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          second=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((first.root/"state/wave1_freeze.json").read_text())
          assert digest(first.publication())==freeze["published_catalog_digest"]
          assert len(second.records("meanings"))==441
          assert len(second.records("relations"))==574
          assert len(second.records("terms"))==347 and len(second.records("observations"))==770
          assert len(first.records("relations"))==445
          assert set(first.records("relations")).issubset(second.records("relations"))
          assert not any(second.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          newly=jsonl(second.root/"intake/wave2_curated_relations_batch_07.jsonl")
          assert len(newly)==11
          assert len(set(r["id"] for r in newly))==11
          assert all(second.records("relations")[x["id"]]==x for x in newly)
          reviews=jsonl(second.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==453
          assert len(set(x["formulation_id"] for x in reviews))==453
          assert {id for x in reviews for id in x["relation_ids"]}==set(second.records("relations"))
          assert sum(r["decision"]=="needs_review" for r in reviews)==1
          forms={f["id"]:m["id"] for m in second.records("meanings").values() for f in m["formulations"]}
          assert len(forms)==453
          assert all(x["meaning_id"]==forms[x["formulation_id"]] for x in reviews)
          previous=jsonl(second.root/"state/wave2_formulation_reviews_snapshot_447_before_foundations07.jsonl")
          assert len(previous)==447
          index={x["formulation_id"]:x for x in reviews}
          assert all(index[x["formulation_id"]]["original_wave1_disposition"]==x["original_wave1_disposition"] for x in previous)
          check_cycles(second.records("meanings"),second.records("relations"))
          report=json.loads((second.root/"state/wave2_link_review_batch_07.json").read_text())
          assert report["total_screened_links"]==574
          assert report["added_source_grounded_links"]==11
          assert report["dependency_graph_has_cycles"] is False
          assert report["human_peer_verified"] is False
          assert report["wave2_link_stage_sealed"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit independent screened relations and individual justification history only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen eleven precise elementary group monoid operation and relation prerequisites"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
