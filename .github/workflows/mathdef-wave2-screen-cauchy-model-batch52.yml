name: Screen independent rational-Cauchy quotient and positive real classes

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-cauchy-model-batch52.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch authoritative independent main state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete isolated research tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Register two individually reviewed noncircular Cauchy model meanings
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cauchy_models_batch52 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile original individual source coverage decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check immutable frozen wave and all 506 previous review decisions
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":395,"observations":818,"meanings":496,"relations":664}
          assert {s:len(w.records(s)) for s in expect}==expect
          assert not any(w.state(s).get("sealed") for s in expect)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in first.records(s).items())
          ms=w.records("meanings")
          prior=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_506_before_real52.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(prior)==506 and len(current)==508
          idx={r["formulation_id"]:r for r in current}
          assert len(idx)==508
          for r in prior:
            assert all(idx[r["formulation_id"]].get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in current)
          assert {id for r in current for id in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(ms,w.records("relations"))
          for id in ("meaning.wave2.real52.cauchy-quotient-reals","meaning.wave2.real52.positive-cauchy-class"):
            assert ms[id]["formulations"][0]["review_state"]=="screened"
          summary=json.loads((w.root/"state/wave2_cauchy_model_meaning_screen_batch52.json").read_text())
          assert summary["positive_class_requires_uniform_positive_margin"]
          assert summary["class_arithmetic_requires_well_definedness_proof"]
          assert summary["old_506_review_decisions_preserved"]
          assert summary["old_664_dependency_links_preserved"]
          assert not summary["production_corpus_used"] and not summary["human_peer_verified"]
          coverage=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==395
          assert coverage["mathematical_candidate_meanings_screened"]==77
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit only new independent source reviews and preserved review histories
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen Cauchy quotient and positive-cone models with 506 old review decisions preserved"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
