name: Screen independent right and unitary module contexts — Batch 94

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-module-meanings-batch94.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load latest independent math research
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run portable and domain-specific regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen three distinct module mathematical conventions
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_module_variants_meanings_batch94 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile source term review histories without rewriting old decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify 551 archived reviews and original-left preservation
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expected={"sources":14,"terms":428,"observations":865,"meanings":530,"relations":730}
          assert {k:len(w.records(k)) for k in expected}==expected
          assert not any(w.state(k).get("sealed") for k in expected)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(id)==row for id,row in first.records(k).items())
          ms=w.records("meanings")
          old=ms["meaning.wave2.foundation.left-module-nonunital"]
          assert old["formulations"][0]["id"]=="form.wave2.foundation.left-module-nonunital"
          assert "nonunital" in old["id"]
          extra=[m for m in ms.values() if m["id"].startswith("meaning.wave2.module94.")]
          assert len(extra)==3 and len({m["context"] for m in extra})==3
          assert all(m["term_group_id"]=="wave2.module94.module-over-ring" for m in extra)
          assert all(len(m["formulations"])==1 for m in extra)
          past=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_551_before_module94.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          index={r["formulation_id"]:r for r in current}
          assert len(past)==551 and len(current)==len(index)==554
          for prev in past:
            newer=index[prev["formulation_id"]]
            assert all(newer.get(k)==v for k,v in prev.items() if k!="meaning_catalog_digest")
          assert all(r["meaning_catalog_digest"]==digest(list(ms.values())) for r in current)
          assert {id for r in current for id in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in current))=={"linked":544,"no_supported_target":7,"needs_review":3}
          check_cycles(ms,w.records("relations"))
          report=json.loads((w.root/"state/wave2_module94_meanings.json").read_text())
          assert report["existing_general_left_module_untouched"] and report["all_551_historic_dispositions_preserved"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independently source-screened records and historical review snapshots
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen three right/unital module variants and preserve 551 previous reviews"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
