name: Screen two Stacks embedded integrality and fibre local ring meanings

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-embedded34.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh authoritative independent research source state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source-screening scripts and execute isolated regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Screen exact Stacks 10.38.1 and 10.112.5 mathematical objects with 489-review snapshot
        run: |
          python -m research_pipeline.engine.wave2_screen_embedded34 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh source-review report after new screened meaning records
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify source precision historical decisions and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==frozen["published_catalog_digest"]
          for k,n in (("sources",9),("terms",376),("observations",799),("meanings",479),("relations",643)):
              assert len(w.records(k))==n,k
              assert not w.state(k).get("sealed"),k
          m=w.records("meanings")
          for slug in ("integral-over-ideal","local-ring-fibre-at-prime"):
              f=m["meaning.wave2.foundation."+slug]["formulations"][0]
              assert f["review_state"]=="screened"
              assert f["human_verified"] is False
          assert "a_j∈I^{d−j}" in m["meaning.wave2.foundation.integral-over-ideal"]["formulations"][0]["text"]
          assert "S_q/pS_q" in m["meaning.wave2.foundation.local-ring-fibre-at-prime"]["formulations"][0]["text"]
          prev=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_489_before_embedded34.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(prev)==489 and len(now)==491
          index={r["formulation_id"]:r for r in now}
          assert len(index)==491
          for x in prev:
              y=index[x["formulation_id"]]
              assert {k:v for k,v in x.items() if k!="meaning_catalog_digest"}=={
                     k:v for k,v in y.items() if k!="meaning_catalog_digest"}
          assert sum(r["decision"]=="needs_review" for r in now)==2
          assert {id for r in now for id in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(m,w.records("relations"))
          assert all(w.records(s).get(k)==v for s in ("sources","terms","observations","relations") for k,v in old.records(s).items())
          proof=json.loads((w.root/"state/wave2_embedded34_meaning_screen.json").read_text())
          assert proof["screened_meanings"]==479
          assert proof["previous_489_reviews_preserved"] is True
          assert proof["ideal_coefficient_power_hypotheses_explicit"] is True
          assert proof["fibre_prime_contraction_and_local_ring_explicit"] is True
          assert proof["screened_links_unchanged"]==643
          assert proof["human_peer_verified"] is False
          coverage=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==376
          assert coverage["mathematical_candidate_meanings_screened"]==60
          print(json.dumps(proof,indent=2))
          PY
      - name: Commit only independent mathematically screened definitions and historical review migration
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen two embedded Stacks mathematical definitions and preserve 489 historical formulations"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
