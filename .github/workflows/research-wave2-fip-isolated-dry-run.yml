name: Wave2 FIP version migration dry-run (no writes)

on:
  push:
    branches: ['codex/wave2-fip-nonempty-family']
    paths:
      - '.github/workflows/research-wave2-fip-isolated-dry-run.yml'
      - 'research_pipeline/WAVE2_FIP_NONEMPTY_FAMILY_OFFLINE_RESCAN_PROPOSAL.json'
      - 'research_pipeline/experiments/reconstruction-v2-independent/records/meanings.jsonl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.ref == 'refs/heads/codex/wave2-fip-nonempty-family'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent graph unit regressions
        run: python -m unittest research_pipeline.tests.test_dependency_graph -q
      - name: Simulate one-formulation inventory and review migration in disposable copy
        run: |
          python - <<'PY'
          import json
          import shutil
          import tempfile
          from pathlib import Path
          from research_pipeline.engine.dependency_graph import inventory_sync, store

          source = Path("research_pipeline/experiments/reconstruction-v2-independent")
          proposal = json.loads(Path("research_pipeline/WAVE2_FIP_NONEMPTY_FAMILY_OFFLINE_RESCAN_PROPOSAL.json").read_text())
          fid = "form.wave2.broad67.compact-closed-fip"
          assert proposal.get("proposal_only") is True, "Only the offline, not live, review packet may be tested"
          assert proposal["mode"] == "ingest" and len(proposal["items"]) == 1
          item = proposal["items"][0]
          assert item["formulation_id"] == fid and item["complete"] is True
          assert len(item["references"]) == 5
          assert [r["state"] for r in item["references"]] == ["external", "missing", "missing", "external", "external"]
          with tempfile.TemporaryDirectory(prefix="wave2-fip-dryrun-") as tmp:
              sandbox = Path(tmp) / "independent"
              shutil.copytree(source, sandbox)
              graph = sandbox / "dependency_graph"
              inv_before = json.loads((graph / "INVENTORY.json").read_text())
              state_before = json.loads((graph / "STATE.json").read_text())["summary"]
              node_path = graph / "nodes" / (fid + ".json")
              historical_base_node = node_path.read_bytes()
              historical_amendments = (graph / "amendments.jsonl").read_bytes()
              historical_aliases = (graph / "candidate_aliases.jsonl").read_bytes()
              historical_resolutions = (graph / "resolutions.jsonl").read_bytes()
              historical_seed_overrides = (graph / "seed_overrides.jsonl").read_bytes()
              old_version = inv_before["formulations"][fid]["version_sha256"]
              assert old_version != item["version_sha256"], "Source change was not observed"
              # Never let replacement of the live node silently erase its previous version.
              history_path = graph / "history" / (fid + "." + old_version + ".json")
              history_path.parent.mkdir(parents=True, exist_ok=True)
              history_path.write_bytes(historical_base_node)

              inv_result = inventory_sync(sandbox)
              inv_after = json.loads((graph / "INVENTORY.json").read_text())
              state_mid = json.loads((graph / "STATE.json").read_text())["summary"]
              assert inv_result["changed_or_added_formulations"] == 1
              assert inv_result["removed_formulations"] == 0
              assert inv_after["formulations"][fid]["version_sha256"] == item["version_sha256"]
              assert inv_after["source_inventory_sha256"] != inv_before["source_inventory_sha256"]
              assert state_mid["scan_complete"] == state_before["scan_complete"] - 1
              assert not (graph / "CONSOLIDATION.json").exists()
              text = inv_after["formulations"][fid]["text"]
              assert "every nonempty family of closed subsets" in text
              assert "not necessarily Hausdorff" not in text.lower() # no added ambient restriction

              # Engine API only in temporary clone; NO inbox or Git branch writes.
              store(sandbox, [item])
              state_after = json.loads((graph / "STATE.json").read_text())["summary"]
              assert state_after["scan_complete"] == state_before["scan_complete"]
              assert state_after["total_formulations"] == state_before["total_formulations"]
              for key in ("unassigned_occurrences", "ambiguous_occurrences", "deferred_occurrences",
                          "missing_occurrences", "scan_amendment_event_count"):
                  assert state_after[key] == state_before[key], (key, state_before.get(key), state_after.get(key))
              assert state_after["consolidation_gate_valid"] is False
              assert history_path.read_bytes() == historical_base_node
              for name, original in (
                  ("amendments.jsonl", historical_amendments),
                  ("candidate_aliases.jsonl", historical_aliases),
                  ("resolutions.jsonl", historical_resolutions),
                  ("seed_overrides.jsonl", historical_seed_overrides),
              ):
                  assert (graph / name).read_bytes() == original, name
              new_node = json.loads(node_path.read_text())
              assert new_node["version_sha256"] == item["version_sha256"]
              assert len(new_node["references"]) == 5
              assert [r["state"] for r in new_node["references"]] == ["external", "missing", "missing", "external", "external"]
              old_node = json.loads(historical_base_node)
              assert old_node["version_sha256"] == old_version
              assert new_node["references"][1]["missing_candidate_id"] == "missing.622459998fd4b876125d"
              assert new_node["references"][2]["missing_candidate_id"] == "missing.ded806b239b007c8af8c"
              candidates = {json.loads(line)["id"]: json.loads(line) for line in (graph / "missing_candidates.jsonl").read_text().splitlines() if line.strip()}
              assert candidates["missing.622459998fd4b876125d"].get("alias_of") == "missing.c4ed408b10943e9c0f8e"
              assert "missing.ded806b239b007c8af8c" in candidates
              print(json.dumps({
                  "status": "dry_run_only_no_repository_writes",
                  "prior_version": old_version,
                  "new_version": item["version_sha256"],
                  "formulations_scanned": state_after["scan_complete"],
                  "graph_missing_occurrences_unchanged": True,
                  "alias_and_amendment_history_preserved": True,
                  "resume_catalog_reanchoring_still_required": True
              }, indent=2))
          PY
