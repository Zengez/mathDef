name: Admit independent topology, linear kernel and derivative source variants — Batch 106

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-branch-source-batch106.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  research-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync newest independently researched main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reusable engine and adapter tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four source headings and seven individual mathematical paraphrases
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_branch_source_batch106 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile source-term coverage without altering old decisions
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify source-only changes, frozen lineage and graph preservation
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":445,"observations":891,"meanings":547,"relations":765}
          assert {s:len(w.records(s)) for s in counts}==counts
          assert not any(w.state(s).get("sealed") for s in counts)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(i)==v for i,v in first.records(s).items())
          ledger=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(ledger)==573 and dict(Counter(r["decision"] for r in ledger))=={"linked":567,"no_supported_target":6}
          assert {x for r in ledger for x in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross106_source_intake.json").read_text())
          assert report["new_screened_meanings"]==report["new_links"]==0
          assert report["incorrect_boundary_exterior_source_alternative_excluded"]
          assert report["module_kernel_vs_field_vector_space_kernel_distinct"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent source observations and historical review coverage
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit four cross-branch source terms and seven source observations preserving old mathematics"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
