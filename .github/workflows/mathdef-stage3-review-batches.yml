name: Apply independently reviewed Stage 3 mathematical batches

on:
  push:
    paths:
      - 'research_pipeline/experiments/reconstruction-v1-recovery/state/stage3_review_batch*.jsonl'
      - '.github/workflows/mathdef-stage3-review-batches.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-source-reviewed-stage3-batches
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout corrected research workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all isolation and evidence regression tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Validate then ingest reviewed mathematical batches idempotently
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          WORKSPACE=research_pipeline/experiments/reconstruction-v1-recovery
          batches=("$WORKSPACE"/state/stage3_review_batch*.jsonl)
          if [ "${#batches[@]}" -eq 0 ]; then
            echo "No source-reviewed mathematical batches present"
            exit 1
          fi
          for batch in "${batches[@]}"; do
            echo "Validating $batch"
            python -m research_pipeline.engine.stage3_apply_review \
              --workspace "$WORKSPACE" --batch "$batch" --check-only
            python -m research_pipeline.engine.stage3_apply_review \
              --workspace "$WORKSPACE" --batch "$batch"
          done
      - name: Commit only corrected evidence, decisions and progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1-recovery/records/observations.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/state/observations.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage3_term_reviews.jsonl \
            research_pipeline/experiments/reconstruction-v1-recovery/state/stage3_review_progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint source-reviewed Stage 3 mathematical evidence and per-term decisions"
            for retry in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent change; retry $retry"
            done
            echo "Unable to publish the reviewed batch safely" >&2
            exit 1
          fi
