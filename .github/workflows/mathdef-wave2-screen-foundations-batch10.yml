name: Screen six Wave 2 algebra order and topology meaning contexts

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-foundations-batch10.yml'
      - 'research_pipeline/engine/wave2_screen_foundations_batch10.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  meaning:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start with latest committed independent state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all research scripts and run isolated tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually screen six mathematical contexts and migrate prior 459 review rows
        run: |
          python -m research_pipeline.engine.wave2_screen_foundations_batch10 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh all 354 individual source-review rows
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify all individual old dispositions plus new context screen and no seal
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==frozen["published_catalog_digest"]
          expected={"sources":9,"terms":354,"observations":777,"meanings":453,"relations":582}
          for stage,n in expected.items():
              assert len(w.records(stage))==n,stage
              assert not w.state(stage).get("sealed"),stage
          for stage in ("sources","terms","observations","relations"):
              assert all(w.records(stage).get(k)==v for k,v in old.records(stage).items())
          before=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_459_before_foundations10.jsonl")
          after=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(before)==459 and len(after)==465
          index={x["formulation_id"]:x for x in after}
          assert len(index)==465
          for r in before:
              current=index[r["formulation_id"]]
              assert {k:v for k,v in current.items() if k!="meaning_catalog_digest"}=={
                  k:v for k,v in r.items() if k!="meaning_catalog_digest"}
          assert sum(x["decision"]=="needs_review" for x in after)==6
          assert {rid for x in after for rid in x["relation_ids"]}==set(w.records("relations"))
          for label in ("reduced-ring","ring-map-general","ring-map-unital","well-ordered-set",
                        "subspace-topology-general","subspace-topology-nonempty"):
              m=w.records("meanings")["meaning.wave2.foundation."+label]
              assert m["formulations"][0]["review_state"]=="screened"
              assert m["human_verified"] is False
          meanings=w.records("meanings")
          assert meanings["meaning.wave2.foundation.ring-map-general"]["term_group_id"]==meanings["meaning.wave2.foundation.ring-map-unital"]["term_group_id"]
          assert meanings["meaning.wave2.foundation.subspace-topology-general"]["term_group_id"]==meanings["meaning.wave2.foundation.subspace-topology-nonempty"]["term_group_id"]
          check_cycles(meanings,w.records("relations"))
          coverage=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==354
          assert coverage["mathematical_candidate_meanings_screened"]==34
          report=json.loads((w.root/"state/wave2_foundations_batch_10_screened.json").read_text())
          assert report["screened_links_preserved"]==582
          assert report["historical_review_rows_preserved"]==459
          assert report["new_formulation_reviews_pending"]==6
          assert report["wellorder_nonempty_subset_requirement_checked"] is True
          assert report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit ONLY independent source-screened meanings and historical 459-review snapshot
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen six individually sourced algebra order and topological-subspace context meanings"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
