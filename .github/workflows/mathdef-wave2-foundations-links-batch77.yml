name: Review module/topology dependencies and Noetherian-ring amendment — Batch 77

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-foundations-links-batch77.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  screen-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout current independent Wave 2 main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portable and mathDef-adapted pipeline regression
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually review seven exact prerequisite links and archived ring amendment
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_foundations_links_batch77 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify all older decisions, every screened link, no cycles, and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          want={"sources":14,"terms":414,"observations":848,"meanings":514,"relations":705}
          assert {s:len(w.records(s)) for s in want}==want
          assert not any(w.state(s).get("sealed") for s in want)
          for s in ("sources","terms","observations","relations"):
            assert all(w.records(s).get(k)==v for k,v in first.records(s).items())
          historical=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_537_before_foundation77.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          idx={r["formulation_id"]:r for r in current}
          assert len(historical)==len(current)==len(idx)==537
          changed={r["formulation_id"] for r in current if r["formulation_id"].startswith("form.wave2.foundation76.")}
          old_ring="form.wave2.variant71.noetherian.noetherian-as-module"
          changed.add(old_ring)
          assert len(changed)==8
          for prior in historical:
            if prior["formulation_id"] not in changed:
              assert idx[prior["formulation_id"]]==prior
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in current)
          assert {id for r in current for id in r["relation_ids"]}==set(w.records("relations"))
          assert dict(Counter(r["decision"] for r in current))=={"linked":530,"no_supported_target":7}
          assert len([id for id in w.records("relations") if id.startswith("rel.wave2.foundation77.")])==7
          check_cycles(w.records("meanings"),w.records("relations"))
          override=jsonl(w.root/"events/noetherian_module_review_amendment_batch77.jsonl")
          assert len(override)==1 and override[0]["previous_decision"]=="no_supported_target"
          assert idx[old_ring]["override_event_id"]==override[0]["event_id"]
          info=json.loads((w.root/"state/wave2_foundations_links_batch77.json").read_text())
          assert info["historical_698_links_preserved"]
          assert info["noetherian_ring_module_prior_no_target_amended_with_event"]
          assert info["submodule_base_module_definition_missing"]
          assert not info["production_corpus_used"] and not info["human_peer_verified"]
          print(json.dumps(info,indent=2))
          PY
      - name: Commit source-reviewed independent graph and historical audit records only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review seven module/topology links with archived Noetherian-ring correction"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
