name: Independently screen simple graph and loopless multigraph foundations

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-screen-graph-meanings43.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  meaning-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh authoritative independent Wave 2 source records
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all pipeline modules and run isolated tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Mathematically screen two graph meanings with preserved source conventions
        run: |
          python -m research_pipeline.engine.wave2_screen_graph_meanings43 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh source review summary preserving source term identities
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Check all 497 previous reviews, graph distinctions and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((first.root/"state/wave1_freeze.json").read_text())
          assert digest(first.publication())==frozen["published_catalog_digest"]
          assert len(w.records("sources"))==9 and len(w.records("terms"))==384
          assert len(w.records("observations"))==807 and len(w.records("meanings"))==487
          assert len(w.records("relations"))==655
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          historical=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_497_before_graph43.jsonl")
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(historical)==497 and len(now)==499
          by={r["formulation_id"]:r for r in now}
          assert len(by)==499
          for row in historical:
              assert {k:v for k,v in by[row["formulation_id"]].items() if k!="meaning_catalog_digest"}=={k:v for k,v in row.items() if k!="meaning_catalog_digest"}
          assert {rid for row in now for rid in row["relation_ids"]}==set(w.records("relations"))
          assert Counter(r["decision"] for r in now)=={"linked":491,"no_supported_target":5,"needs_review":3}
          check_cycles(w.records("meanings"),w.records("relations"))
          for slug in ("simple-undirected","loopless-undirected-multigraph"):
              m=w.records("meanings")["meaning.wave2.graph42."+slug]
              assert m["formulations"][0]["review_state"]=="screened"
          report=json.loads((w.root/"state/wave2_graph_meaning_screen_batch_43.json").read_text())
          assert report["previous_497_review_dispositions_preserved"] is True
          assert report["simple_vs_multigraph_multiplicity_separated"] is True
          assert report["new_formulations_requiring_dependency_review"]==2
          assert report["general_graph_source_still_unscreened"] is True
          assert report["human_peer_verified"] is False
          coverage=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert coverage["term_count"]==384 and coverage["mathematical_candidate_meanings_screened"]==68
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only graph meaning revisions and independent historical lineage
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen two graph foundations preserving 497 previous mathematical formulation reviews"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
