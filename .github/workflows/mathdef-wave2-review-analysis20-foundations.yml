name: Audit six unresolved DLMF and OpenStax mathematical foundations

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-review-analysis20-foundations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh latest committed independent Wave 2 data
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile math pipeline scripts and run all isolated tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Individually audit six unsatisfied precise mathematical prerequisites
        run: |
          python -m research_pipeline.engine.wave2_review_analysis20_missing_foundations \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/wave2/analysis20_remaining_mathematical_dependency_decisions.jsonl
      - name: Validate original 481 reviews and 623 links without fake prerequisite completion
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          old=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((old.root/"state/wave1_freeze.json").read_text())
          assert digest(old.publication())==freeze["published_catalog_digest"]
          assert len(w.records("sources"))==9 and len(w.records("terms"))==366
          assert len(w.records("observations"))==789
          assert len(w.records("meanings"))==469
          assert len(w.records("relations"))==623
          assert len(old.records("relations"))==445
          assert all(w.records("relations").get(k)==v for k,v in old.records("relations").items())
          assert not any(w.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          now=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          original=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_481_before_analysis20_dependency_reviews.jsonl")
          assert len(now)==len(original)==481
          present={x["formulation_id"]:x for x in now}
          assert len(present)==481
          oldindex={x["formulation_id"]:x for x in original}
          six={x["formulation_id"] for x in jsonl(w.root/"wave2/analysis20_remaining_mathematical_dependency_decisions.jsonl")}
          assert len(six)==6
          for fid in oldindex:
              assert present[fid]["relation_ids"]==oldindex[fid]["relation_ids"]
              if fid not in six:
                  assert present[fid]==oldindex[fid]
              else:
                  assert oldindex[fid]["decision"]=="needs_review"
                  assert present[fid]["decision"]=="no_supported_target"
                  assert present[fid]["original_wave2_pending_reason"]==oldindex[fid]["editorial_reason"]
          assert not any(x["decision"] in ("needs_review","held_ambiguity") for x in now)
          assert {rid for x in now for rid in x["relation_ids"]}==set(w.records("relations"))
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_analysis20_dependency_reviews_complete.json").read_text())
          assert report["pending_initial_reviews"]==0
          assert report["individual_new_foundation_no_target_decisions"]==6
          assert report["screened_relationships"]==623
          assert report["historical_481_review_snapshot_preserved"]
          assert report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent reviewed mathematical dispositions and evidence
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resolve seven DLMF/OpenStax formulation dependency reviews with six explicitly missing foundation cases"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
