name: Independently acquire OpenStax derivative and real absolute value source evidence

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-openstax-derivative-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh latest verified independent main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all mathematics pipeline modules and run regression tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Register only two individually read source observations
        run: |
          python -m research_pipeline.engine.wave2_foundations_batch21_real_analysis \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Refresh all 368 per-term reviews while preserving immutable 366-term history
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify precise rights, source evidence, review and frozen Wave 1 preservation
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          wave1=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          frozen=json.loads((wave1.root/"state/wave1_freeze.json").read_text())
          assert digest(wave1.publication())==frozen["published_catalog_digest"]
          expected={"sources":9,"terms":368,"observations":791,"meanings":469,"relations":623}
          for stage,n in expected.items():
              original=wave1.records(stage)
              current=w.records(stage)
              assert len(current)==n,stage
              if stage!="meanings":
                  assert all(current.get(k)==v for k,v in original.items()),stage
              assert not w.state(stage).get("sealed"),stage
          old=jsonl(w.root/"state/wave2_term_coverage_snapshot_366.jsonl")
          cur=jsonl(w.root/"state/wave2_term_coverage.jsonl")
          assert len(old)==366 and len(cur)==368
          index={r["term_id"]:r for r in cur}
          assert len(index)==368 and all(index.get(r["term_id"])==r for r in old)
          sr=json.loads((w.root/"state/wave2_term_coverage.json").read_text())
          assert sr["term_count"]==368
          assert sr["source_read_new_candidates"]==42
          assert sr["new_term_review_coverage"]==50
          assert sr["new_source_locators_unverified"]==8
          assert sr["mathematical_candidate_meanings_screened"]==50
          assert sr["complete_for_wave2_sealing"] is False
          source=jsonl(w.root/"wave2/foundation_source_discovery_batch_21.jsonl")
          assert len(source)==2
          assert all(r["source_access_outcome"]=="direct_page_read" and
                     r["meaning_screened"] is False and r["human_verified"] is False for r in source)
          assert all(r["source_id"]=="src.openstax_calculus" for r in source)
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==481 and len(set(r["formulation_id"] for r in reviews))==481
          assert {rid for r in reviews for rid in r["relation_ids"]}==set(w.records("relations"))
          result=json.loads((w.root/"state/wave2_foundations_batch_21.json").read_text())
          assert result["mathematical_meanings_screened"]==0
          assert result["links_screened"]==0
          assert result["old_planetmath_access_block_not_reclassified"]
          assert result["human_peer_verified"] is False
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only independently sourced research and archived source-review ledger
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Independently register two OpenStax calculus sources with archived 366-term review history"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
