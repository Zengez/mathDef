name: Seal independent Stage 2 terms

on:
  push:
    paths:
      - '.github/workflows/mathdef-stage2-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-stage2-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate research engine
        run: python -m unittest discover -s research_pipeline/tests -v

      - name: Fetch reviewed source index titles
        run: |
          python -m research_pipeline.engine.stage2_actions \
            --workspace research_pipeline/experiments/reconstruction-v1 \
            --manifest research_pipeline/experiments/reconstruction-v1/source_pages.jsonl \
            --output-dir research_pipeline/experiments/reconstruction-v1/stage2_actions_artifacts \
            --max-pages 12

      - name: Reconcile candidates and seal Stage 2
        run: |
          python -m research_pipeline.engine.stage2_finalize \
            --workspace research_pipeline/experiments/reconstruction-v1 \
            --artifact-dir research_pipeline/experiments/reconstruction-v1/stage2_actions_artifacts

      - name: Commit only isolated Stage 2 registry and checkpoint
        run: |
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            research_pipeline/experiments/reconstruction-v1/records/terms.jsonl \
            research_pipeline/experiments/reconstruction-v1/state/terms.json \
            research_pipeline/experiments/reconstruction-v1/state/checkpoint.json \
            research_pipeline/experiments/reconstruction-v1/state/stage2_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Seal independent Wave 1 Stage 2 title registry"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload audit and raw review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-seal-audit-${{ github.run_id }}
          path: research_pipeline/experiments/reconstruction-v1/stage2_actions_artifacts/
          retention-days: 30
          if-no-files-found: warn
