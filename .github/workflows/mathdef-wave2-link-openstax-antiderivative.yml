name: Review independently sourced OpenStax indefinite integral prerequisite

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-link-openstax-antiderivative.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest individually reviewed independent mathematical corpus
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all scripts and execute regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -v
      - name: Link source-specific indefinite integral to antiderivative definition
        run: |
          python -m research_pipeline.engine.wave2_apply_links \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/intake/wave2_curated_relations_batch_19.jsonl
      - name: Verify screened source anchor, historical decisions, cycles and frozen Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          assert len(w.records("sources"))==9
          assert len(w.records("terms"))==366
          assert len(w.records("observations"))==789
          assert len(w.records("meanings"))==469
          assert len(w.records("relations"))==623
          assert len(frozen.records("relations"))==445
          assert all(w.records("relations").get(k)==v for k,v in frozen.records("relations").items())
          assert not any(w.state(stage).get("sealed") for stage in ("sources","terms","observations","meanings","relations"))
          reviews=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==481
          assert len(set(r["formulation_id"] for r in reviews))==481
          assert sum(r["decision"]=="needs_review" for r in reviews)==6
          assert {rid for row in reviews for rid in row["relation_ids"]}==set(w.records("relations"))
          added=w.records("relations")["rel.wave2.batch19.indefinite-integral.to.antiderivative"]
          assert added["source_phrase"]=="antiderivative F"
          assert added["source_locator"]==added["target_locator"]=="https://openstax.org/books/calculus-volume-1/pages/4-10-antiderivatives"
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_link_review_batch_19.json").read_text())
          assert report["total_screened_links"]==623
          assert report["added_source_grounded_links"]==1
          assert report["dependency_graph_has_cycles"] is False
          assert report["human_peer_verified"] is False
          assert report["wave2_link_stage_sealed"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only one independently screened mathematical relationship and review lineage
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Individually screen source-anchored indefinite-integral antiderivative dependency"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
