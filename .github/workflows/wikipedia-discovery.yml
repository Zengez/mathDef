name: Discover missing Wikipedia mathematics terms
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wikipedia-discovery.yml']
  workflow_dispatch:
    inputs:
      category:
        description: "Wikipedia mathematics category (e.g. Complex analysis)"
        default: 'Several complex variables'
        required: true
        type: string
      depth:
        description: "Subcategory depth 0-2"
        default: "1"
        required: true
        type: string
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline scanner tests
        run: python -m unittest discover -s tests
      - name: Inventory category titles and compare glossary terms
        env:
          WIKI_CATEGORY: ${{ inputs.category || 'Several complex variables' }}
          WIKI_DEPTH: ${{ inputs.depth || '1' }}
        run: |
          python scripts/wikipedia_candidate_scan.py \
            --seed "$WIKI_CATEGORY" --depth "$WIKI_DEPTH" \
            --max-categories 12 --max-pages 1500 \
            --out _wikipedia_candidates.csv
      - name: Audit mathDef citation and coverage metadata
        run: python -m scripts.audit_corpus --out _definition_audit.csv
      - name: Upload editorial audit
        uses: actions/upload-artifact@v4
        with:
          name: definition-editorial-audit
          path: _definition_audit.csv
          retention-days: 30
      - name: Upload title-only candidate inventory
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-definition-candidates
          path: _wikipedia_candidates.csv
          retention-days: 30
