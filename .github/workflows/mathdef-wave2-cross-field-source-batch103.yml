name: Admit independent cross-field source variants — Batch 103 (guarded)

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-cross-field-source-batch103.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync latest independent research main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable regression and mathDef-adapter tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Admit four source headings and seven variants without mathematical promotion
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_cross_field_source_batch103 \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile per-term source review coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify frozen baseline and unchanged mathematical reviews
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          frozen=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(frozen.publication())==json.loads((frozen.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          counts={"sources":14,"terms":441,"observations":884,"meanings":541,"relations":754}
          assert {k:len(w.records(k)) for k in counts}==counts
          assert not any(w.state(k).get("sealed") for k in counts)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in frozen.records(k).items())
          ledger=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          assert len(ledger)==566 and dict(Counter(r["decision"] for r in ledger))=={"linked":560,"no_supported_target":6}
          assert {i for r in ledger for i in r["relation_ids"]}==set(w.records("relations"))
          check_cycles(w.records("meanings"),w.records("relations"))
          report=json.loads((w.root/"state/wave2_cross103_source_intake.json").read_text())
          assert report["new_screened_meanings"]==report["new_screened_links"]==0
          assert report["global_vs_anchored_lipschitz_distinct"]
          assert report["pairwise_vs_mutual_sigma_independence_distinct"]
          assert report["tree_two_equivalent_acyclicity_formulations_under_one_context"]
          assert not report["production_corpus_used"] and not report["human_peer_verified"]
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only independent source observations, term review and provenance
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Admit four independent cross-field terms and seven contextual source observations"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
