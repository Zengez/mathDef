name: Review product topology eigenvalue connected graph and real EGF links — Batch 130
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-branch-links-batch130.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  link-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run generic and mathDef research regression suite
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Individually screen twelve source-specific direct prerequisites
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_branch_links_batch130 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate all earlier reviews, wave freeze and noncircular math
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":473,"observations":938,"meanings":587,"relations":852}
          assert {k:len(w.records(k)) for k in expect}==expect
          assert not any(w.state(k).get("sealed") for k in expect)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          old=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_624_before_branch130.jsonl")
          current=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in current}
          assert len(old)==len(current)==len(ix)==624
          for p in old:
            if not p["formulation_id"].startswith("form.wave2.branch129."):
              assert ix[p["formulation_id"]]==p
          assert len([i for i in w.records("relations") if i.startswith("rel.wave2.branch130.")])==12
          assert dict(Counter(r["decision"] for r in current))=={"linked":618,"no_supported_target":6}
          assert {i for r in current for i in r["relation_ids"]}==set(w.records("relations"))
          assert all(r["meaning_catalog_digest"]==digest(list(w.records("meanings").values())) for r in current)
          for path in ("wave2/conv125_quarantined_source_claims.jsonl","wave2/quot118_quarantined_source_claims.jsonl","wave2/directional112_quarantined_source_claims.jsonl"):
            h=jsonl(w.root/path)
            assert len(h)==1 and h[0]["observation_id"] not in {i for m in w.records("meanings").values() for f in m["formulations"] for i in f["evidence_ids"]}
          check_cycles(w.records("meanings"),w.records("relations"))
          result=json.loads((w.root/"state/wave2_branch130_link_review.json").read_text())
          assert result["all_old_840_relations_preserved"] and result["all_618_unrelated_formulation_decisions_preserved"]
          assert result["operator_eigenvalue_noncircular_with_eigenvector"]
          assert not result["human_peer_verified"] and not result["production_corpus_used"]
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only independent reviewed links and historical dispositions
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Individually review twelve product topology operator eigenvalue graph and EGF prerequisites"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
