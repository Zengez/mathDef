name: Wave 2 first independent foundational source recovery

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-foundations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  first-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh isolated Wave 2 and frozen Wave 1
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent Python tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Intake directly supported foundational definitions; record blocked leads
        run: |
          python -m research_pipeline.engine.wave2_foundations \
             --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify frozen original and every inherited Wave 1 record remains unchanged
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from research_pipeline.engine.core import Workspace,digest,jsonl
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          second=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((first.root/"state/wave1_freeze.json").read_text())
          assert freeze["state"]=="FROZEN"
          assert freeze["published_catalog_digest"]==digest(first.publication())
          for st,old_size,new_size in (("sources",9,9),("terms",318,327),
                  ("observations",749,750),("meanings",419,419),("relations",445,445)):
              inherited=first.records(st)
              expanded=second.records(st)
              assert len(inherited)==old_size and len(expanded)==new_size,st
              assert all(expanded.get(k)==v for k,v in inherited.items()),st
          x=json.loads((second.root/"state/wave2_foundations_batch_01.json").read_text())
          assert x["directly_read_and_source_checked"]==1
          assert x["discovered_via_search_only_not_verified"]==8
          assert x["published_as_screened_definition"] is False
          assert len(jsonl(second.root/"wave2/foundation_source_discovery_batch_01.jsonl"))==9
          print(json.dumps(x,indent=2))
          PY
      - name: Commit only the second-wave foundation intake and state
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then
            echo "Refusing to commit changes outside Wave 2" >&2
            exit 1
          fi
          git commit -m "Source-screen first Wave 2 foundation; checkpoint eight unresolved encyclopedia leads"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Unable to commit independently researched first Wave 2 batch" >&2
          exit 1
