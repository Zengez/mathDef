name: Audit and correct Stacks presheaf variance and strictness

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-correct-presheaves.yml'
      - 'research_pipeline/engine/wave2_correct_presheaves.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start from latest independent checkpoint
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full isolated pipeline test suite
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Apply individually reviewed candidate-then-screened mathematical corrections
        run: |
          python -m research_pipeline.engine.wave2_correct_presheaves \
            --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Confirm historical review identities, exact source anchors and immutable Wave 1
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,digest,jsonl
          from research_pipeline.engine.wave2_apply_links import check_cycles
          original=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          work=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          freeze=json.loads((original.root/"state/wave1_freeze.json").read_text())
          assert digest(original.publication())==freeze["published_catalog_digest"]
          assert len(work.records("meanings"))==431
          assert len(work.records("relations"))==545
          assert len(original.records("relations"))==445
          reviews=jsonl(work.root/"state/wave2_formulation_reviews.jsonl")
          historical=jsonl(work.root/"state/wave2_formulation_reviews_snapshot_443_before_presheaf_correction.jsonl")
          assert len(reviews)==len(historical)==443
          before={r["formulation_id"]:r for r in historical}
          after={r["formulation_id"]:r for r in reviews}
          assert set(before)==set(after)
          assert all(before[k]["relation_ids"]==after[k]["relation_ids"] and
                     before[k]["decision"]==after[k]["decision"] and
                     before[k]["original_wave1_disposition"]==after[k]["original_wave1_disposition"]
                     for k in before)
          assert {id for r in reviews for id in r["relation_ids"]}==set(work.records("relations"))
          for k in ("meaning.f7206eb9332b9389.category-valued-presheaf",
                    "meaning.f0d993a60533fc99.groupoid-valued-presheaf"):
              form=work.records("meanings")[k]["formulations"][0]
              assert form["review_state"]=="screened"
              assert "C^op" in form["text"] and "pseudofunctor" not in form["text"]
          check_cycles(work.records("meanings"),work.records("relations"))
          assert not any(work.state(stage).get("sealed") for stage in
             ("sources","terms","observations","meanings","relations"))
          report=json.loads((work.root/"state/wave2_presheaf_math_corrections.json").read_text())
          assert report["corrected_formulations"]==2
          assert report["relations_preserved"]==545
          assert report["review_snapshotted_before_catalog_rebase"]
          assert report["historical_wave1_dispositions_preserved"]
          assert report["human_peer_verified"] is False
          print(json.dumps(report,indent=2))
          PY
      - name: Commit only revised independent Wave 2 corpus and immutable revision history
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then
            echo "Refusing out-of-scope changes" >&2
            exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct two Stacks presheaf formulations through audited Wave 2 candidate revisions"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
