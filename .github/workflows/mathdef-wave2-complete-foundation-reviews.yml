name: Complete individually audited Wave 2 foundation link dispositions

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-complete-foundation-reviews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout most recent committed Wave 2
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research pipeline regression tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Apply three individual evidence-grounded no-target reviews
        run: |
          python -m research_pipeline.engine.wave2_complete_foundation_reviews \
            --workspace research_pipeline/experiments/reconstruction-v2-independent \
            --batch research_pipeline/experiments/reconstruction-v2-independent/wave2/foundation_no_supported_target_reviews_batch_01.jsonl
      - name: Confirm inherited Wave 1 and candidate review integrity
        run: |
          python - <<'PY'
          import json
          from research_pipeline.engine.core import Workspace,jsonl,digest
          one=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          two=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(one.publication())==json.loads((one.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          assert len(one.records("relations"))==445
          assert len(two.records("relations"))==481
          reviews=jsonl(two.root/"state/wave2_formulation_reviews.jsonl")
          assert len(reviews)==440 and len(set(r["formulation_id"] for r in reviews))==440
          assert sum(r["decision"]=="needs_review" for r in reviews)==0
          assert sum(r["decision"]=="held_ambiguity" for r in reviews)==2
          assert {x for r in reviews for x in r["relation_ids"]}==set(two.records("relations"))
          report=json.loads((two.root/"state/wave2_foundation_dependency_reviews_complete.json").read_text())
          assert report["remaining_new_formulations_needing_review"]==0
          assert report["stage5_wave2_sealed"] is False
          assert report["human_peer_verified"] is False
          assert not any(two.state(s).get("sealed") for s in ("sources","terms","observations","meanings","relations"))
          print(json.dumps(report,indent=2))
          PY
      - name: Commit reviewed Wave 2 formulation dispositions only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resolve three new foundation link reviews without fabricating missing dependencies"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
