name: Screen independent product topology eigenvalue graph and EGF meanings — Batch 129
on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-branch-meanings-batch129.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false
jobs:
  mathematical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync independent main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable unit and integration tests
        run: |
          python -m compileall -q research_pipeline/engine research_pipeline/adapters/mathdef research_pipeline/tests
          python -m unittest discover -s research_pipeline/tests -q
      - name: Screen four mathematical contexts and six individual formulations
        run: |
          python -m research_pipeline.adapters.mathdef.wave2_branch_meanings_batch129 --workspace research_pipeline/experiments/reconstruction-v2-independent
      - name: Reconcile independently sourced term coverage
        run: |
          python -m research_pipeline.engine.wave2_term_coverage --wave1 research_pipeline/experiments/reconstruction-v1-recovery --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Validate exact mathematical scopes and historic review dispositions
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from research_pipeline.engine.core import Workspace,jsonl,digest
          from research_pipeline.engine.wave2_apply_links import check_cycles
          first=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          w=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          assert digest(first.publication())==json.loads((first.root/"state/wave1_freeze.json").read_text())["published_catalog_digest"]
          expect={"sources":14,"terms":473,"observations":938,"meanings":587,"relations":840}
          assert {k:len(w.records(k)) for k in expect}==expect
          assert not any(w.state(k).get("sealed") for k in expect)
          for k in ("sources","terms","observations","relations"):
            assert all(w.records(k).get(i)==r for i,r in first.records(k).items())
          m=w.records("meanings")
          assert len([v for v in m if v.startswith("meaning.wave2.branch129.")])==4
          assert len(m["meaning.wave2.branch129.indexed-product-topology"]["formulations"])==2
          assert len(m["meaning.wave2.branch129.operator-eigenvalue"]["formulations"])==2
          before=jsonl(w.root/"state/wave2_formulation_reviews_snapshot_618_before_branch129.jsonl")
          after=jsonl(w.root/"state/wave2_formulation_reviews.jsonl")
          ix={r["formulation_id"]:r for r in after}
          assert len(before)==618 and len(after)==len(ix)==624
          for r in before:
            new=ix[r["formulation_id"]]
            assert all(new.get(k)==v for k,v in r.items() if k!="meaning_catalog_digest")
          assert dict(Counter(r["decision"] for r in after))=={"linked":612,"no_supported_target":6,"needs_review":6}
          assert all(r["meaning_catalog_digest"]==digest(list(m.values())) for r in after)
          assert {i for r in after for i in r["relation_ids"]}==set(w.records("relations"))
          for path in ("wave2/conv125_quarantined_source_claims.jsonl","wave2/quot118_quarantined_source_claims.jsonl","wave2/directional112_quarantined_source_claims.jsonl"):
            h=jsonl(w.root/path)
            assert len(h)==1 and h[0]["observation_id"] not in {i for mm in m.values() for f in mm["formulations"] for i in f["evidence_ids"]}
          check_cycles(m,w.records("relations"))
          result=json.loads((w.root/"state/wave2_branch129_meaning_screen.json").read_text())
          assert result["old_618_formulation_decisions_and_840_links_preserved"]
          assert result["product_subbasis_finite_support_basis_equivalent"]
          assert not result["human_peer_verified"] and not result["production_corpus_used"]
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only independently screened mathematical evidence
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent
          if git diff --cached --name-only | grep -v '^research_pipeline/experiments/reconstruction-v2-independent/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen product topology, operator eigenvalue, connected graph and EGF contexts"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
