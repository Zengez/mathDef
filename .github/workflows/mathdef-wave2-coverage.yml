name: Verify independent Wave 2 per-term source review coverage

on:
  push:
    paths:
      - '.github/workflows/mathdef-wave2-coverage.yml'
      - 'research_pipeline/engine/wave2_term_coverage.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathdef-independent-wave2-writes
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify newest GitHub workspace
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full isolated regression tests
        run: python -m unittest discover -s research_pipeline/tests -v
      - name: Build evidence-backed, full Wave 2 term inventory
        run: |
          python -m research_pipeline.engine.wave2_term_coverage \
            --wave1 research_pipeline/experiments/reconstruction-v1-recovery \
            --wave2 research_pipeline/experiments/reconstruction-v2-independent
      - name: Verify missing-source review blocks premature Stage 3 seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_pipeline.engine.core import Workspace,PipelineError,jsonl,digest
          orig=Workspace("research_pipeline/experiments/reconstruction-v1-recovery")
          fork=Workspace("research_pipeline/experiments/reconstruction-v2-independent")
          report=json.loads((fork.root/"state/wave2_term_coverage.json").read_text())
          rows=jsonl(fork.root/"state/wave2_term_coverage.jsonl")
          assert report["term_count"]==len(rows)==len(fork.records("terms")) and len(rows) in (336,339)
          assert report["new_term_review_coverage"]==len(rows)-318
          assert report["source_read_new_candidates"]==len(rows)-326
          assert report["new_source_locators_unverified"]==8
          assert report["complete_for_wave2_sealing"] is False
          assert {x["term_id"] for x in rows}==set(fork.records("terms"))
          assert len(orig.records("terms"))==318
          assert not any(fork.state(s).get("sealed") for s in (
                "sources","terms","observations","meanings","relations"))
          try:
              fork.seal("observations")
          except PipelineError as exc:
              assert "Wave 2 cannot seal" in str(exc),str(exc)
          else:
              raise AssertionError("Unsafe Stage 3 seal bypassed incomplete Wave 2 reviews")
          print(json.dumps(report,indent=2))
          PY
      - name: Commit comprehensive source review coverage to Wave 2 only
        run: |
          set -euo pipefail
          git config user.name "mathDef Research Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_pipeline/experiments/reconstruction-v2-independent/state/wave2_term_coverage.json \
                     research_pipeline/experiments/reconstruction-v2-independent/state/wave2_term_coverage.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Audit all 336 Wave 2 source terms; hold 8 unverified locators and unapproved meanings"
            for retry in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Unable to persist expanded source coverage" >&2
            exit 1
          fi
